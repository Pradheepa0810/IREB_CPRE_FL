  {id:"ch3-q3",question:"What is a major weakness of natural-language requirements?",options:["They cannot be understood by stakeholders","They can be ambiguous","They cannot describe functionality","They cannot be documented electronically"],correctIndex:1,explanation:"Natural language is accessible but can be ambiguous and imprecise."},
  {id:"ch3-q4",question:"Which statement about natural language is correct?",options:["Natural language requirements are always ambiguous","Natural language requirements can never be verified","Natural language can be useful but needs to be written carefully","Natural language should never be used in requirements"],correctIndex:2,explanation:"Natural language is useful when written with appropriate care and quality controls."},
  {id:"ch3-q5",question:"What is the purpose of a requirements template?",options:["To provide a predefined structure for describing requirements","To eliminate requirements analysis","To automatically generate source code","To prevent requirement changes"],correctIndex:0,explanation:"Templates promote consistency and completeness of descriptions."},
  {id:"ch3-q6",question:"What is a glossary used for?",options:["Defining important terms consistently","Tracking source-code versions","Replacing requirements","Defining project costs"],correctIndex:0,explanation:"A glossary establishes consistent meanings for important terms."},
  {id:"ch3-q7",question:"Why are models useful in Requirements Engineering?",options:["They can represent structures, relationships and behavior in a systematic way","They always eliminate ambiguity","They eliminate the need for stakeholders","They always replace natural language"],correctIndex:0,explanation:"Models systematically represent selected aspects of requirements."},
  {id:"ch3-q8",question:"Which statement about models is correct?",options:["Models can communicate certain aspects of requirements more effectively than text","Models are always superior to natural language","Models never require explanation","Models cannot represent behavior"],correctIndex:0,explanation:"Models can complement text and communicate some aspects more effectively."},
  {id:"ch3-q9",question:"What does it mean for a requirement to be unambiguous?",options:["It contains no technical terms","It has only one reasonable interpretation","It is very long","It contains no numbers"],correctIndex:1,explanation:"An unambiguous requirement has one reasonable interpretation."},
  {id:"ch3-q10",question:"What does completeness mean?",options:["Every requirement has exactly 100 words","All necessary information relevant to the specified scope is present","The document contains no diagrams","All requirements have the same priority"],correctIndex:1,explanation:"Completeness means necessary information for the defined scope is included."},
  {id:"ch3-q11",question:"What does consistency mean?",options:["All requirements are written in exactly the same sentence structure","Requirements do not contradict each other","Every requirement has the same priority","All requirements are functional"],correctIndex:1,explanation:"Consistent requirements do not contradict one another."},
  {id:"ch3-q12",question:"What does verifiability mean?",options:["A requirement can be checked to determine whether it has been fulfilled","A requirement contains source code","A requirement is approved by management","A requirement is written in English"],correctIndex:0,explanation:"A verifiable requirement can be checked objectively for fulfilment."},
  {id:"ch3-q13",question:"Which requirement is most verifiable?",options:["The system shall respond quickly.","The system shall provide excellent performance.","The system shall respond within 200 ms under defined operating conditions.","The system shall be highly responsive."],correctIndex:2,explanation:"A defined response limit and operating conditions make the requirement measurable."},
  {id:"ch3-q14",question:"Which requirement is most ambiguous?",options:["The system shall store the user's name.","The system shall respond within 500 ms.","The system shall provide appropriate feedback.","The system shall operate between -40 C and 85 C."],correctIndex:2,explanation:"Appropriate feedback requires interpretation and lacks defined criteria."},
  {id:"ch3-q15",question:"The system shall process requests quickly. Which quality criterion is primarily violated?",options:["Unambiguity","Verifiability","Both A and B","Traceability only"],correctIndex:2,explanation:"Quickly is ambiguous and lacks an objective threshold, making verification difficult."},
  {id:"ch3-q16",question:"The system shall support a large number of users. What is the main problem?",options:["The requirement is too implementation-specific","Large number is undefined","It is necessarily inconsistent","It is necessarily a constraint"],correctIndex:1,explanation:"The quantity must be defined, for example as a minimum number of concurrent users."},
  {id:"ch3-q17",question:"Which requirement is best written?",options:["The system should normally respond very quickly.","The system must be user-friendly.","The system shall display the requested information within 2 seconds.","The system shall provide excellent performance."],correctIndex:2,explanation:"The response time is objectively measurable."},
  {id:"ch3-q18",question:"R1 allows password lengths from 8 to 20 characters; R2 rejects passwords shorter than 12. What is this?",options:["Ambiguity","Inconsistency","Incompleteness only","No problem"],correctIndex:1,explanation:"The rules conflict for passwords of length 8 through 11."},
  {id:"ch3-q19",question:"The system shall send a notification when an error occurs. What information may be missing?",options:["Which errors trigger notification","Who receives the notification","What notification is sent","All of the above"],correctIndex:3,explanation:"The triggering conditions, recipient, and notification content may all need specification."},
  {id:"ch3-q20",question:"What is the primary purpose of a glossary in requirements documentation?",options:["To define important domain-specific terms","To define test cases","To assign developers to requirements","To calculate project cost"],correctIndex:0,explanation:"A glossary defines domain terminology consistently."},
  {id:"ch3-q21",question:"Two teams use different meanings for the word fault. What would help address this problem?",options:["Glossary","More source code","More project meetings only","Removing the word entirely"],correctIndex:0,explanation:"A glossary can establish the agreed meaning of fault."},
  {id:"ch3-q22",question:"Why is consistent terminology important?",options:["Different terms can cause misunderstandings","It reduces the need for interpretation","It supports shared understanding","All of the above"],correctIndex:3,explanation:"Consistent terminology reduces interpretation differences and supports shared understanding."},
  {id:"ch3-q23",question:"The system shall support normal operating conditions. What is the primary issue?",options:["Normal operating conditions may not be sufficiently defined","The requirement is too implementation-specific","It is necessarily a functional requirement","It is already perfectly measurable"],correctIndex:0,explanation:"Normal operating conditions need explicit definition."},
  {id:"ch3-q24",question:"Which statement about requirements documentation is most appropriate?",options:["Every requirement must use natural language","Every requirement must use models","The documentation technique should be selected according to purpose and context","Requirements should not be documented until implementation"],correctIndex:2,explanation:"The suitable technique depends on requirements, stakeholders, project, purpose, and context."},
  {id:"ch3-q25",question:"The system shall provide an easy-to-use interface. Which quality criterion is most questionable?",options:["Verifiability","Ambiguity","Both A and B","Neither"],correctIndex:2,explanation:"Easy-to-use is open to interpretation and lacks measurable acceptance criteria."},
  {id:"ch3-q26",question:"The system shall display the vehicle speed. Is this necessarily complete?",options:["Yes, because it is unambiguous","Yes, because it describes functionality","Not necessarily; important details may still be missing","No requirement can ever be complete"],correctIndex:2,explanation:"Display location, unit, update rate, conditions, and unavailable-signal behavior may be missing."},
  {id:"ch3-q27",question:"A requirement is complete but ambiguous. Is that possible?",options:["No","Yes","Only in agile projects","Only for quality requirements"],correctIndex:1,explanation:"Completeness and ambiguity are separate quality criteria."},
  {id:"ch3-q28",question:"A requirement is unambiguous but incomplete. Is that possible?",options:["No","Yes","Only when natural language is used","Only when models are used"],correctIndex:1,explanation:"A requirement can have one interpretation while omitting necessary information."},
  {id:"ch3-q29",question:"Which requirement has the strongest verifiability?",options:["The system shall be highly available.","The system shall rarely fail.","The system shall have an availability of at least 99.99% during defined operating periods.","The system shall be extremely reliable."],correctIndex:2,explanation:"A measurable percentage and defined operating period support objective verification."},
  {id:"ch3-q30",question:"Does formally defined mathematical notation automatically make a requirement high quality?",options:["Yes","No","Only if management approves it","Only if it is longer than natural language"],correctIndex:1,explanation:"Notation can reduce some ambiguity but does not guarantee overall quality."},
  {id:"ch3-q31",question:"A team replaces every natural-language requirement with a model. Has it necessarily improved the requirements?",options:["Yes","No","Only if the models are colorful","Only if the project is agile"],correctIndex:1,explanation:"The chosen technique must communicate the required information effectively; models also have limitations."},
  {id:"ch3-q32",question:"Does using shall automatically make a requirement good?",options:["Yes","No","Only in safety-critical systems","Only when approved"],correctIndex:1,explanation:"Shall indicates obligation but does not guarantee completeness, consistency, clarity, or verifiability."},
  {id:"ch3-q33",question:"Which statement is most accurate?",options:["A requirement can be perfectly understandable but not verifiable","A requirement that is verifiable must always be complete","Ambiguous requirements are always inconsistent","Complete requirements are automatically feasible"],correctIndex:0,explanation:"A statement such as attractive may be understandable yet difficult to verify objectively."},
  {id:"ch3-q34",question:"Two requirements use different terms for the same concept. What is the main concern?",options:["Terminology inconsistency","Functional inconsistency necessarily","Technical infeasibility necessarily","Lack of requirements"],correctIndex:0,explanation:"Different terms for one concept can cause terminology inconsistency and misunderstanding."},
  {id:"ch3-q35",question:"The steering system shall react immediately to driver input. What quality problem is exposed?",options:["Lack of verifiability","Ambiguity","Both A and B","Lack of traceability only"],correctIndex:2,explanation:"Immediately has no defined meaning or measurable threshold."},
  {id:"ch3-q36",question:"The steering system shall react within 50 ms. Has the requirement automatically become complete?",options:["Yes","No, other relevant conditions may still need to be specified","Yes, because numbers guarantee completeness","No requirement can ever be complete"],correctIndex:1,explanation:"Input, operating conditions, measurement point, and response behavior may still be missing."},
  {id:"ch3-q37",question:"The system shall detect all critical steering faults. What is the most obvious problem?",options:["Critical may need definition","All is always forbidden","It is necessarily a solution","It is necessarily a constraint"],correctIndex:0,explanation:"Critical faults need an agreed and documented definition."},
  {id:"ch3-q38",question:"Two projects use different meanings for fault. What should you establish?",options:["A common glossary/terminology","A new programming language","A new testing tool","A new architecture"],correctIndex:0,explanation:"A common glossary prevents terminology misunderstandings."},
  {id:"ch3-q39",question:"The system shall provide sufficient torque. What is the primary issue?",options:["Sufficient has no defined threshold","Torque can never be measured","It is necessarily a solution","It is already fully verifiable"],correctIndex:0,explanation:"Sufficient needs a defined quantitative or otherwise objective threshold."},
  {id:"ch3-q40",question:"The system shall operate under extreme conditions. What should the Requirements Engineer do?",options:["Assume the tester knows","Define the relevant conditions explicitly","Delete the requirement","Tell the tester to interpret it as needed"],correctIndex:1,explanation:"Relevant extreme conditions must be explicitly defined."},
  {id:"ch3-q41",question:"A specification has 500 requirements. Why does this not prove completeness?",options:["Number of requirements does not establish completeness","A specification should never contain more than 100 requirements","More requirements always reduce quality","Completeness is determined by document length"],correctIndex:0,explanation:"Completeness depends on necessary scope information, not document size."},
  {id:"ch3-q42",question:"Which are desirable qualities of requirements?",options:["Unambiguous","Verifiable","Consistent","Understandable","Intentionally vague"],correctIndices:[0,1,2,3],explanation:"Desirable qualities include being unambiguous, verifiable, consistent, and understandable."},
  {id:"ch3-q43",question:"Which problems can occur with natural-language requirements?",options:["Ambiguity","Imprecision","Inconsistent terminology","Misinterpretation","Natural language cannot express requirements"],correctIndices:[0,1,2,3],explanation:"Natural language is useful but can introduce ambiguity, imprecision, terminology problems, and misinterpretation."},
  {id:"ch3-q44",question:"Which techniques can support requirements documentation?",options:["Natural language","Templates","Models","Glossaries","Source code only"],correctIndices:[0,1,2,3],explanation:"Natural language, templates, models, and glossaries can all support documentation."},
  {id:"ch3-q45",question:"Which statements about a glossary are correct?",options:["It can define domain-specific terminology","It can support consistent use of terms","It can reduce misunderstandings","It automatically makes every requirement complete","It can be particularly useful when terms have specialized meanings"],correctIndices:[0,1,2,4],explanation:"A glossary improves terminology consistency and reduces misunderstanding, but cannot automatically ensure completeness."},
  {id:"ch3-q46",question:"Which statements about models are correct?",options:["Models can represent relationships","Models can represent behavior","Models can complement natural language","Models always eliminate ambiguity","Different model types are suitable for different purposes"],correctIndices:[0,1,2,4],explanation:"Models represent relationships and behavior, complement text, and suit different purposes; they do not guarantee no ambiguity."},
  {id:"ch3-q47",question:"Which statements about requirement quality are correct?",options:["A requirement can be ambiguous","A requirement can be incomplete","A requirement can be inconsistent with another requirement","A requirement can be difficult or impossible to verify","A requirement containing shall is automatically high quality"],correctIndices:[0,1,2,3],explanation:"Ambiguity, incompleteness, inconsistency, and poor verifiability are possible quality problems; shall alone is not enough."},
  {id:"ch3-q48",question:"The system shall display the current vehicle speed in km/h. Is this necessarily high quality?",options:["Yes, because it is precise","No, quality depends on several criteria, and important information may still be missing","Yes, because it uses a measurable unit","No, because requirements must never contain units"],correctIndex:1,explanation:"Location, timing, update frequency, accuracy, and invalid-signal behavior may still be unspecified."},
  {id:"ch3-q49",question:"R1 detects a fault within 10 ms; R2 detects the same fault within 100 ms. Are these necessarily inconsistent?",options:["Yes, always","No, it depends on the exact context and interpretation","No requirements can be inconsistent","Yes, because numbers are involved"],correctIndex:1,explanation:"They conflict if they refer to the same condition and measurement, but may differ by fault class or operating mode."},
  {id:"ch3-q50",question:"The system shall provide the maximum possible safety. What is the strongest criticism?",options:["It is too short","Maximum possible safety is difficult to define and verify objectively","It contains no implementation detail","It is definitely a functional requirement"],correctIndex:1,explanation:"Maximum possible safety lacks an objective definition and verification basis."},
  {id:"ch3-q51",question:"Which statement is TRUE?",options:["If a requirement is unambiguous, it is complete","If a requirement is complete, it is consistent","If a requirement is verifiable, it is necessarily unambiguous","These are separate quality criteria and one does not automatically guarantee the others"],correctIndex:3,explanation:"Unambiguity, completeness, consistency, and verifiability are distinct criteria."},
  {id:"ch3-q52",question:"What is the best response to: The requirement is written in natural language, therefore it is ambiguous?",options:["Correct","Incorrect — natural language can be ambiguous, but it is not necessarily ambiguous","Correct only for automotive systems","Correct only for agile systems"],correctIndex:1,explanation:"Natural language can be clear and verifiable when written carefully."},
  {id:"ch3-q53",question:"A model contains exactly the same ambiguity as the corresponding natural-language requirement. What can you conclude?",options:["The model has solved the ambiguity","The model is useless","Changing documentation notation does not automatically solve an underlying ambiguity","Models cannot be used for requirements"],correctIndex:2,explanation:"Changing notation alone does not resolve an unclear underlying meaning."},
  {id:"ch3-q54",question:"A stakeholder says the requirement is complete because I personally know what it means. What is the best response?",options:["Personal knowledge is sufficient","Completeness and shared understanding must be considered from the perspective of the relevant stakeholders and purpose","Stakeholders should not be involved","The requirement should be deleted"],correctIndex:1,explanation:"Completeness and shared understanding must be assessed for the relevant audience and purpose."},
  {id:"ch3-q55",question:"A mandatory template has 25 fields, many irrelevant to a requirement. What is the likely problem?",options:["The requirements automatically become higher quality","Documentation is becoming unnecessarily burdensome","More fields always mean greater completeness","Templates should never be used"],correctIndex:1,explanation:"Templates should support quality rather than create unnecessary bureaucracy."},
 ]
},
{id:"ch4",number:4,title:"Requirements Elicitation, Negotiation, and Validation",
 subchapters:[
  {id:"ch4-1",title:"Elicitation Techniques",flashcards:[
    {id:"ch4-1-f1",front:"What is the difference between 'collecting' and 'eliciting' requirements?",back:"'Collection' implies requirements already exist and just need gathering.\n\n'Elicitation' acknowledges that requirements are often TACIT, CONFLICTING, or INCOMPLETE — they must be actively DISCOVERED, CLARIFIED, and CONSTRUCTED through collaboration with stakeholders."},
    {id:"ch4-1-f2",front:"Name the main categories of elicitation techniques.",back:"1. Interview-based: structured/unstructured interviews, questionnaires\n2. Creativity: brainstorming, 635 method, perspective-based reading\n3. Document-centric: document analysis, legacy system analysis (system archaeology)\n4. Observation-based: field observation, apprenticing, ethnography\n5. Workshop-based: requirements workshops, focus groups, JAD sessions\n6. Prototyping: UI mockups, evolutionary prototypes"},
    {id:"ch4-1-f3",front:"What is brainstorming used for in RE, and when is it most suitable?",back:"Brainstorming generates many ideas quickly in a group. Rules: no criticism during generation, quantity over quality, build on others' ideas.\n\nBest with: informal, creative groups who respect each other.\nNot best for: eliciting from large user groups or clarifying boundaries."},
    {id:"ch4-1-f4",front:"What is field observation / apprenticing / ethnography?",back:"Observing users in their ACTUAL WORK ENVIRONMENT without interfering.\n\nReveals TACIT KNOWLEDGE — things users do naturally but cannot articulate in an interview. Uncovers real (vs. reported) work practices.\n\nBest for: critical systems where usability/context matters (e.g., ICU medical systems)."},
    {id:"ch4-1-f5",front:"What is interface analysis used for in elicitation?",back:"Interface analysis identifies and clarifies the BOUNDARIES of the system — what data, events, and interactions cross the system boundary.\n\nBest technique for: clarifying system interfaces and boundaries, understanding all inputs/outputs.\n\nAll interface changes can affect the system and must therefore all be defined."},
    {id:"ch4-1-f6",front:"What is system archaeology / reverse-engineering?",back:"Analysing an existing legacy system (code, documents, or decompilation) to recover undocumented requirements.\n\nUsed when: there is no documentation and original developers have left.\n\nReverse-engineering of code can recover requirements but has legal/copyright considerations."},
    {id:"ch4-1-f7",front:"What is the Kano model in RE?",back:"Classifies requirements into 3 groups:\n• Must-be (basic/standard) – absence causes dissatisfaction; presence is expected\n• Performance (one-dimensional) – LINEAR relationship: more = more satisfaction\n• Excitement (attractive) – unexpected; absence is OK but presence DELIGHTS\n\nUseful for prioritisation and discovering hidden needs."},
  ]},
  {id:"ch4-2",title:"Negotiation and Conflict Resolution",flashcards:[
    {id:"ch4-2-f1",front:"What types of conflicts arise in requirements, and which can the RE best handle?",back:"Types: Data, Interest, Value, Relationship, Structural/Architectural conflicts.\n\nRE can best handle: SUBJECT MATTER (data/interest/value) conflicts through facilitation and negotiation.\n\nRE is LEAST suited for: Architectural conflicts (technical) and Cost conflicts (management decisions)."},
    {id:"ch4-2-f2",front:"How should a Requirements Engineer handle conflicts in projects?",back:"BEST approach:\n1. Analyse the conflict\n2. Try to bring about a solution with a suitable technique\n3. Document relevant information about the conflict and resolution\n\nDO NOT: ignore it, escalate immediately, or impose a decision unilaterally."},
    {id:"ch4-2-f3",front:"What does MoSCoW stand for in prioritisation?",back:"• Must have – critical; project fails without it\n• Should have – important but not critical\n• Could have – nice to have if resources allow\n• Won't have (this time) – explicitly out of scope for THIS release (not rejected permanently)\n\nThe 'o's in MoSCoW have no meaning — just to make it pronounceable."},
    {id:"ch4-2-f4",front:"Which criterion is NOT a sensible criterion for prioritising requirements?",back:"The EFFORT for VALIDATION of requirements is NOT a good prioritisation criterion.\n\nGood criteria include: business impact, risk, cost of implementation, dependency on other requirements, legal/regulatory obligation, release planning.\n\n(Exam question: option C — validation effort — was the wrong criterion.)"},
  ]},
  {id:"ch4-3",title:"Requirements Validation",flashcards:[
    {id:"ch4-3-f1",front:"What is requirements validation?",back:"Checks that the documented requirements CORRECTLY AND COMPLETELY REFLECT STAKEHOLDER NEEDS.\n\n→ 'Are we building the RIGHT system?'\n\nDiffers from verification: 'Are we building it RIGHT?' (implementation vs. requirements).\n\nValidation is done DURING RE; verification is done DURING testing."},
    {id:"ch4-3-f2",front:"What techniques are used for requirements validation?",back:"• Reviews / Inspections – structured examination by reviewers\n• Walkthroughs – author presents, reviewers respond\n• Prototyping – stakeholders react to a mockup\n• Test-case derivation – try to write tests; impossible test = unverifiable req\n• Perspective-based reading – reviewers adopt different roles (user/tester/developer)\n• Simulation / animation of models\n\nNOT elicitation techniques: field observation, stakeholder analysis."},
    {id:"ch4-3-f3",front:"What is the difference between validation and verification?",back:"• Validation: Are we building the RIGHT system? (Requirements vs. stakeholder needs)\n• Verification: Are we building the system RIGHT? (Implementation vs. requirements)\n\nValidation is performed by Requirements Engineers (with stakeholders).\nVerification is performed by testers/QA against documented requirements."},
    {id:"ch4-3-f4",front:"Which validation technique identifies unverifiable requirements?",back:"TEST-CASE DERIVATION: attempting to write test cases for each requirement.\n\nIf a test case cannot be written, the requirement is not verifiable — revealing ambiguity, vagueness, or missing detail.\n\nThis is a powerful technique for identifying poor-quality requirements during review."},
  ]},
 ],
 quiz:[
  {id:"ch4-q1",question:"A new system for monitoring vital functions of ICU patients is being developed. Which two techniques are BEST suited to identifying user requirements for this high-stakes, time-pressured environment?",
   options:["Questionnaires/interviews and brainstorming","Questionnaires/interviews and role playing","Field surveys and system archaeology","Brainstorming and document analysis"],
   correctIndex:1,explanation:"For a critical, time-pressured environment: Interviews gather explicit requirements; Role playing lets stakeholders simulate real scenarios. Field observation (apprenticing) would also be valid but wasn't in options."},
  {id:"ch4-q2",question:"Which elicitation technique involves a RE observing users in their actual work environment without interfering?",
   options:["Structured interview","Brainstorming","Field observation (ethnography/apprenticing)","Document analysis"],
   correctIndex:2,explanation:"Field observation / ethnography involves passive observation in the natural work environment. It reveals tacit knowledge — things users do but cannot articulate."},
  {id:"ch4-q3",question:"According to the Kano model, the 'performance' category has which characteristic?",
   options:["Absence causes dissatisfaction; presence is expected","Almost LINEAR relationship between satisfaction and degree of compliance","Delights when present; no dissatisfaction when absent","Represents regulatory compliance features"],
   correctIndex:1,explanation:"Performance attributes have a linear relationship: the more the system delivers this attribute, the more satisfied users are. Basic attributes have a threshold effect; excitement attributes have a non-linear delight effect."},
  {id:"ch4-q4",question:"Which of the following is the CORRECT Kano model grouping of requirements?",
   options:["Must, Should, Could","Necessary, Optional, Fun","Low, Medium, High Priority","Standard/Base, Performance, Excitement"],
   correctIndex:3,explanation:"IREB Kano model: Standard/Basic (must-be), Performance (one-dimensional, linear), Excitement (attractive). These correspond to different shapes of the satisfaction curve."},
  {id:"ch4-q5",question:"You have a creative group of stakeholders who get along well and communicate informally. Which elicitation technique works BEST?",
   options:["Brainstorming","Closed-ended interview questions","Open-ended interview questions","Survey/questionnaire"],
   correctIndex:0,explanation:"Brainstorming works best with collaborative, informal, creative groups. It leverages group creativity and idea-building. Questionnaires suit large, dispersed user groups."},
  {id:"ch4-q6",question:"You must elicit requirements from a LARGE group of potential users quickly, with LIMITED time. Which technique is best?",
   options:["Closed-ended questionnaire","Closed-ended interview","Brainstorming","Prototyping"],
   correctIndex:0,explanation:"Closed-ended questionnaires can be distributed to large numbers of users simultaneously and compiled quickly. Brainstorming and prototyping work best with smaller groups."},
  {id:"ch4-q7",question:"You need to elicit, analyse, AND document requirements in ONE session. Which technique works best?",
   options:["Brainstorming","Requirements workshop","Perspective-based reading","Open-ended interviews"],
   correctIndex:1,explanation:"A Requirements Workshop (e.g., JAD session) brings stakeholders and analysts together to elicit, analyse, and document requirements collaboratively in a structured session."},
  {id:"ch4-q8",question:"Which technique is LEAST suitable when you need feature ideas from potential customers for a NEW product?",
   options:["Change of perspective","Brainstorming","System archaeology","Analogy technique"],
   correctIndex:2,explanation:"System archaeology analyses EXISTING legacy systems for undocumented requirements. It cannot discover new customer feature ideas — those require creativity techniques or interviews."},
  {id:"ch4-q9",question:"Which technique is best for clarifying system BOUNDARIES and INTERFACES?",
   options:["Interface analysis","Closed-ended interview","Brainstorming","Mind-mapping"],
   correctIndex:0,explanation:"Interface analysis systematically identifies all interfaces between the system and its environment — the primary technique for clarifying system boundaries and data flows."},
  {id:"ch4-q10",question:"Developers decompile legacy code to recover requirements (no docs exist). Which technique is this?",
   options:["Interface analysis","Stakeholder analysis","Reverse-engineering","This cannot be a valid RE technique"],
   correctIndex:2,explanation:"Reverse-engineering (system archaeology) recovers requirements from existing code or artefacts. It is a valid elicitation technique for legacy systems where no documentation exists."},
  {id:"ch4-q11",question:"Which conflicts are LEAST suitable for the Requirements Engineer to handle?",
   options:["Subject matter conflict and value conflict","Value conflict and interest conflict","Architectural conflict and cost conflict","Data conflict and relationship conflict"],
   correctIndex:2,explanation:"Architectural conflicts require technical expertise beyond RE scope; cost conflicts are management decisions. RE is best suited for subject matter, data, interest, value, and relationship conflicts."},
  {id:"ch4-q12",question:"In a validation meeting two stakeholders debate a requirement. One says success depends on it; the other says it is technically impossible. What is the BEST response?",
   options:["Note both arguments and let the project manager decide","Invite all stakeholders to a workshop","Prefer the technical opinion since the discussion is pointless if unrealizable","Get together with the affected stakeholders and attempt to reach an agreement"],
   correctIndex:3,explanation:"The RE should facilitate resolution with the directly affected stakeholders. Escalating immediately to the PM or ignoring the technical concern are not the first steps."},
  {id:"ch4-q13",question:"How should a Requirements Engineer handle conflicts BEST?",
   options:["Resolve with the best available technique","Analyse the conflict, try a suitable resolution technique, document information about the conflict and resolution","Ignore it — this is project management's job","Immediately escalate via defined escalation paths"],
   correctIndex:1,explanation:"Best practice: Analyse → Apply a suitable technique → Document. Immediate escalation or avoidance misses the RE's facilitation role."},
  {id:"ch4-q14",question:"Which requirement validation techniques are suitable? (Choose the CORRECT set)",
   options:["Stakeholder analysis, walkthrough, ranking, monitoring","Walkthrough, validation by interface prototype, perspective-based reading, inspection","Decomposition, apprenticing, generalization, visualization","Brainstorming, field observation, interviews, prototyping"],
   correctIndex:1,explanation:"IREB validation techniques: Walkthroughs, Inspections, Prototyping (interface prototype), Perspective-based reading, Test-case derivation. Brainstorming/field observation are ELICITATION techniques."},
  {id:"ch4-q15",question:"Which criterion is NOT a sensible criterion for requirements PRIORITISATION?",
   options:["Impact on the existing operational system","Influence on overall business success","Effort for the VALIDATION of the requirements","Costs resulting from the implementation"],
   correctIndex:2,explanation:"Validation effort is NOT a prioritisation criterion — requirements should be prioritised by business value, risk, cost of implementation, and dependencies, not by how easy they are to validate."},
  {id:"ch4-q16",question:"What is the CORRECT distinction between validation and verification?",
   options:["Validation checks implementation vs. requirements; verification checks requirements vs. needs","Validation checks requirements vs. stakeholder needs; verification checks implementation vs. requirements","They are synonymous","Validation is done by testers; verification is done by REs"],
   correctIndex:1,explanation:"Validation: 'Building the right thing?' (requirements vs. needs). Verification: 'Building it right?' (implementation vs. requirements). This distinction is fundamental in IREB."},
 ]
},
{id:"ch5",number:5,title:"RE Process and Process Models",
 subchapters:[
  {id:"ch5-1",title:"RE Core Activities",flashcards:[
    {id:"ch5-1-f1",front:"What are the four core activities of RE?",back:"1. Elicitation – discovering and gathering requirements\n2. Documentation – recording requirements (text and models)\n3. Validation & Negotiation – checking with stakeholders, resolving conflicts\n4. Management – handling changes, traceability, versioning throughout lifecycle\n\nIn practice these are ITERATIVE and INTERLEAVED, not strictly sequential."},
    {id:"ch5-1-f2",front:"What are the goals of the requirements ELICITATION process?",back:"Goals (IREB):\n• Get the best input to the requirements possible (II)\n• Produce complete, clear, correct, and consistent requirements (III)\n• Extract the customer's true needs (V)\n\nNOT goals of elicitation: completing the project on budget (I), involving testers early (IV) — these are project management activities."},
    {id:"ch5-1-f3",front:"What is the best DEFINITION of the elicitation process?",back:"'Methods by which the requirements are CHARACTERISED and REFINED.'\n\nElicitation is not just about gathering use cases or documenting — it is the process of discovering, characterising, and refining what the system must do through interaction with stakeholders."},
  ]},
  {id:"ch5-2",title:"RE in Different Process Models",flashcards:[
    {id:"ch5-2-f1",front:"How does RE differ in waterfall vs. agile projects?",back:"Waterfall: RE is an upfront phase producing COMPLETE SPECIFICATIONS before design begins. Changes are formally controlled and costly.\n\nAgile: RE is CONTINUOUS and distributed across iterations (sprints). Requirements are a product backlog, refined gradually via user stories.\n\nBoth require all four RE core activities — just with different rhythm."},
    {id:"ch5-2-f2",front:"What is a product backlog in agile RE?",back:"An ORDERED LIST of all requirements, features, and improvements desired for the product.\n\n• Maintained by the Product Owner\n• Prioritised by business value\n• Refined before each sprint\n• Single source of truth for what needs to be built\n\nReplaces the traditional SRS in agile contexts."},
    {id:"ch5-2-f3",front:"What is scope creep, and what causes it?",back:"Scope creep = addition of requirements BEYOND the defined scope, often incrementally.\n\nCauses: insufficient initial scoping, stakeholder pressure, no change control process, poor requirements baseline management.\n\nAn analyst SHOULD plan for scope changes because the realities of the business may cause legitimate scope evolution."},
  ]},
  {id:"ch5-3",title:"Problem Space vs. Solution Space",flashcards:[
    {id:"ch5-3-f1",front:"What is the problem space in RE, and why does it matter?",back:"The problem space describes the CURRENT SITUATION, stakeholder needs, and problems to be solved — WITHOUT defining how they will be solved.\n\nRE should first thoroughly understand the problem space. Jumping to solutions too early leads to:\n• Solving the wrong problem\n• Missing important requirements\n• Premature design constraints"},
    {id:"ch5-3-f2",front:"Why is it important to plan for scope changes in requirements analysis?",back:"Because the REALITIES OF THE BUSINESS may cause legitimate change to scope over time.\n\nNOT because developers or users will randomly add features. A structured change process (not open-ended scope creep) is the right approach — anticipate change and control it."},
  ]},
 ],
 quiz:[
  {id:"ch5-q1",question:"Which of the following are TRUE goals of the elicitation process? (Choose best answer)",
   options:["Complete the project on budget, get the best input, produce complete/correct requirements","Only getting the best possible input","Get best input (II), produce complete/clear/correct requirements (III), extract the customer's true needs (V)","All of: complete on budget, best input, complete requirements, involve testers early, extract true needs"],
   correctIndex:2,explanation:"Elicitation goals: best input, complete/clear/correct requirements, extracting true needs. 'Complete on budget' is a project management goal. 'Involve testers early' is a broader QA activity."},
  {id:"ch5-q2",question:"What is the BEST definition of the elicitation process?",
   options:["Techniques used to document the requirements","The process of gathering use cases, user scenarios and user stories","Diagramming and modelling techniques to characterise requirements","Methods by which requirements are characterised and refined"],
   correctIndex:3,explanation:"Elicitation is the overall process of discovering, characterising, and REFINING requirements — not just documenting them or creating specific artefacts."},
  {id:"ch5-q3",question:"In which process model are requirements typically documented completely BEFORE design begins?",
   options:["Scrum","Extreme Programming (XP)","Waterfall / V-Model","Kanban"],
   correctIndex:2,explanation:"The Waterfall/V-Model has RE as a distinct upfront phase. Agile methods (Scrum, XP) develop requirements iteratively alongside design and implementation."},
  {id:"ch5-q4",question:"What is likely to happen if INSUFFICIENT TIME is allocated to requirement gathering?",
   options:["The project schedule is exceeded due to rework","The project will likely be completed on time since less time is spent on documentation","The technical team will make correct decisions during implementation","Time saved on reviews will create extra time for rework"],
   correctIndex:0,explanation:"Insufficient RE time leads to incomplete or incorrect requirements, which cause costly rework later. The cost of fixing requirements defects grows exponentially in later phases."},
  {id:"ch5-q5",question:"Should a requirements analyst plan for scope changes?",
   options:["No — planning for scope changes acknowledges the scope was not properly set","No — it allows the development team to add more features","Yes — because developers will add features so we should allow for that","Yes — because the realities of the business may cause legitimate scope changes"],
   correctIndex:3,explanation:"Scope changes should be anticipated and MANAGED, not feared. Business reality evolves; a controlled change process handles legitimate scope evolution. This is different from uncontrolled scope creep."},
  {id:"ch5-q6",question:"What happens when a requirements source is overlooked?",
   options:["You hurt the feelings of people not consulted","Requirements may be incomplete or unacceptable","It is not a problem because missed requirements can be added later","Those people should be excluded from acceptance testing"],
   correctIndex:1,explanation:"Overlooking a requirements source risks incomplete or unacceptable requirements — needs from that source are simply missing from the specification."},
  {id:"ch5-q7",question:"If a missing requirement is not discovered until USER ACCEPTANCE TEST, what can we conclude?",
   options:["The analyst should have had more meetings with users","The users didn't communicate effectively","The analysis techniques used were incorrect","The requirements review process was not sufficient"],
   correctIndex:3,explanation:"A requirement missing until UAT indicates the REVIEW PROCESS failed — validation should have caught this earlier. Defect escape to UAT is a review process failure."},
 ]
},
{id:"ch6",number:6,title:"Requirements Management",
 subchapters:[
  {id:"ch6-1",title:"Versioning and Baselining",flashcards:[
    {id:"ch6-1-f1",front:"What is a requirements baseline?",back:"A REVIEWED AND APPROVED SNAPSHOT of requirements at a specific point in time.\n\n• Does NOT freeze requirements permanently\n• Provides a REFERENCE for development and testing\n• Changes after baseline require formal change management\n• Supports impact analysis and traceability"},
    {id:"ch6-1-f2",front:"What is requirements versioning?",back:"Tracking the HISTORY of requirements over time:\n• Who changed a requirement\n• When they changed it\n• Why (change rationale)\n\nVersioning enables rollback, comparison between versions, and audit trails. It is essential for requirements management under change."},
  ]},
  {id:"ch6-2",title:"Change Management",flashcards:[
    {id:"ch6-2-f1",front:"What is the requirements change management process?",back:"1. Submit a change request\n2. Analyse the IMPACT (affected requirements, tests, design, schedule, cost)\n3. Approve or reject (by Change Control Board)\n4. Implement and document the change\n5. Communicate to stakeholders\n\nIMPACT ANALYSIS always comes before approval."},
    {id:"ch6-2-f2",front:"When analysing a change request, which aspects must be analysed?",back:"• Test cases to be altered due to the change\n• Effort involved in making the change\n• Stakeholders affected by the change\n\nThe JUSTIFICATION of the change is the submitter's responsibility, not the impact analysis.\nImpact analysis focuses on: cost, scope, affected artefacts, affected stakeholders."},
    {id:"ch6-2-f3",front:"Why must assumptions be documented during requirements analysis?",back:"Because a condition may be TRUE RIGHT NOW but may CHANGE and cause NEGATIVE IMPACT later.\n\nAssumptions that everyone shares today may no longer hold tomorrow. Documenting them enables:\n• Early warning when conditions change\n• Clear distinction between facts and assumptions\n• Traceability of requirement rationale"},
    {id:"ch6-2-f4",front:"A rule of requirements prioritisation that is TRUE:",back:"PRIORITIES MAY CHANGE during the project.\n\nOther facts:\n• Priorities must be set collaboratively (not by developers alone)\n• Stakeholders will NOT always agree on priorities\n• Priorities ARE necessary — requirements must be ordered\n• Re-prioritisation is a normal part of requirements management"},
  ]},
  {id:"ch6-3",title:"Traceability",flashcards:[
    {id:"ch6-3-f1",front:"What are the two directions of requirements traceability?",back:"• Forward traceability: requirements → design → implementation → tests\n  (Every requirement is implemented and tested)\n\n• Backward traceability: tests/implementation → requirements → stakeholder needs\n  (Every artefact is justified by a requirement)\n\nBoth directions are needed for full traceability."},
    {id:"ch6-3-f2",front:"What is a Requirements Traceability Matrix (RTM)?",back:"A TABLE that maps requirements to their sources, design artefacts, test cases, and other related elements.\n\nColumns example: Req ID | Source | Design ref | Test case ID | Status\n\nThe RTM enables:\n• Coverage verification (is every req tested?)\n• Impact analysis (what changes when this req changes?)\n• Completeness check (are any reqs untested?)"},
    {id:"ch6-3-f3",front:"Which particular requirement characteristic facilitates test planning after a mid-project scope change?",back:"TRACEABILITY.\n\nWhen the test manager needs to adjust test planning after requirements change, traceability allows them to quickly identify WHICH test cases are linked to WHICH requirements — making it fast to find tests that need updating."},
  ]},
 ],
 quiz:[
  {id:"ch6-q1",question:"When a change request is submitted, what should happen FIRST?",
   options:["The developer should implement the change immediately","The tester should update test cases","An impact analysis should be performed","The requirement should be deleted from the specification"],
   correctIndex:2,explanation:"Before approving any change, an IMPACT ANALYSIS must determine which requirements, design artefacts, and test cases are affected. This informs the approval/rejection decision."},
  {id:"ch6-q2",question:"Which aspects must be analysed in a change request impact analysis?",
   options:["Justification, test cases, effort, and affected stakeholders","Test cases to be altered, effort involved, and stakeholders affected","Only the cost and schedule impact","Only the technical feasibility"],
   correctIndex:1,explanation:"Impact analysis covers: test cases affected, effort required, and stakeholders impacted. The justification is provided by the change requester, not part of the impact analysis itself."},
  {id:"ch6-q3",question:"What is the PRIMARY purpose of a requirements baseline?",
   options:["To freeze requirements permanently so they cannot change","To provide a stable reference snapshot for development and testing","To identify requirements with highest priority","To document the technical architecture"],
   correctIndex:1,explanation:"A baseline is a snapshot reference point. It enables change management — changes after the baseline are formally controlled. It does NOT prevent all future changes."},
  {id:"ch6-q4",question:"Forward traceability links requirements to:",
   options:["Stakeholder goals and business objectives","Design artefacts and test cases","Previous versions of the requirement","Other competing requirements"],
   correctIndex:1,explanation:"Forward traceability traces from requirements FORWARD to design, implementation, and test cases — ensuring every requirement is addressed and tested."},
  {id:"ch6-q5",question:"Which traceability characteristic helps a test manager adjust test planning after a scope change mid-project?",
   options:["Coherence","Testability","Stability","Traceability"],
   correctIndex:3,explanation:"Traceability links requirements to test cases. When requirements change, the test manager uses traceability to find exactly which tests must be updated — significantly reducing effort."},
  {id:"ch6-q6",question:"Why must assumptions be clearly documented during requirements analysis?",
   options:["Everyone will make the same assumptions so they're recorded for review","Constraints may change over time","The huge risks of assumptions must be documented","A condition may be true right now but may change and cause negative impact"],
   correctIndex:3,explanation:"Assumptions are conditions believed to be true at the time of writing. They must be documented because they CAN CHANGE — when they do, the requirements based on those assumptions must be revisited."},
  {id:"ch6-q7",question:"Which statement about requirements prioritisation is TRUE?",
   options:["Stakeholders will always agree on priorities","Priorities must be set by the development group","Priorities are not necessary in agile projects","Priorities may change during the project"],
   correctIndex:3,explanation:"Priorities evolve as business needs, resources, and timelines change. Re-prioritisation is a normal part of requirements management, not a failure."},
  {id:"ch6-q8",question:"Your company uses ONLY text processing for requirements management. Which two tasks are LEAST supported?",
   options:["Version management of requirements and generating result documents","Requirements tracing and creation of graphic models","Documentation of requirements and writing goals","Version management and documentation of requirements"],
   correctIndex:1,explanation:"Text tools support documentation but lack: Requirements tracing (linking reqs to design/tests) and Creation of graphic models (diagrams). These require dedicated RM tools."},
 ]
},
{id:"ch7",number:7,title:"Tool Support for RE",
 subchapters:[
  {id:"ch7-1",title:"Categories of RE Tools",flashcards:[
    {id:"ch7-1-f1",front:"What categories of tools support Requirements Engineering?",back:"1. Requirements management tools (RMTs) – store, version, trace, manage (e.g., IBM DOORS, Jira, codeBeamer)\n2. Modelling tools – UML/SysML (e.g., Enterprise Architect)\n3. Collaboration tools – wikis, whiteboards (e.g., Confluence, Miro)\n4. Prototyping tools – UI mockups (e.g., Figma, Balsamiq)\n5. Testing tools – linking requirements to test cases"},
    {id:"ch7-1-f2",front:"What features should a Requirements Management Tool (RMT) provide?",back:"• Structured storage of requirements with attributes (ID, status, priority, author)\n• Version control and history tracking\n• Traceability management\n• Change management workflows and approval\n• Export/import in standard formats\n• Search and filter\n• Integration with development and testing tools\n• Reporting and metrics\n\nKey: TRACING and VERSION MANAGEMENT are NOT well-supported by text processors."},
    {id:"ch7-1-f3",front:"For UML modelling tools to support TRACEABLE models in RE, they must:",back:"A. Store model elements under VERSION CONTROL\nC. Export models in XML format (for tool integration)\nE. Allow model elements to be LINKED VIA HYPERLINKS (for traceability)\n\nNOT sufficient alone: checking UML conformance (B), creating management reports (F), or having IDs without linking (D)."},
  ]},
  {id:"ch7-2",title:"Tool Evaluation and Selection",flashcards:[
    {id:"ch7-2-f2",front:"What are potential risks of using RE tools?",back:"• Tool becomes an end in itself (bureaucracy over substance)\n• Vendor lock-in from proprietary formats\n• High learning curve slowing adoption\n• FALSE SENSE OF QUALITY — a tool doesn't automatically improve requirements\n• Over-engineering: applying enterprise tools to small projects\n• Maintenance overhead keeping tool data current"},
    {id:"ch7-2-f3",front:"Can RE tools replace skilled Requirements Engineers?",back:"NO.\n\nTools SUPPORT but CANNOT REPLACE:\n• Elicitation (tacit knowledge, trust-building with stakeholders)\n• Conflict resolution (interpersonal skills)\n• Creative requirement discovery\n• Validation with stakeholders\n\nA tool stores and traces; a human facilitates and understands."},
    {id:"ch7-2-f4",front:"What are the two key criteria when INTRODUCING a Requirements Engineering tool?",back:"C. RE processes must be CLEARLY DEFINED before introduction — don't let the tool define your process.\nB. Risks associated with introduction can be identified through a PILOT OPERATION.\n\nNote: License costs are NOT typically the greatest cost block — training, migration, and process change usually dominate."},
  ]},
 ],
 quiz:[
  {id:"ch7-q1",question:"Which two tasks are LEAST supported by using only a text processor for requirements management?",
   options:["Version management and generating result documents","Requirements tracing and creation of graphic models","Documentation of requirements and goals","Generation of result documents and documentation of requirements"],
   correctIndex:1,explanation:"Text processors lack built-in traceability linking (connecting requirements to design/tests) and cannot create UML or other graphic models. These require dedicated RM or modelling tools."},
  {id:"ch7-q2",question:"For UML modelling tools to support TRACEABLE models in RE, they must have which THREE capabilities?",
   options:["Model elements stored under version control; XML export; links via hyperlinks","Model elements with IDs; UML conformance checking; management reports","XML export; management reports; UML conformance checking","All features: IDs, version control, XML, hyperlinks, UML checking, reports"],
   correctIndex:0,explanation:"Version control (A), XML export (C), and hyperlink linking (E) enable traceability. IDs alone (D) without linking don't create traceability. UML conformance (B) and reports (F) are nice-to-have but not traceable."},
  {id:"ch7-q3",question:"Which two statements are CORRECT regarding the introduction of an RE tool?",
   options:["The tool defines the future RE approach; license costs are the greatest cost block","Risks can be identified through a pilot operation; RE processes must be clearly defined before introduction","RE processes must be defined after introduction based on what the tool supports","License costs are the greatest block; pilot operation is unnecessary"],
   correctIndex:1,explanation:"Best practice: define RE processes FIRST, then select/introduce a tool. Pilot operations help identify risks. The tool should support your process, not define it. License costs are rarely the biggest factor."},
  {id:"ch7-q4",question:"Which tool is a dedicated Requirements Management Tool (RMT)?",
   options:["Microsoft Word","IBM DOORS","Eclipse IDE","Git"],
   correctIndex:1,explanation:"IBM DOORS (Dynamic Object-Oriented Requirements System) is a dedicated RMT providing structured storage, versioning, traceability, and change management. Word is a word processor; Eclipse is an IDE; Git is version control."},
  {id:"ch7-q5",question:"Which statement about RE tool support is CORRECT?",
   options:["A good RE tool can substitute for experienced Requirements Engineers","Tools are only useful for projects with hundreds of requirements","Tools support traceability and versioning but cannot replace human RE skills","RE tools eliminate the need for requirements reviews and validation"],
   correctIndex:2,explanation:"Tools are enablers — they handle traceability, versioning, and storage efficiently. But elicitation, conflict resolution, and validation are human activities that tools cannot replace."},
  {id:"ch7-q6",question:"What is a significant RISK when using requirements management tools?",
   options:["Requirements will be too well organised","The tool creates automatic traceability without human input","Teams focus on maintaining the tool rather than improving requirements quality","Tools make requirements too easily accessible"],
   correctIndex:2,explanation:"A common pitfall: teams invest effort in filling in tool fields while the actual quality of requirements stagnates. Tools support RE but cannot guarantee requirement quality."},
 ]
}
]};

appendAdditionalCards('ch1','Additional Flashcards','ch1-add',[
['What is a requirement per the IREB/CPRE glossary?','A capability or condition needed by a stakeholder; a capability or property a system must have to satisfy a contract, standard, or specification; or a documented representation of either.',false],
['What is Requirements Engineering (RE)?','A systematic and disciplined approach to specifying and managing requirements, aimed at minimizing the risk of delivering a system that does not meet stakeholders\' actual needs.',false],
['Define System in the RE sense.','A set of elements that interact to fulfil an overall purpose. It can be viewed as a black box or a white box.',false],
['Define System Context.','The part of a system\'s environment relevant to its requirements: everything that interacts with or influences the system but lies outside the system boundary.',true],
['Define Stakeholder.','A person, group, or organization that can influence, or is influenced by, a system\'s requirements.',false],
['What are the four core activities of Requirements Engineering?','Elicitation, Documentation, Validation and Negotiation, and Management of requirements.',true],
['Distinguish a requirement from a specification.','A requirement is a single need or capability. A specification is the structured, documented collection of requirements.',false],
['Explain the black-box versus white-box view of a system.','Black-box considers externally observable behavior and interfaces. White-box also examines internal structure and components.',false],
['Name typical sources of requirements.','Stakeholders, documents such as contracts and standards, and systems in operation such as legacy or predecessor systems.',false],
['Differentiate problem space from solution space.','Problem space is the domain, needs, and goals. Solution space is the system or design chosen to address them.',false],
['List typical roles and tasks of a Requirements Engineer.','Elicit and document requirements, moderate stakeholders, build common understanding, validate and negotiate requirements, and manage them throughout the lifecycle.',true],
['Why can a system boundary shift during a project?','Scope and responsibility allocation decisions can change what belongs to the system versus its context, changing which requirements apply.',false]
]);

appendAdditionalCards('ch2','Fundamental Principles: Additional Flashcards','ch2-add',[
['Principle 1 - Value-orientation: what does it state?','Requirements are a means to an end. Their value is the benefit they provide minus the effort to elicit, validate, document, and manage them.',true],
['Principle 2 - Stakeholder: what does it emphasize?','Identify all relevant stakeholders and consider their often conflicting needs; missing a stakeholder can mean missing requirements.',true],
['Principle 3 - Shared Understanding: what two forms does IREB distinguish?','Explicit understanding, which is documented and agreed, and implicit or tacit understanding. Glossaries, prototypes, reference systems, and feedback cycles help build it.',true],
['Principle 4 - Context: why determine system context first?','A system cannot be understood correctly in isolation because its environment shapes and constrains its requirements.',true],
['Principle 5 - Problem-Requirement-Solution: what must happen before solution design?','Understand the underlying problem first. Jumping to a solution risks building the wrong system.',true],
['Principle 6 - Validation: why is it critical?','Validation confirms that documented requirements reflect stakeholder needs. Non-validated requirements are risky to build on.',true],
['Principle 7 - Evolution: what does it say about requirements over time?','Requirements change as needs, context, and the world evolve, so RE must embrace and manage change.',true],
['Principle 8 - Innovation: what does it encourage?','Look beyond basic stated needs to uncover excitement or delighter factors instead of merely replicating existing solutions.',true],
['Principle 9 - Systematic and Disciplined Work: is agility an excuse for ad-hoc RE?','False. Agility does not excuse unsystematic work; the RE process must still be deliberately configured and cleanly executed.',true],
['How many fundamental RE principles does IREB define?','Nine.',true],
['List all nine RE principles in order.','Value-orientation; Stakeholder; Shared Understanding; Context; Problem-Requirement-Solution; Validation; Evolution; Innovation; Systematic and Disciplined Work.',true]
]);

appendAdditionalCards('ch3','Additional Flashcards','ch3-add',[
['Name the main categories of elicitation techniques.','Survey techniques, creativity techniques, document-centric techniques, observation techniques, and supporting techniques such as workshops, focus groups, and prototyping.',true],
['Interview versus questionnaire: what is the key trade-off?','Interviews allow deep follow-up but are time-consuming and do not scale. Questionnaires scale quickly but lack depth and clarification.',true],
['What is apprenticing or job shadowing?','The Requirements Engineer works alongside or observes a stakeholder doing their job to surface tacit knowledge.',false],
['What is a key weakness of field observation?','The observer can change behavior; it is time-intensive and mainly captures current as-is behavior rather than future needs.',true],
['What is system archaeology?','Analyzing an existing, often legacy, system to derive requirements when documentation is limited or absent.',false],
['What is brainstorming used for and what is a key ground rule?','It generates many creative ideas quickly. Defer judgment and criticism during idea generation.',false],
['What is a focus group?','A moderated discussion with a representative group of stakeholders or users about a specific topic.',false],
['Why combine multiple elicitation techniques?','No single technique reveals every requirement type; combining techniques increases coverage and reduces bias and gaps.',true],
['What do creativity techniques help elicit?','Innovative or previously unstated ideas, including Kano excitement factors.',false],
['What is prototyping\'s main elicitation benefit?','It gives stakeholders something tangible to react to and surfaces requirements they could not express abstractly.',false],
['Name a document-centric technique besides document analysis.','Perspective-based reading: reviewing documents from different stakeholder viewpoints or roles.',false],
['Differentiate elicitation sources from techniques.','Sources are where requirements come from: people, documents, and systems. Techniques are the methods used to extract them.',false],
['Which technique category best uncovers tacit knowledge?','Observation techniques such as field observation and apprenticing or shadowing.',true],
['What is a workshop in elicitation?','A structured, moderated session with multiple stakeholders to elicit, discuss, prioritize, or negotiate requirements in real time.',false]
]);

appendAdditionalCards('ch4','Additional Flashcards','ch4-add',[
['Name the three main forms of requirements documentation.','Natural language, templates or structured natural language such as EARS, and models using semi-formal or formal notations.',true],
['What are the three main IREB requirement types?','Functional requirements, quality requirements, and constraints.',true],
['Define a functional requirement.','A requirement specifying a function or behavior the system must provide: what the system does.',false],
['Define a quality requirement.','A requirement specifying the required degree of a quality attribute such as performance, usability, or reliability.',false],
['Define a constraint as a requirement type.','A requirement that restricts the solution space through legal, technical, organizational, or design restrictions.',false],
['List key quality criteria for an individual requirement.','Adequate, unambiguous, correct, feasible, necessary, internally consistent, and verifiable or testable.',true],
['What does verifiable mean for a requirement?','A finite, cost-effective test, review, or analysis can objectively check whether it has been met.',true],
['What is the risk of ambiguous natural-language requirements?','Stakeholders or developers may interpret the wording differently, producing a system that misses the intended need.',false],
['What is a requirements template or pattern used for?','To structure natural-language requirements consistently and reduce ambiguity, for example with preconditions and responses.',true],
['What is a use case as a documentation form?','A description of actor-system interaction to achieve a goal, including main, alternative, and exception flows.',false],
['Differentiate natural, semi-formal, and formal documentation.','Natural language is flexible but potentially ambiguous; semi-formal models use defined notation; formal notation is mathematically precise but less accessible.',false],
['Name typical requirement attributes.','Unique ID, priority, status, source, rationale, version, author, and verification method.',false],
['What is the purpose of a glossary?','To define domain terms consistently, reduce ambiguity, and support shared understanding.',false],
['Why quantify quality requirements?','Qualitative terms such as fast are not verifiable; quantified criteria make requirements testable and unambiguous.',true]
]);

appendAdditionalCards('ch5','Additional Flashcards','ch5-add',[
['What are the five modeling perspectives in CPRE Foundation Level?','System context, structure and data, function and flow, state and behavior, and goals.',true],
['What diagram models system context?','A system context diagram showing the system as a black box with external actors and interfaces.',true],
['What is a use case diagram used for?','Modeling functional scope through actors and the use cases or goals they perform with the system.',true],
['Use case diagram versus use case description?','The diagram gives an overview of actors, use cases, and relationships; the description details main and alternative scenarios.',false],
['Which models document data and structure?','Entity-Relationship Diagrams and UML class diagrams showing entities or classes, attributes, and relationships.',true],
['What does cardinality express?','How many instances of one entity or class can or must associate with another, such as 1..* or 0..1.',true],
['Which models document function and flow?','Data flow diagrams, activity diagrams, flowcharts, and BPMN process diagrams.',true],
['What does a Data Flow Diagram show?','How data moves between processes, external entities, and data stores.',false],
['Which model documents state and behavior?','A state machine diagram showing states and events or transitions.',true],
['What is a transition in a state machine?','A change from one state to another, triggered by an event and possibly guarded or accompanied by an action.',false],
['What is a goal model used for?','Representing stakeholder goals, their relationships, and how requirements contribute to higher-level goals.',true],
['What is the benefit of goal-oriented modeling?','It links requirements to the why, helping justify and prioritize them and expose conflicting goals.',false],
['What is an actor in a use case diagram?','An external person, system, or role that interacts with the system.',false],
['What does include mean in a use case diagram?','The base use case always incorporates the included use case behavior in its normal flow.',false],
['What does extend mean in a use case diagram?','Optional or conditional behavior is inserted into a base use case at a defined extension point.',false],
['Why use models with natural language?','Models provide compact visual structure and relationships, but readers must understand the notation or legend.',true]
]);

appendAdditionalCards('ch6','Additional Flashcards','ch6-add',[
['What is the goal of requirements validation?','Check that documented requirements correctly and completely reflect stakeholder needs: are we specifying the right system?',true],
['Differentiate validation from verification.','Validation checks requirements against stakeholder needs. Verification checks whether a work product conforms to its specification.',true],
['Name common requirements review techniques.','Walkthrough, technical review, formal inspection, and perspective-based reading.',true],
['What distinguishes an inspection from a walkthrough?','Inspection is formal, structured, and role-based with checklists and metrics; walkthrough is more informal and author-led.',false],
['What is the Kano model used for?','Classifying features by their effect on satisfaction: basic, performance, and excitement factors.',true],
['Why are basic Kano factors hard to elicit directly?','Customers assume them and often mention them only when absent, so probing about absence helps.',true],
['What are excitement or attractive Kano factors?','Unexpected features that delight when present but cause no dissatisfaction when absent.',true],
['What is a performance factor?','Satisfaction rises roughly with the degree of fulfillment: more or better produces more satisfaction.',false],
['Name common requirements prioritization techniques.','MoSCoW, ranking or pairwise comparison, Kano, cost-value matrices, and cumulative voting such as the 100-dollar method.',true],
['What does MoSCoW stand for?','Must have, Should have, Could have, Won\'t have this time.',false],
['What stakeholder conflict types are addressed in negotiation?','Conflicts about goals or interests, facts or knowledge, and relationships or personal issues.',true],
['What is a common negotiation strategy?','Win-win negotiation that addresses the underlying interests of all parties.',false],
['Why validate after stakeholder sign-off?','Sign-off does not guarantee correctness or completeness; structured validation can still catch gaps and misunderstandings.',false],
['What quality criteria apply to a whole requirements set?','Completeness, consistency, and non-redundancy across the set.',false]
]);

appendAdditionalCards('ch7','Additional Flashcards','ch7-add',[
['What is a baseline in requirements management?','A formally reviewed and agreed requirements version at a point in time, used as a reference for development and change control.',true],
['Why baseline requirements?','To create a stable reference so subsequent changes can be tracked, controlled, and assessed for impact.',true],
['What is traceability in RE?','The ability to follow a requirement to its origin and to downstream artifacts such as design, code, and tests.',true],
['Differentiate forward and backward traceability.','Backward links to origin and rationale; forward links to design, code, and test artifacts.',true],
['Differentiate pre-RS and post-RS traceability.','Pre-RS traces back to source or origin; post-RS traces forward into design, implementation, and test.',true],
['What is a requirements attribute?','Metadata such as priority, status, source, version, or owner used for filtering, reporting, and management.',false],
['What is requirements change management?','A controlled process for proposing, assessing, deciding on, and implementing changes to baselined requirements.',true],
['Name typical change-management steps.','Submit request, assess impact, decide, implement, update the baseline, and update traceability links.',false],
['What is requirements versioning?','Tracking successive revisions so changes can be identified, compared, or reverted.',false],
['What is requirements status tracking?','A lifecycle attribute such as proposed, approved, implemented, or rejected used to manage progress.',true],
['What functions should a good RE tool support?','Storage, traceability, versioning and baselines, attributes and status, collaboration, and reporting or metrics.',true],
['Why is traceability important in regulated domains?','It provides auditable evidence that requirements are implemented and tested, as often required by standards.',false],
['What is the risk of using only documents or spreadsheets?','Traceability, versioning, and consistency become hard to maintain at scale, risking conflicting copies and lost history.',false],
['What is impact analysis in change management?','Assessing which requirements, design elements, and work products a proposed change affects before approval.',false]
]);

function appendImportedFlashcards(){
  const imported=globalThis.CPRE_EXTRA_FLASHCARDS?.byChapter;
  if(!imported)return;
  const sectionTitles={
    '1.1':'Requirements Engineering fundamentals','1.2':'Value of Requirements Engineering','1.3':'Requirements in systems','1.4':'Requirements Engineering tasks','1.5':'Requirements Engineer role','1.6':'Requirements Engineer skills',
    '2.1':'Fundamental RE principles','2.2':'The nine RE principles',
    '3.1':'Requirements work products','3.2':'Natural-language work products','3.3':'Template-based work products','3.4':'Model-based work products','3.5':'Glossaries','3.6':'Documentation structures','3.7':'Prototypes','3.8':'Requirements quality criteria',
    '4.1':'Requirements sources','4.2':'Requirements elicitation','4.3':'Conflict resolution','4.4':'Requirements validation',
    '5':'RE process configuration','5.1':'Process influencing factors','5.2':'RE process facets','5.3':'Typical RE process configurations',
    '6.1':'Requirements management basics','6.2':'Requirements life-cycle management','6.3':'Version control','6.4':'Configurations and baselines','6.5':'Requirement attributes and views','6.6':'Requirements traceability','6.7':'Change management','6.8':'Requirements prioritization',
    '7.1':'Requirements Engineering tool support','7.2':'Tool selection and introduction'
  };
  DATA.chapters.forEach(ch=>{
    const source=imported[String(ch.number)]||[];
    const bySection=new Map();
    source.forEach(card=>{
      const section=card.section||String(ch.number);
      const parentSection=ch.number===5?'5':section.split('.').slice(0,2).join('.');
      if(!bySection.has(parentSection))bySection.set(parentSection,[]);
      bySection.get(parentSection).push({id:card.id,front:card.front,back:card.back,highYield:card.level==='L3'});
    });
    ch.subchapters=[...bySection.entries()].map(([section,flashcards])=>{
      const sectionId=section.replace(/[^\w-]+/g,'-');
      return {id:`${ch.id}-anki-${sectionId}`,title:sectionTitles[section]||`Section ${section}`,flashcards};
    });
  });
}

function appendCanonicalChapterQuestions(){
  const chapters=window.CPRE_QUESTION_BANK?.chapters;
  if(!Array.isArray(chapters)||chapters.length!==7)throw new Error('Canonical CPRE chapter bank could not be loaded.');
  for(const sourceChapter of chapters){
    const target=DATA.chapters.find(ch=>ch.number===sourceChapter.number);
    if(!target)continue;
    const seen=new Set(target.quiz.map(q=>normalizeQuestionText(q.question)));
    sourceChapter.questions.forEach(source=>{
      const key=normalizeQuestionText(source.prompt);
      if(!key||seen.has(key))return;
      seen.add(key);
      const question={id:`new-${source.id}`,question:source.prompt,points:source.points||1,explanation:source.explanation||'',reference:source.reference||'',sourceBankId:source.id};
      if(source.type==='K'){
        question.type='K';
        question.statements=source.statements.map(statement=>({id:String(statement.id),text:statement.text}));
        question.correctAnswer=Object.fromEntries(question.statements.map(statement=>[statement.id,source.correctAnswer[statement.id]]));
      }else{
        question.options=Array.isArray(source.options)?source.options.map(option=>option.text):[];
        const answerIndices=(source.correctAnswer||[]).map(id=>source.options.findIndex(option=>option.id===id)).filter(index=>index>=0);
        question.type=source.type;
        if(source.type==='P'){
          question.correctIndices=answerIndices;
          question.requiredCount=source.requiredCount;
        }else question.correctIndex=answerIndices[0];
      }
      target.quiz.push(question);
    });
  }
}

const MOCK_BANK_FILES=['quizzes/cpre-fullmock-bank.txt'];

function parseMockBank(text){
  const sets=[];
  const setParts=text.split(/===== SET\s+(\d+)\s+\(75 MIN\).*?=====\s*/).slice(1);
  for(let i=0;i<setParts.length;i+=2){
    const setNumber=Number(setParts[i]);
    const body=setParts[i+1]||'';
    const questions=[];
    const questionParts=body.split(/\n----\n|\n----\r?\n/);
    questionParts.forEach((part,index)=>{
      const qMatch=part.match(/Q\d+\.\s*(?:\[[^\]]+\]\s*)+(?:\(POINTS:\s*(\d+)\))?\s*([\s\S]*?)(?=\nA\)\s)/);
      if(!qMatch)return;
      const points=Number(qMatch[1]||1);
      const question=qMatch[2].trim();
      const optionMatches=[...part.matchAll(/\n([A-D])\)\s*([^\n]+?)(?=\n[A-D]\)\s|\nANSWER:)/g)];
      const options=optionMatches.map(match=>match[2].trim());
      const answerMatch=part.match(/\nANSWER:\s*([^\n]+)/);
      const answer=(answerMatch?.[1]||'').match(/[A-D]/g)||[];
      const correctIndices=answer.map(letter=>letter.charCodeAt(0)-65);
      const explanation=(part.match(/\nEXPLANATION:\s*([\s\S]*?)(?:\n?$)/)?.[1]||'').trim();
      if(options.length>=2&&correctIndices.length){
        const item={id:`mock-set-${setNumber}-q${index+1}`,question,options,points,explanation};
        if(correctIndices.length>1)item.correctIndices=correctIndices;else item.correctIndex=correctIndices[0];
        questions.push(item);
      }
    });
    if(questions.length)sets.push({id:`mock-set-${setNumber}`,title:`Mock Test ${setNumber}`,questions,durationSeconds:75*60,passPercent:70});
  }
  return sets;
}

function buildNewBankMockSets(){
  const mocks=window.CPRE_QUESTION_BANK?.mocks;
  if(!Array.isArray(mocks)||mocks.length!==5||mocks.some(mock=>mock.questions.length!==45))return [];
  return mocks.map((mock,index)=>({
    id:`mock-set-${11+index}`,
    title:`Mock Test ${11+index}`,
    questions:mock.questions,
    durationSeconds:mock.durationMinutes*60,
    passPercent:mock.passMark,
    canonicalMockId:mock.id
  }));
}

function loadMockBank(){
  return Promise.all(MOCK_BANK_FILES.map(file=>new Promise(resolve=>{
    const frame=document.createElement('iframe');
    frame.hidden=true;
    frame.src=`assets/${file}`;
    frame.onload=()=>{const text=frame.contentDocument?.body?.innerText||frame.contentDocument?.body?.textContent||'';frame.remove();resolve(text);};
    frame.onerror=()=>{frame.remove();resolve('');};
    document.body.appendChild(frame);
  }))).then(texts=>{
    const parsed=texts.flatMap(parseMockBank).sort((a,b)=>Number(a.id.split('-').pop())-Number(b.id.split('-').pop()));
    const newBankMocks=buildNewBankMockSets();
    if(parsed.length===10&&parsed.every(set=>set.questions.length===45)&&newBankMocks.length===5){
      MOCK_SETS=[...parsed,...newBankMocks];
      window.CPRE_DATA.MOCK_SETS=MOCK_SETS;
    }else MOCK_BANK_ERROR=true;
    MOCK_BANK_READY=true;
    if(STATE.view==='mock')renderMain();
    return MOCK_SETS;
  });
}
