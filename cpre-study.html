<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CPRE Study</title>
<meta name="theme-color" content="#76227b"/>
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg"/>
<style>
/* ===================================================================
   CPRE Study — Single-file app, no build step required.
   Open directly in any modern browser.
   CSS variables make it easy to reskin: change --accent below.
=================================================================== */
:root{
  color-scheme:light;
  --accent:#8d2b91;
  --accent-d:#76227b;
  --accent-l:#f1e4f1;
  --bg:#f7f6f7;
  --surface:#fff;
  --surface2:#f0e9f0;
  --text:#19151a;
  --text2:#615963;
  --border:#ded9df;
  --ok:#168047; --ok-bg:#e1f4e9;
  --err:#b42336; --err-bg:#fae6e9;
  --warn:#9a5b00; --warn-bg:#fff1d2;
  --header-bg:#76227b; --header-text:#fff; --btn-primary-text:#fff;
  --r-sm:6px; --r-md:10px; --r-lg:16px;
  --sh-sm:0 1px 3px rgba(0,0,0,.08);
  --sh-md:0 4px 12px rgba(0,0,0,.10);
}
:root[data-theme="dark"]{color-scheme:dark;--accent:#d48add;--accent-d:#e1a3e6;--accent-l:#39233d;--bg:#171419;--surface:#211d23;--surface2:#302a32;--text:#f7f2f8;--text2:#c3b9c6;--border:#4b424e;--ok:#70d69b;--ok-bg:#203b2c;--err:#ff8792;--err-bg:#48242a;--warn:#ffd078;--warn-bg:#493719;--header-bg:#211822;--header-text:#fff;--btn-primary-text:#171419;--sh-sm:0 1px 4px #0008;--sh-md:0 4px 14px #0009}
:root[data-theme="high-contrast"]{color-scheme:dark;--accent:#ffff00;--accent-d:#ffff00;--accent-l:#181800;--bg:#000;--surface:#000;--surface2:#111;--text:#fff;--text2:#fff;--border:#fff;--ok:#00ff7f;--ok-bg:#001a0e;--err:#ff7f7f;--err-bg:#260000;--warn:#ffff00;--warn-bg:#181800;--header-bg:#000;--header-text:#fff;--btn-primary-text:#000;--sh-sm:none;--sh-md:none}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;transition:background-color .18s,color .18s}
#loading-splash{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#76227b;opacity:1;visibility:visible;transition:opacity .28s ease,visibility .28s ease}
#loading-splash.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
.loading-mark{position:relative;width:88px;height:88px;display:grid;place-items:center}
.loading-mark img{position:absolute;width:52px;height:52px;object-fit:contain}
.loading-ring{position:absolute;inset:0;width:88px;height:88px;transform:rotate(-90deg)}
.loading-ring circle{fill:none;stroke-width:3}
.loading-track{stroke:#ffffff55}
.loading-progress{stroke:#fff;stroke-dasharray:251.33;stroke-dashoffset:251.33;animation:loading-progress var(--loading-duration,3s) linear forwards}
@keyframes loading-progress{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.loading-progress{animation:none;stroke-dashoffset:0}}

/* Layout */
.shell{display:flex;flex-direction:column;min-height:100vh}
header{background:var(--header-bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:var(--sh-sm)}
.hdr-inner{max-width:1100px;margin:0 auto;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem}
.logo{font-size:1.1rem;font-weight:800;cursor:pointer;background:none;border:none;color:var(--header-text);display:inline-flex;align-items:center;gap:.45rem}
.logo span{color:var(--header-text)}
nav{display:flex;gap:.2rem}
.nav-btn{background:none;border:none;color:var(--header-text);font-size:.87rem;font-weight:600;padding:.35rem .65rem;border-radius:var(--r-sm);cursor:pointer;transition:all .15s}
.nav-btn:hover{color:var(--header-text);background:#ffffff24}
.nav-btn.active{color:var(--header-bg);background:var(--surface)}
main{flex:1;max-width:1100px;margin:0 auto;width:100%;padding:2rem 1.25rem}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.15rem;border-radius:var(--r-sm);font-size:.88rem;font-weight:600;cursor:pointer;border:none;transition:all .15s;text-decoration:none}
.btn-p{background:var(--accent);color:var(--btn-primary-text)}.btn-p:hover{background:var(--accent-d)}
.btn-s{background:var(--surface);color:var(--text);border:1.5px solid var(--border)}.btn-s:hover{background:var(--surface2)}
.btn-d{background:var(--err);color:#fff}.btn-d:hover{opacity:.85}
.btn-g{background:transparent;color:var(--text2)}.btn-g:hover{color:var(--text);background:var(--surface2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.back-btn{display:inline-flex;align-items:center;gap:.3rem;font-size:.83rem;color:var(--text2);background:none;border:none;cursor:pointer;padding:.3rem 0;margin-bottom:.85rem;font-weight:500}
.back-btn:hover{color:var(--text)}

/* Page headers */
.pg-title{font-size:1.5rem;font-weight:800;margin-bottom:.25rem}
.pg-sub{font-size:.87rem;color:var(--text2)}
.pg-hdr{margin-bottom:1.5rem}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:1.2rem;box-shadow:var(--sh-sm)}
.chip{padding:.2rem .55rem;border-radius:999px;font-size:.75rem;font-weight:700}

/* Chapter grid */
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1.1rem}
.ch-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-lg);padding:1.4rem;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;display:flex;flex-direction:column;gap:.65rem;box-shadow:var(--sh-sm)}
.ch-card:hover{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:var(--accent)}
.ch-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem}
.ch-num{background:var(--accent-l);color:var(--accent-d);font-weight:700;font-size:.75rem;padding:.18rem .5rem;border-radius:999px;flex-shrink:0}
.ch-title{font-size:.92rem;font-weight:600;line-height:1.4;flex:1}
.ch-meta{display:flex;gap:.9rem;font-size:.77rem;color:var(--text2)}
.mini-bar{height:5px;background:var(--border);border-radius:999px;overflow:hidden;flex:1}
.mini-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .4s}

/* Progress ring */
.ring{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--border)}
.ring-fill{fill:none;stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s}


/* Flashcard */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:1.25rem;padding:.5rem 0}
.fc-scene{width:100%;max-width:640px;height:280px;perspective:1200px;cursor:pointer}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.fc-inner.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;box-shadow:var(--sh-md);text-align:center}
.fc-face.back{transform:rotateY(180deg);background:var(--accent-l);border-color:var(--accent)}
.fc-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);margin-bottom:.6rem}
.fc-face.back .fc-label{color:var(--accent-d)}
.fc-text{font-size:1rem;line-height:1.65;white-space:pre-line}
.fc-yield{display:inline-block;margin-bottom:.55rem;padding:.18rem .5rem;border-radius:999px;background:var(--accent-l);color:var(--accent-d);font-size:.68rem;font-weight:800;letter-spacing:.06em}
.fc-hint{font-size:.75rem;color:var(--text2);margin-top:.85rem}
.fc-actions{display:flex;gap:.85rem}
.fc-counter{font-size:.82rem;color:var(--text2)}
.prog-bar{width:100%;max-width:640px;height:5px;background:var(--border);border-radius:999px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.sub-chips{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:.75rem}
.sub-chip{padding:.3rem .75rem;border-radius:999px;font-size:.8rem;font-weight:500;border:1.5px solid var(--border);cursor:pointer;background:var(--surface);color:var(--text2);transition:all .15s}
.sub-chip:hover{border-color:var(--accent);color:var(--text)}
.sub-chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.kbd-row{display:flex;gap:1.1rem;font-size:.75rem;color:var(--text2);justify-content:center;flex-wrap:wrap}
.kbd{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:0 5px;font-family:monospace;font-size:.72rem}

/* Quiz */
.qz-wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:1.4rem}
.qz-meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--text2)}
.mock-timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--accent-d)}
.qtype-tag{display:inline-flex;align-items:center;padding:.1rem .42rem;border-radius:999px;background:var(--accent-l);color:var(--accent-d);font-size:.7rem;font-weight:800;letter-spacing:.04em;margin-left:.25rem}
.qz-q{font-size:1.05rem;font-weight:600;line-height:1.55}
.qz-opts{display:flex;flex-direction:column;gap:.6rem}
.qz-opt{padding:.8rem 1rem;border:1.5px solid var(--border);border-radius:var(--r-md);background:var(--surface);text-align:left;font-size:.9rem;cursor:pointer;transition:border-color .15s,background .15s;line-height:1.5}
.qz-opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-l)}
.qz-opt.sel{border-color:var(--accent);background:var(--accent-l)}
.qz-opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.qz-opt.ng{border-color:var(--err);background:var(--err-bg);color:var(--err);font-weight:600}
.case-statement{padding:.75rem;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);margin:.55rem 0}
.case-statement-text{margin-bottom:.55rem}
.case-tf{display:flex;gap:.5rem;flex-wrap:wrap}
.case-tf button{border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface2);color:var(--text);padding:.35rem .8rem;font-weight:650;cursor:pointer}
.case-tf button.selected{border-color:var(--accent);background:var(--accent-l);color:var(--accent-d)}
.case-tf button:disabled{opacity:.75;cursor:default}
.explain{background:var(--surface2);border-left:3px solid var(--accent);padding:.8rem 1rem;border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:.86rem;line-height:1.6}
.score-card{background:var(--surface);border-radius:var(--r-lg);padding:2rem;text-align:center;border:1.5px solid var(--border)}
.score-num{font-size:3.5rem;font-weight:800;line-height:1}
.score-num.pass{color:var(--ok)}.score-num.fail{color:var(--err)}
.pass-badge{display:inline-block;padding:.28rem .9rem;border-radius:999px;font-size:.82rem;font-weight:700;margin-bottom:.85rem}
.pass-badge.pass{background:var(--ok-bg);color:var(--ok)}
.pass-badge.fail{background:var(--err-bg);color:var(--err)}
.missed-list{display:flex;flex-direction:column;gap:.7rem}
.missed-item{background:var(--surface);border:1.5px solid var(--err-bg);border-radius:var(--r-md);padding:.9rem}
.missed-q{font-weight:600;margin-bottom:.35rem;font-size:.9rem}
.missed-wrong{font-size:.82rem;color:var(--err);margin-bottom:.2rem}
.missed-ok{font-size:.82rem;color:var(--ok);margin-bottom:.25rem}
.missed-exp{font-size:.8rem;color:var(--text2)}
.rv-list{display:flex;flex-direction:column;gap:.7rem}
.rv-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:.85rem .95rem;display:flex;justify-content:space-between;gap:.8rem;align-items:flex-start}
.rv-meta{font-size:.75rem;color:var(--text2);margin-bottom:.2rem}
.rv-q{font-size:.86rem;line-height:1.45}

/* Progress overview */
.rd-summary{display:flex;gap:1.25rem;margin-bottom:1.75rem;flex-wrap:wrap}
.rd-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:.9rem 1.4rem;text-align:center;flex:1;min-width:130px}
.rd-val{font-size:1.9rem;font-weight:800}
.rd-lbl{font-size:.75rem;color:var(--text2);margin-top:.2rem}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.87rem}
th,td{padding:.7rem .95rem;text-align:left;border-bottom:1px solid var(--border)}
th{font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);background:var(--surface2)}
tr:hover td{background:var(--accent-l)}
.rd-badge{display:inline-block;padding:.18rem .6rem;border-radius:999px;font-size:.75rem;font-weight:700}
.rd-green{background:var(--ok-bg);color:var(--ok)}
.rd-yellow{background:var(--warn-bg);color:var(--warn)}
.rd-red{background:var(--err-bg);color:var(--err)}

/* Modal */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:1rem}
.modal{background:var(--surface);border-radius:var(--r-lg);padding:2rem;max-width:420px;width:100%;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.modal h2{font-size:1.15rem;font-weight:700;margin-bottom:.65rem}
.modal p{font-size:.88rem;color:var(--text2);margin-bottom:1.4rem;line-height:1.6}
.modal-btns{display:flex;gap:.7rem;justify-content:flex-end}
.modal-wide{max-width:680px;max-height:min(90vh,850px);overflow:auto}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.75rem;font-size:.84rem;font-weight:650}
.field input,.field textarea,.field select{width:100%;padding:.55rem .65rem;border:1.5px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--text);font:inherit}
.field textarea{min-height:92px;resize:vertical}
.answer-pick{display:flex;align-items:center;gap:.45rem;background:var(--surface2);border-radius:var(--r-sm);padding:.5rem .65rem;font-size:.83rem}
.user-question-list{display:flex;flex-direction:column;gap:.7rem;margin-top:1rem}
.user-question-row{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.user-question-row p{white-space:pre-wrap}
.question-image{display:block;max-width:100%;max-height:320px;object-fit:contain;margin:.75rem auto;border:1px solid var(--border);border-radius:var(--r-md)}
.icon{width:1.1em;height:1.1em;display:inline-block;vertical-align:-.2em;flex:none}
.icon-lg{width:1.5em;height:1.5em}
.theme-options{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap;margin:0 0 1rem}
.theme-options select{padding:.45rem .6rem;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--text)}
.notice{padding:.7rem .85rem;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface2);color:var(--text2);font-size:.82rem;margin:.75rem 0}
.site-footer{padding:1rem 1.5rem;border-top:1px solid var(--border);color:var(--text2);font:.8rem/1.5 system-ui,sans-serif;text-align:center;background:var(--surface)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
:root[data-theme="high-contrast"] .btn-p{border:2px solid #fff}

/* Chapter detail */
.ch-detail-row{display:flex;gap:.85rem;flex-wrap:wrap;margin-bottom:1.75rem}
.ch-detail-row .btn{font-size:.95rem;padding:.65rem 1.5rem}
.sc-list{display:flex;flex-direction:column;gap:.3rem}
.sc-row{font-size:.83rem;color:var(--text2);padding:.3rem 0;border-bottom:1px dashed var(--border);display:flex;justify-content:space-between}

/* Empty state */
.empty{text-align:center;padding:3rem 1rem;color:var(--text2)}
.empty-ic{font-size:2.5rem;margin-bottom:.65rem}
.empty-t{font-size:1rem;font-weight:600;margin-bottom:.35rem;color:var(--text)}
.empty-b{font-size:.85rem;line-height:1.6}

/* Responsive */
@media(max-width:600px){
  .hdr-inner{height:auto;min-height:52px;align-items:flex-start;flex-direction:column;padding:.55rem .9rem}
  nav{flex-wrap:wrap}
  .nav-btn{padding:.32rem .48rem;font-size:.81rem}
  main{padding:1.1rem .9rem}
  .pg-title{font-size:1.25rem}
  .ch-detail-row{flex-direction:column}
  .ch-detail-row .btn{width:100%;justify-content:center}
  .fc-scene{height:235px}
  .fc-actions{flex-direction:column;width:100%;max-width:400px}
  .fc-actions .btn{width:100%;justify-content:center}
  .rd-summary{flex-direction:column}
  .form-grid{grid-template-columns:1fr}
  .user-question-row{flex-direction:column}
}
</style>
</head>
<body>
<div id="loading-splash" role="status" aria-label="Loading CPRE Study"><div class="loading-mark"><img src="./assets/favicon.svg" alt="" width="54" height="54"><svg class="loading-ring" viewBox="0 0 88 88" aria-hidden="true"><circle class="loading-track" cx="44" cy="44" r="40"/><circle class="loading-progress" cx="44" cy="44" r="40"/></svg></div></div>
<div class="shell">
  <header>
    <div class="hdr-inner">
      <button class="logo" onclick="navigate('dashboard')"><svg class="icon icon-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M4 5.5v16M8 7h8M8 11h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> CPRE <span>Study</span></button>
      <nav>
        <button class="nav-btn" id="nb-dashboard" onclick="navigate('dashboard')">Chapters</button>
        <button class="nav-btn" id="nb-case-study" onclick="navigate('case-study')">Case study</button>
        <button class="nav-btn" id="nb-mock" onclick="navigate('mock')">Final Mock</button>
        <button class="nav-btn" id="nb-progress" onclick="navigate('progress')">Progress</button>
        <button class="nav-btn" id="nb-revisit" onclick="navigate('revisit')">Revisit</button>
        <button class="nav-btn" onclick="showSettings()" aria-label="Settings" title="Settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="m19.4 15 .1.1a1.8 1.8 0 1 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 1 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3H3.7a1.8 1.8 0 1 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 1 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 1 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 1 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </nav>
    </div>
  </header>
  <main id="main"></main>
</div>

<div id="modal-root"></div>

<script src="assets/cpre-study-data.js"></script>
<script>
'use strict';
/* =====================================================================
   DATA — All content inline. Add flashcards/quiz Qs to any chapter
   without touching any other code.

   localStorage schema:
     "cpre_cards"   → { [cardId]: {timesCorrect,timesSeen,lastSeen,nextReviewDate} }
     "cpre_quizzes" → [ {chapterId,date,score,totalQuestions,missedQuestionIds} ]
     "cpre_revisit" → [ {chapterId,questionId,markedAt} ]
===================================================================== */
const DATA = {chapters:[
{id:"ch1",number:1,title:"The Role and Tasks of a Requirements Engineer",
 subchapters:[
  {id:"ch1-1",title:"What is Requirements Engineering?",flashcards:[
    {id:"ch1-1-f1",front:"Define: Requirement",back:"A requirement is:\n1. A need perceived by a stakeholder.\n2. A capability or property a system shall have.\n3. A documented representation of a need or condition."},
    {id:"ch1-1-f2",front:"What is Requirements Engineering (RE)?",back:"A systematic and disciplined approach to the development and management of requirements. It covers elicitation, documentation, validation, and management of requirements throughout the system lifecycle."},
    {id:"ch1-1-f3",front:"What are the three dimensions of the RE triangle?",back:"1. Content – the substance of requirements (what the system shall do)\n2. Documentation – how requirements are recorded\n3. Agreement – consensus among stakeholders\n\nAll three must be satisfied for effective RE."},
    {id:"ch1-1-f4",front:"What does 'scope creep' mean in RE?",back:"The addition of requirements beyond the defined scope of the project — often incremental and uncontrolled. It is a major risk to project schedule and budget and must be managed through rigorous change control."},
  ]},
  {id:"ch1-2",title:"Goals and Role of the RE",flashcards:[
    {id:"ch1-2-f1",front:"What are the primary goals of Requirements Engineering?",back:"1. Identify all relevant stakeholders and their needs.\n2. Elicit all relevant requirements.\n3. Document requirements precisely and unambiguously.\n4. Validate requirements with stakeholders.\n5. Manage requirements throughout the project lifecycle."},
    {id:"ch1-2-f2",front:"Why is RE important for project success?",back:"Defects introduced during RE are among the most expensive to fix. Poor requirements are a primary cause of project failure. Good RE reduces rework, clarifies scope, aligns expectations, and forms the foundation for testing."},
    {id:"ch1-2-f3",front:"What core skills does a Requirements Engineer need?",back:"• Analytical thinking\n• Communication and facilitation\n• Empathy and stakeholder orientation\n• Creativity (for elicitation)\n• Conflict resolution / moderation\n• Domain and methodological knowledge\n\nNote: Without communication skills, the RE role collapses even with technical knowledge."},
    {id:"ch1-2-f4",front:"What is the relationship between a Requirements Engineer and a Tester (stakeholder)?",back:"The Requirements Engineer delivers INPUT to the tester. The tester uses requirements as the basis for test cases. Requirements must therefore be verifiable and traceable.\n\n(RE → input for tester, not the other way around.)"},
  ]},

 quiz:[
  {id:"ch1-q1",question:"What is the primary purpose of Requirements Engineering?",
   options:["To implement software as quickly as possible","To understand stakeholder needs and specify and manage requirements systematically","To test the completed product","To design the system architecture"],
   correctIndex:1,explanation:"RE focuses on understanding what is needed and managing requirements systematically throughout the lifecycle."},
  {id:"ch1-q2",question:"Which of the following best describes Requirements Engineering?",
   options:["A purely technical activity performed by software developers","A systematic and disciplined approach to specifying and managing requirements","A process that only happens before coding begins","A method of converting source code into requirements"],
   correctIndex:1,explanation:"IREB defines RE as a systematic and disciplined approach to specifying and managing requirements."},
  {id:"ch1-q3",question:"Why is Requirements Engineering important?",
   options:["It guarantees that no requirements will ever change","It helps reduce the risk of building a system that does not meet stakeholder needs","It eliminates the need for communication","It guarantees that the project will never exceed its budget"],
   correctIndex:1,explanation:"Good RE reduces risk. It does not guarantee perfect outcomes."},
  {id:"ch1-q4",question:"Which of the following is a requirement?",
   options:["A need or condition that a system must satisfy","A piece of source code","A project schedule","A team member's personal preference that is not relevant to the system"],
   correctIndex:0,explanation:"A requirement is a needed capability, condition, or property the system must satisfy."},
  {id:"ch1-q5",question:"Which of the following can be a source of requirements?",
   options:["Only stakeholders","Stakeholders and existing systems","Stakeholders, existing systems, and documents","Stakeholders, existing systems, documents, and observations"],
   correctIndex:3,explanation:"Typical sources include stakeholders, documents, existing systems, and observations."},
  {id:"ch1-q6",question:"Who is a stakeholder?",
   options:["Only the customer who pays for the system","Only the person who uses the system","A person or organization that has an interest in, influence on, or is affected by the system","Only a software developer"],
   correctIndex:2,explanation:"Stakeholders include anyone who influences or is affected by the system."},
  {id:"ch1-q7",question:"Which of the following can be stakeholders?",
   options:["End users","Customers","Regulatory authorities","All of the above"],
   correctIndex:3,explanation:"Stakeholders can be users, customers, regulators, maintainers, and others."},
  {id:"ch1-q8",question:"What is the role of a Requirements Engineer?",
   options:["To make all technical design decisions","To collaborate with stakeholders to elicit, document, validate and manage requirements","To write all system code","To approve the project budget"],
   correctIndex:1,explanation:"The RE role centers on elicitation, documentation, validation, and management of requirements."},
  {id:"ch1-q9",question:"Which of the following is a functional requirement?",
   options:["The system shall calculate the vehicle speed","The system shall respond within 100 ms","The system shall comply with ISO 26262","The system shall be easy to use"],
   correctIndex:0,explanation:"Functional requirements describe what the system shall do."},
  {id:"ch1-q10",question:"Which of the following is a quality requirement?",
   options:["The system shall calculate the steering angle","The system shall allow the driver to select a steering mode","The system shall respond to the steering command within 50 ms","The system shall store the selected mode"],
   correctIndex:2,explanation:"Response time is a quality characteristic (performance)."},
  {id:"ch1-q11",question:"Which of the following is a constraint?",
   options:["The system shall calculate the steering angle","The system shall provide driver feedback","The system shall use a specific mandated communication protocol","The system shall display the current steering mode"],
   correctIndex:2,explanation:"Constraints restrict the possible solution space."},
  {id:"ch1-q12",question:"Which statement about requirements is correct?",
   options:["Requirements always originate from the customer","Requirements can originate from many different sources","Requirements can only be identified through interviews","Requirements are always explicitly stated"],
   correctIndex:1,explanation:"Requirements can come from multiple sources, not just one stakeholder type or one technique."},
  {id:"ch1-q13",question:"The steering system shall allow the driver to select Sport Mode. What type of requirement is this?",
   options:["Functional requirement","Quality requirement","Constraint","Project goal"],
   correctIndex:0,explanation:"It describes system behavior, so it is functional."},
  {id:"ch1-q14",question:"The steering system shall be highly reliable. What is the primary problem with this requirement?",
   options:["It describes a function","It is potentially ambiguous and difficult to verify","It is an implementation detail","It is a stakeholder"],
   correctIndex:1,explanation:"Highly reliable is vague unless made measurable and testable."},
  {id:"ch1-q15",question:"Which is the best example of a measurable quality requirement?",
   options:["The system shall be fast","The system shall be highly responsive","The system shall respond within 100 ms","The system shall respond as quickly as possible"],
   correctIndex:2,explanation:"Within 100 ms is specific and verifiable."},
  {id:"ch1-q16",question:"A system is being developed for a hospital. Which is most likely a stakeholder?",
   options:["A doctor","A patient","A hospital administrator","All of the above"],
   correctIndex:3,explanation:"Multiple parties in the environment can be stakeholders."},
  {id:"ch1-q17",question:"A person does not directly use the system but maintains it after deployment. Is this person a stakeholder?",
   options:["No, because they do not use the system","Yes, because they are affected by or have an interest in the system","No, because only customers are stakeholders","Only if they write requirements"],
   correctIndex:1,explanation:"Direct runtime use is not required to be a stakeholder."},
  {id:"ch1-q18",question:"Which statement about stakeholders is correct?",
   options:["Every stakeholder has exactly the same interests","Stakeholders may have conflicting interests","Stakeholders are only external to the development organization","Stakeholders are always aware of all their requirements"],
   correctIndex:1,explanation:"Stakeholder conflicts are common and expected."},
  {id:"ch1-q19",question:"The system shall use a 32-bit processor. Which statement is most accurate?",
   options:["It is always a functional requirement","It is likely to be a constraint or solution decision","It is a stakeholder goal","It is an observation"],
   correctIndex:1,explanation:"This typically restricts implementation and is usually a constraint contextually."},
  {id:"ch1-q20",question:"The system shall enable the driver to adjust the steering wheel position. This describes:",
   options:["What the system should do","Exactly how the system must be implemented","A project goal","A stakeholder"],
   correctIndex:0,explanation:"It expresses required behavior, not implementation detail."},
  {id:"ch1-q21",question:"The system shall use a stepper motor to adjust the steering wheel position. Compared with the previous requirement, this statement:",
   options:["Is more implementation-oriented","Is more abstract","Is a stakeholder goal","Is a quality requirement"],
   correctIndex:0,explanation:"It prescribes a specific technical solution."},
  {id:"ch1-q22",question:"Which is the best example of a system goal?",
   options:["The system shall store the driver's preferred steering position","The vehicle shall provide a safer and more comfortable driving experience","The system shall use a CAN bus","The system shall respond within 50 ms"],
   correctIndex:1,explanation:"Goals express intended outcomes and benefits at a higher level."},
  {id:"ch1-q23",question:"Which statement best describes the relationship between goals and requirements?",
   options:["Goals and requirements are always identical","Requirements can help achieve goals","Goals are always technical requirements","Requirements are never derived from goals"],
   correctIndex:1,explanation:"Requirements operationalize goals into actionable obligations."},
  {id:"ch1-q24",question:"Which is an example of an assumption?",
   options:["The system shall operate between -40 C and 85 C","The vehicle will provide a valid vehicle-speed signal","The system shall display the current speed","The system shall respond within 100 ms"],
   correctIndex:1,explanation:"Assumptions are accepted conditions about the environment that may need validation."},
  {id:"ch1-q25",question:"A customer says: I want the system to be easy to use. What is the best interpretation?",
   options:["This is already a complete quality requirement","This is a stakeholder need or expectation that requires further clarification","This is a functional requirement","This is an implementation constraint"],
   correctIndex:1,explanation:"Easy to use is too vague until clarified with target users, context, and measurable criteria."},
  {id:"ch1-q26",question:"A stakeholder says: The system must be safe. Which is the best response from a Requirements Engineer?",
   options:["Immediately write: The system shall be safe","Reject the statement because safety cannot be a requirement","Explore the stakeholder's meaning and derive specific, verifiable requirements","Convert it directly into source code"],
   correctIndex:2,explanation:"The RE should refine broad concerns into concrete, testable requirements."},
  {id:"ch1-q27",question:"Which statement is the strongest requirement?",
   options:["The system shall be user-friendly","The system shall be efficient","The system shall respond quickly","The system shall display the requested information within 2 seconds"],
   correctIndex:3,explanation:"Specific measurable limits make requirements strong and verifiable."},
  {id:"ch1-q28",question:"The system shall provide a high level of security. Which problem is most obvious?",
   options:["It is too implementation-specific","It is ambiguous and not sufficiently measurable","It is necessarily a functional requirement","It is a complete constraint"],
   correctIndex:1,explanation:"High level is subjective unless translated to measurable criteria."},
  {id:"ch1-q29",question:"A customer says: We need a mobile application. What does this most likely represent initially?",
   options:["A fully specified requirement","A solution proposal or desired solution","A verified quality requirement","A test case"],
   correctIndex:1,explanation:"It often expresses a proposed solution rather than the underlying need."},
  {id:"ch1-q30",question:"Which statement best demonstrates the difference between a need and a solution?",
   options:["The customer needs faster access to information -> Build a mobile application","The customer needs faster access to information -> The system shall provide access within 2 seconds","Both A and B are identical","Neither describes a requirement"],
   correctIndex:1,explanation:"Option B refines a need into a measurable requirement rather than jumping to one implementation choice."},
  {id:"ch1-q31",question:"A stakeholder requests: Add a button to the screen. What should the Requirements Engineer consider first?",
   options:["The button's color","The underlying need or goal behind the request","The programming language","The database design"],
   correctIndex:1,explanation:"Start with the problem and intent before committing to a UI solution."},
  {id:"ch1-q32",question:"The system shall use the existing database. Which statement is most appropriate?",
   options:["This is definitely a functional requirement","This may be a constraint imposed by the environment or organization","This is definitely a stakeholder goal","This cannot be a requirement"],
   correctIndex:1,explanation:"Classification depends on context; this is commonly a constraint."},
  {id:"ch1-q33",question:"Which is the most dangerous assumption?",
   options:["The system will operate in a defined temperature range","The existing external system will always provide valid data, although this has not been confirmed","The user will have a valid login","The system will have a defined operating environment"],
   correctIndex:1,explanation:"Unverified assumptions about external data can cause major downstream failures."},
  {id:"ch1-q34",question:"A developer says: We do not need to ask users, we already know what they need. What is the best response?",
   options:["This is always acceptable if the developer is experienced","Requirements should be based on relevant stakeholder needs and evidence, not unsupported assumptions","Users should never be involved in RE","Developers automatically become stakeholders with complete knowledge"],
   correctIndex:1,explanation:"RE depends on evidence and stakeholder engagement, not guesswork."},
  {id:"ch1-q35",question:"A system has 100 documented requirements, but none explain why the system is being built. What may be missing?",
   options:["Goals and stakeholder needs","Source code","Test execution results","Database indexes"],
   correctIndex:0,explanation:"Requirements should be linked to goals and stakeholder needs to preserve purpose and rationale."},
  {id:"ch1-q36",question:"Automotive scenario: ADAS sends steering requests to a steering system. Which is most likely a requirement for the steering system?",
   options:["The ADAS team shall work overtime","The steering system shall receive and process valid steering requests from the ADAS controller","The ADAS controller shall use C++","The project shall be completed quickly"],
   correctIndex:1,explanation:"This states required system behavior at the interface boundary."},
  {id:"ch1-q37",question:"The system must comply with applicable safety regulations. What type is this most likely?",
   options:["Functional requirement","Quality requirement or constraint, depending on context","User story","Stakeholder"],
   correctIndex:1,explanation:"Regulatory statements can behave as quality requirements or constraints based on context."},
  {id:"ch1-q38",question:"User wants speed shown, architect needs speed from vehicle network, tester requires display within 500 ms. These represent:",
   options:["Three identical requirements","Different perspectives and aspects of the system","Three stakeholders","Three project goals"],
   correctIndex:1,explanation:"They capture different concerns: functional behavior, interface/source, and performance."},
  {id:"ch1-q39",question:"A maintenance engineer requires diagnostic retrieval without removing the control unit. Why is this important?",
   options:["Maintenance personnel can be stakeholders","Only the driver matters","This is not related to requirements","Maintenance concerns are always implementation details"],
   correctIndex:0,explanation:"Maintainers are legitimate stakeholders whose needs impact system requirements."},
  {id:"ch1-q40",question:"A regulatory authority introduces a new legal requirement. Which statement is most accurate?",
   options:["It cannot affect the system because the regulator is not a user","It may be a source of requirements or constraints","It is always optional","It is automatically a functional requirement"],
   correctIndex:1,explanation:"Regulatory changes often introduce mandatory requirements or constraints."},
  {id:"ch1-q41",question:"Which of the following may be sources of requirements?",
   options:["Stakeholders","Existing systems","Documents","Observations","Random guesses without evidence"],
   correctIndices:[0,1,2,3],explanation:"Valid sources include stakeholders, existing systems, documents, and observations. Random guesses without evidence are not a valid source."},
  {id:"ch1-q42",question:"Which statements about stakeholders are correct?",
   options:["Stakeholders may be individuals or organizations","Stakeholders may have conflicting interests","Stakeholders may be affected by the system without directly using it","Only the customer is a stakeholder","Stakeholders can be internal or external to the development organization"],
   correctIndices:[0,1,2,4],explanation:"Stakeholder scope is broad and can include internal and external parties with differing interests."},
  {id:"ch1-q43",question:"Which statements about Requirements Engineering are correct?",
   options:["It includes specification of requirements","It includes management of requirements","It involves understanding stakeholder needs","It is only performed before implementation begins","It helps reduce the risk of delivering an unsuitable system"],
   correctIndices:[0,1,2,4],explanation:"RE includes specification and management, centers on stakeholder needs, and reduces risk. It is not limited to a pre-implementation phase."},
  {id:"ch1-q44",question:"Which of the following can be a quality requirement?",
   options:["Response time","Availability","Usability","Performance","The exact name of a variable in source code"],
   correctIndices:[0,1,2,3],explanation:"Quality requirements describe characteristics such as performance, availability, and usability, not coding-style details like variable names."},
  {id:"ch1-q45",question:"Which statements about requirements and solutions are correct?",
   options:["A stakeholder may express a solution instead of an underlying need","A requirement should always specify the exact implementation","Understanding the underlying need can help identify alternative solutions","A solution proposal may unnecessarily restrict the solution space","Every stakeholder request is already a complete requirement"],
   correctIndices:[0,2,3],explanation:"RE should discover underlying needs, not lock into unnecessary implementation choices too early."},
  {id:"ch1-q46",question:"The system shall use a 48 V power supply. Which is most accurate?",
   options:["It is always a functional requirement","It is always a quality requirement","It may be a constraint, depending on context","It is never a requirement"],
   correctIndex:2,explanation:"Whether this is a valid requirement and how it is classified depends on context and source."},
  {id:"ch1-q47",question:"Which statement is most correct?",
   options:["Every stakeholder need must become a system requirement","Every system requirement must directly come from a stakeholder","Requirements can be derived from goals, constraints, documents, existing systems, and other sources","Only user requests are valid requirements"],
   correctIndex:2,explanation:"Requirements can be derived from multiple sources, not only direct user statements."},
  {id:"ch1-q48",question:"The system shall support all common communication protocols. What is the primary problem?",
   options:["It is too specific","Common is undefined and potentially ambiguous","It is necessarily a constraint","It is a complete requirement"],
   correctIndex:1,explanation:"Common must be defined to make the requirement unambiguous and verifiable."},
  {id:"ch1-q49",question:"Customers need to complete checkout faster. Which statement is most accurate?",
   options:["This is already a complete functional requirement","This is likely a goal or need that requires refinement","This is a technical constraint","This is a test case"],
   correctIndex:1,explanation:"This is a high-level need that should be refined into measurable requirements."},
  {id:"ch1-q50",question:"The system shall provide an intuitive interface. Which is the strongest counterargument that this is sufficient?",
   options:["Interface requirements are never allowed","Different users may interpret intuitive differently, making the requirement difficult to verify","All quality requirements are invalid","Requirements must always contain source code"],
   correctIndex:1,explanation:"Intuitive is subjective without clear criteria, so verification is unreliable."},
 ]

{id:"ch2",number:2,title:"Fundamental Principles of Requirements Engineering",
 subchapters:[
  {id:"ch2-1",title:"Stakeholders",flashcards:[
    {id:"ch2-1-f1",front:"Define: Stakeholder",back:"A person or group who:\n• Has a direct or indirect influence on system requirements, OR\n• Is affected by the system or its development\n\nExamples: end users, customers, developers, regulators, maintenance staff, system operators."},
    {id:"ch2-1-f2",front:"Which two pieces of information should always be recorded in the stakeholder list?",back:"B. Role designation\nC. Length of service / experience\n\n(Other common attributes: importance/influence, contact info, goals — but role and experience are minimum basics per IREB exam questions.)"},
    {id:"ch2-1-f3",front:"What is the difference between a stakeholder and a user?",back:"A user directly interacts with the system at runtime. A stakeholder is broader — it includes users, customers, sponsors, regulators, maintenance staff, and anyone else affected by or influencing the system.\n\nEvery user is a stakeholder, but not every stakeholder is a user."},
    {id:"ch2-1-f4",front:"When should stakeholders be involved in a project?",back:"Throughout the ENTIRE project — from requirements elicitation through design, implementation, testing, and deployment.\n\nLate stakeholder involvement is a major source of requirements defects and rework."},
  ]},
  {id:"ch2-2",title:"Types of Requirements",flashcards:[
    {id:"ch2-2-f1",front:"What is a functional requirement?",back:"A requirement that describes a FUNCTION or BEHAVIOR the system must perform — WHAT the system shall do.\n\nExample: 'The system shall allow a user to log in with a username and password.'"},
    {id:"ch2-2-f2",front:"What is a non-functional requirement (NFR)?",back:"A requirement describing a QUALITY ATTRIBUTE or CONSTRAINT on HOW the system performs its functions.\n\nExamples: performance, usability, reliability, security, maintainability, portability.\n\nAlso called quality requirements or Quality of Service (QoS) requirements."},
    {id:"ch2-2-f3",front:"What is a constraint?",back:"A requirement that LIMITS design or implementation choices WITHOUT describing system behavior.\n\nExamples:\n• 'Must be implemented in Java'\n• 'Must comply with GDPR'\n• 'Budget is fixed at €500k'\n• 'Must run on existing hardware'"},
    {id:"ch2-2-f4",front:"What are Quality of Service (QoS) requirements a subset of?",back:"Non-functional requirements (NFRs).\n\nQoS includes: performance, availability, reliability, scalability, security. All describe HOW WELL the system works, not WHAT it does."},
    {id:"ch2-2-f5",front:"'Restrictions or limitations on the solutions' — which term does this define?",back:"Constraint.\n\nConstraints do not describe desired system behaviour; they restrict the solution space available to designers. They are one of the three IREB requirement categories (functional / quality / constraints)."},
  ]},
  {id:"ch2-3",title:"Quality Criteria for Requirements",flashcards:[
    {id:"ch2-3-f1",front:"Name the key quality criteria for an INDIVIDUAL requirement.",back:"• Unambiguous – only one interpretation possible\n• Correct – accurately reflects stakeholder need\n• Understandable – clear to all intended readers\n• Consistent – no contradictions\n• Verifiable / Testable – can be checked\n• Necessary – represents a real need\n• Feasible – technically and economically achievable\n• Traceable – linked to its origin"},
    {id:"ch2-3-f2",front:"Name the key quality criteria for a REQUIREMENTS SET (specification).",back:"• Complete – all relevant requirements included\n• Consistent – no contradictions between requirements\n• Unambiguous – all requirements have one interpretation\n• Prioritised – requirements ordered by importance\n• Modifiable and extensible – structured to allow updates\n• Traceable – requirements linked to sources and artefacts"},
    {id:"ch2-3-f3",front:"What is requirements traceability?",back:"The ability to follow the life of a requirement in BOTH directions:\n• Forward: requirements → design → implementation → tests\n• Backward: tests/implementation → requirements → stakeholder needs\n\nSupports impact analysis, verification coverage, and change management."},
    {id:"ch2-3-f4",front:"Why does uniqueness matter when analysing functional requirements?",back:"If a requirement is stated in multiple places, it is easy to update one copy and not the others, creating inconsistency. Unique requirements (stated once) are easier to maintain, trace, and change correctly."},
  ]},
  {id:"ch2-4",title:"System and System Context",flashcards:[
    {id:"ch2-4-f1",front:"What is the system context?",back:"The part of the system's environment that is RELEVANT to the system's requirements. It includes external entities (people, other systems, hardware) that interact with the system.\n\nElements outside the context are irrelevant to requirements."},
    {id:"ch2-4-f2",front:"What is the difference between the system boundary and the context boundary?",back:"• System boundary: separates what IS the system (inside = built) from the context (outside = existing)\n• Context boundary: separates the system context (relevant environment) from the irrelevant environment\n\nTogether they define scope and what must be considered during RE."},
    {id:"ch2-4-f3",front:"What is a grey zone in system/context delimitation?",back:"A grey zone is an area of ambiguity where it is unclear:\n• Whether an element belongs INSIDE or OUTSIDE the system boundary (system grey zone), or\n• Whether an element in the environment is RELEVANT or IRRELEVANT (context grey zone)\n\nGrey zones must be resolved or monitored throughout the project."},
    {id:"ch2-4-f4",front:"A new system (X) will be developed with an interface to legacy system (Y). System Y already has an interface to system (Z). What is Z's context status relative to X?",back:"System Y is in the system X context (it directly interfaces with X).\nSystem Z is in the IRRELEVANT ENVIRONMENT of X — there is no direct relationship between X and Z.\n\nOnly direct relationships define context membership."},
    {id:"ch2-4-f5",front:"Which diagram is LEAST suited for representing system/context delimitation?",back:"State diagram — it shows states and transitions of an entity over time, NOT the boundary between a system and its environment.\n\nBest tools for delimitation: context diagram with data flows, use case diagram."},
  ]},

 quiz:[
    {id:"ch2-q1",question:"Which statement best describes the principle of value-oriented Requirements Engineering?",
     options:["All requirements have equal value","Requirements Engineering activities should contribute to the success of the system and the organization","Only the customer determines the value of a requirement","The most technically difficult requirement always has the highest value"],
     correctIndex:1,explanation:"Value-oriented RE focuses on creating real project and business value, not just producing documents."},
    {id:"ch2-q2",question:"Which statement about the value of a requirement is correct?",
     options:["The value of a requirement is always determined by its implementation cost","A requirement may have high value even if it is technically simple","The most expensive requirement is always the most valuable","Only technical value matters"],
     correctIndex:1,explanation:"A requirement can be simple to implement and still critical in business or safety terms."},
    {id:"ch2-q3",question:"Who is responsible for the quality of requirements?",
     options:["Only the Requirements Engineer","Only the customer","All relevant stakeholders involved in the Requirements Engineering process","Only the tester"],
     correctIndex:2,explanation:"Requirements quality is a shared responsibility across involved roles."},
    {id:"ch2-q4",question:"A developer notices that a requirement is ambiguous but says: That is the Requirements Engineer's problem. What principle is being violated?",
     options:["Requirements are not solutions","Shared responsibility","Requirements are iterative","Requirements are self-evident"],
     correctIndex:1,explanation:"Everyone involved should help identify and resolve quality issues in requirements."},
    {id:"ch2-q5",question:"Why is shared understanding important?",
     options:["Every stakeholder must have exactly the same opinion","Different stakeholders should have a sufficiently common understanding of the requirements","Only the Requirements Engineer needs to understand the requirements","Shared understanding eliminates all conflicts"],
     correctIndex:1,explanation:"Shared understanding means consistent interpretation, not identical opinions or priorities."},
    {id:"ch2-q6",question:"Which statement is correct?",
     options:["Shared understanding means every stakeholder has identical preferences","Shared understanding means relevant stakeholders interpret important requirements consistently","Shared understanding means requirements do not need to be documented","Shared understanding eliminates the need for validation"],
     correctIndex:1,explanation:"Consistent interpretation among relevant stakeholders is the key."},
    {id:"ch2-q7",question:"What does the principle requirements are not self-evident mean?",
     options:["Requirements are always wrong","Stakeholders may not explicitly state all their needs","Requirements cannot be understood","Requirements never come from stakeholders"],
     correctIndex:1,explanation:"Important needs can remain implicit and must be actively elicited."},
    {id:"ch2-q8",question:"Why can requirements not simply be assumed?",
     options:["Stakeholders may have implicit needs and different interpretations","Stakeholders never know anything","Requirements are always technical","Documentation is impossible"],
     correctIndex:0,explanation:"Assumptions can hide gaps and mismatched interpretations."},
    {id:"ch2-q9",question:"Which statement about changing requirements is correct?",
     options:["Requirements should never change after documentation","Requirements may change because knowledge, business needs, technology, or context changes","Requirement changes always indicate failure","Requirements change only in agile projects"],
     correctIndex:1,explanation:"Change is normal and must be managed, not denied."},
    {id:"ch2-q10",question:"Why are requirements developed iteratively?",
     options:["Because complete knowledge is often unavailable at the beginning","Because requirements should never be documented","Because stakeholders should be excluded initially","Because analysis is unnecessary"],
     correctIndex:0,explanation:"Iteration allows progressive refinement as understanding grows."},
    {id:"ch2-q11",question:"Which statement best describes the principle requirements are not solutions?",
     options:["Requirements should never be implemented","Requirements should describe the need or desired capability without unnecessarily prescribing a solution","Requirements are always written by customers","Solutions are not relevant to RE"],
     correctIndex:1,explanation:"Requirements should focus on what is needed, while preserving design alternatives where possible."},
    {id:"ch2-q12",question:"Why should requirements not unnecessarily prescribe solutions?",
     options:["To preserve the ability to consider alternative solutions","Because technical solutions are never needed","Because developers should not participate in RE","Because all solutions are equivalent"],
     correctIndex:0,explanation:"Over-prescribing solutions can restrict better options."},
    {id:"ch2-q13",question:"Why must requirements be validated?",
     options:["To check whether they are sufficiently correct and of adequate quality","To guarantee that implementation will be defect-free","To avoid involving stakeholders","To replace testing completely"],
     correctIndex:0,explanation:"Validation checks requirement quality and fitness before costly implementation."},
    {id:"ch2-q14",question:"Which statement about documentation is correct?",
     options:["Every piece of information must be documented in maximum detail","Requirements should be documented in a manner appropriate to the situation and purpose","Documentation is unnecessary if stakeholders meet frequently","Only functional requirements need documentation"],
     correctIndex:1,explanation:"Appropriate documentation balances usefulness, effort, and project context."},
    {id:"ch2-q15",question:"A team writes a large requirements document with many features no stakeholder needs. Which principle was most likely neglected?",
     options:["Value orientation","Requirements are not solutions","Iterative development only","Shared responsibility only"],
     correctIndex:0,explanation:"Large volume is not value; requirements should serve real stakeholder and business needs."},
    {id:"ch2-q16",question:"A developer finds an ambiguity the Requirements Engineer missed during review. What is the most appropriate conclusion?",
     options:["The Requirements Engineer has failed completely","The developer is not allowed to comment","Requirements quality is a shared responsibility","The requirement should be deleted"],
     correctIndex:2,explanation:"Different roles contribute to requirements quality."},
    {id:"ch2-q17",question:"A stakeholder says: I assumed everyone understood that this requirement only applies when the vehicle is stationary. What problem does this demonstrate?",
     options:["Requirements are self-evident","Important information may remain implicit","Requirements never change","Solutions are always preferred"],
     correctIndex:1,explanation:"Implicit conditions must be made explicit to avoid defects."},
    {id:"ch2-q18",question:"Users interpret a requirement differently during prototyping. What should the team do?",
     options:["Ignore the users because the requirement was already approved","Revisit and clarify the requirement","Delete all requirements","Stop the project"],
     correctIndex:1,explanation:"This is a normal trigger for iterative clarification and alignment."},
    {id:"ch2-q19",question:"Which situation best demonstrates iterative Requirements Engineering?",
     options:["All requirements are written once and never revisited","Requirements are progressively refined as more knowledge becomes available","Requirements are only written after implementation","Requirements are replaced with source code"],
     correctIndex:1,explanation:"Iteration means continuous refinement based on new knowledge and feedback."},
    {id:"ch2-q20",question:"A customer requests Add a touchscreen. The Requirements Engineer asks What problem are you trying to solve? Why?",
     options:["To understand the underlying need before committing to a solution","Because touchscreen technology is forbidden","Because requirements cannot come from customers","To avoid documenting the requirement"],
     correctIndex:0,explanation:"The goal is to uncover the need, not prematurely lock to one solution."},
    {id:"ch2-q21",question:"Which of the following is most likely a solution rather than a requirement?",
     options:["The driver shall be able to adjust the steering ratio","The system shall provide steering feedback","The system shall use a specific algorithm to calculate the steering ratio","The system shall detect a steering fault"],
     correctIndex:2,explanation:"Specifying a particular algorithm is usually solution-oriented."},
    {id:"ch2-q22",question:"Which statement about validation is correct?",
     options:["Validation is only performed after coding is complete","Validation can be performed throughout Requirements Engineering","Validation is the same as implementation","Validation is unnecessary when requirements come from a customer"],
     correctIndex:1,explanation:"Validation is a continuous RE activity, not a post-coding-only step."},
    {id:"ch2-q23",question:"A requirement is technically correct but cannot be understood by intended stakeholders. What is the problem?",
     options:["The requirement may not support shared understanding","It is automatically a solution","It is necessarily a constraint","It is automatically valid because it is technically correct"],
     correctIndex:0,explanation:"Technical correctness alone is insufficient if stakeholders cannot interpret it consistently."},
    {id:"ch2-q24",question:"A signed specification exists, then a new legal requirement appears. Which statement is most consistent with RE principles?",
     options:["The new requirement must be rejected because the specification was signed","The new requirement should be analyzed and managed appropriately","The original requirements must be ignored","Requirements must never change after approval"],
     correctIndex:1,explanation:"Approval does not forbid change; it requires controlled change management."},
    {id:"ch2-q25",question:"Which statement is FALSE?",
     options:["Requirements may change over time","Requirements can be developed iteratively","Requirements should always specify the exact implementation","Requirements should be validated"],
     correctIndex:2,explanation:"Requirements should not always prescribe implementation details."},
    {id:"ch2-q26",question:"A team agrees on a requirement, but stakeholders interpret it differently. Has shared understanding been achieved?",
     options:["Yes, because everyone agreed","No, because agreement without common interpretation is insufficient","Yes, because the requirement is documented","It depends only on the project manager"],
     correctIndex:1,explanation:"Agreement and shared understanding are related but not identical."},
    {id:"ch2-q27",question:"A Requirements Engineer says The requirement is obvious to me, so it does not need clarification. Which principle is violated?",
     options:["Requirements are not self-evident","Value orientation","Requirements are not solutions","Shared responsibility only"],
     correctIndex:0,explanation:"Requirements must be clarified and validated beyond personal assumptions."},
    {id:"ch2-q28",question:"The system shall use a neural network because this is the best solution. Which principle should make you question this requirement?",
     options:["Requirements are not solutions","Shared responsibility","Requirements are iterative","Requirements must be documented"],
     correctIndex:0,explanation:"It may be valid as a constraint, but this phrasing is solution-prescriptive by default."},
    {id:"ch2-q29",question:"A requirement is changed five times during development. Which conclusion is most appropriate?",
     options:["The Requirements Engineering process has necessarily failed","Requirements can change as knowledge increases","The requirement should have been rejected initially","Requirements must never be revised"],
     correctIndex:1,explanation:"Change count alone does not prove failure; changes can reflect healthy refinement."},
    {id:"ch2-q30",question:"A team refuses to revisit requirements because Iteration creates unnecessary work. Which is the strongest counterargument?",
     options:["Iteration allows requirements to be refined as understanding improves","Requirements should always be changed","Documentation is unnecessary","Stakeholders should be removed from the process"],
     correctIndex:0,explanation:"Iteration reduces downstream defects by improving requirement quality early."},
    {id:"ch2-q31",question:"Which situation best demonstrates a conflict between value orientation and excessive documentation?",
     options:["The team documents safety-critical requirements carefully","The team creates thousands of pages of documentation that no stakeholder uses and that provides no project value","The team documents important interfaces","The team maintains traceability"],
     correctIndex:1,explanation:"Documentation should create value, not become an end in itself."},
    {id:"ch2-q32",question:"A stakeholder says I do not care how the system achieves this. I only care that the vehicle stops safely when the required condition occurs. Which principle is most directly reflected?",
     options:["Requirements are not solutions","Requirements are self-evident","Documentation is unnecessary","Requirements never change"],
     correctIndex:0,explanation:"The statement focuses on outcome/need rather than implementation."},
    {id:"ch2-q33",question:"A team says We cannot validate requirements until the system has been built. What is wrong with this statement?",
     options:["Requirements validation can and should happen before implementation is complete","Validation is only performed by users","Requirements cannot be validated","Validation is the same as coding"],
     correctIndex:0,explanation:"Validation is an RE activity and should happen well before full implementation."},
    {id:"ch2-q34",question:"Steering-by-wire scenario: stakeholder says steering response should feel natural, engineer writes system shall use a specific control algorithm. What principle was violated?",
     options:["Requirements are not solutions","Requirements are self-evident","Shared responsibility","Value orientation"],
     correctIndex:0,explanation:"The written statement jumped to a specific solution instead of preserving requirement intent."},
    {id:"ch2-q35",question:"A driver, safety engineer, and manufacturer interpret safe state differently. What should happen?",
     options:["The Requirements Engineer should document the phrase exactly as stated","The stakeholders should develop a shared understanding of the term","The driver should decide the meaning","The safety engineer should always decide"],
     correctIndex:1,explanation:"Critical terms require aligned interpretation across relevant stakeholders."},
    {id:"ch2-q36",question:"During testing, an unexpected operating condition is discovered that was not considered during elicitation. What is the best response?",
     options:["Ignore it because it was not in the original requirements","Analyze whether the requirements need to be revised or extended","Delete the existing requirements","Stop all testing"],
     correctIndex:1,explanation:"Unexpected conditions are valid inputs for iterative requirements refinement."},
    {id:"ch2-q37",question:"A manufacturer changes target market from luxury to low-cost vehicles. What may happen to requirements?",
     options:["They can remain unchanged in all cases","They may need to be revisited because stakeholder needs and priorities have changed","Requirements can never change due to business changes","Only source code changes"],
     correctIndex:1,explanation:"Business context changes can require reprioritization and requirement updates."},
    {id:"ch2-q38",question:"A system engineer says The requirement is correct because the customer approved it. What is the best response?",
     options:["Customer approval alone does not guarantee that the requirement is complete, consistent, unambiguous, or feasible","Customer approval always guarantees quality","Requirements do not need validation if approved","Only testers can approve requirements"],
     correctIndex:0,explanation:"Approval is important but does not replace quality checks and validation criteria."},
    {id:"ch2-q39",question:"Which statements about requirements are correct?",
     options:["Requirements may change over time","Requirements can be developed iteratively","Requirements should be validated","Requirements are always self-evident","Requirements should never be documented"],
     correctIndices:[0,1,2],explanation:"Requirements can change, be iteratively refined, and must be validated."},
    {id:"ch2-q40",question:"Which statements about shared understanding are correct?",
     options:["It involves relevant stakeholders having a sufficiently common interpretation","It means every stakeholder must have identical priorities","It can be supported by communication and documentation","It eliminates all disagreements","It reduces the risk of different interpretations"],
     correctIndices:[0,2,4],explanation:"Shared understanding is supported by communication and documentation and reduces interpretation risk."},
    {id:"ch2-q41",question:"Which statements reflect shared responsibility?",
     options:["Different roles can contribute to requirements quality","Only the Requirements Engineer is responsible for identifying ambiguity","Stakeholders can help clarify requirements","Developers and testers can identify requirements problems","Requirements quality is completely independent of communication"],
     correctIndices:[0,2,3],explanation:"Multiple roles participate in identifying and improving requirements quality."},
    {id:"ch2-q42",question:"Which statements about iterative Requirements Engineering are correct?",
     options:["Requirements can be refined as knowledge increases","Feedback can lead to changes in requirements","Iteration means requirements should be changed randomly","Requirements are necessarily completely known at project initiation","Iteration can help uncover misunderstandings"],
     correctIndices:[0,1,4],explanation:"Iteration is controlled refinement driven by knowledge and feedback, not random change."},
    {id:"ch2-q43",question:"Which statements about requirements and solutions are correct?",
     options:["A stakeholder may propose a solution when expressing a need","Requirements should never contain constraints under any circumstances","Unnecessary solution decisions can limit alternatives","A solution can sometimes be a valid constraint if imposed by the context","Requirements and solutions are always identical"],
     correctIndices:[0,2,3],explanation:"Needs and solutions should be separated where possible, while legitimate constraints may still apply."},
    {id:"ch2-q44",question:"Which statement is most accurate?",
     options:["A requirement should never contain any technical detail","A requirement may contain technical detail if that detail is genuinely required by the context","All technical details are automatically solutions and invalid","Requirements must always be completely technology-independent"],
     correctIndex:1,explanation:"Technical detail is acceptable when it is truly required as a constraint or context need."},
    {id:"ch2-q45",question:"A customer mandates that a system must use an existing communication protocol. Is this automatically a violation of requirements are not solutions?",
     options:["Yes, all technology decisions violate the principle","No, it may be a legitimate constraint","Yes, requirements cannot mention technology","It is automatically a goal"],
     correctIndex:1,explanation:"Mandated technology can be a valid contextual or organizational constraint."},
    {id:"ch2-q46",question:"A project team has excellent documentation but stakeholders still interpret requirements differently. Which conclusion is best?",
     options:["Documentation alone does not guarantee shared understanding","Documentation is therefore useless","The stakeholders should be excluded","The requirements must automatically be correct"],
     correctIndex:0,explanation:"Documentation supports communication but does not replace it."},
    {id:"ch2-q47",question:"A requirement is feasible, clear, and consistent, but contributes to no stakeholder goal. What is the most relevant concern?",
     options:["It may lack value","It is automatically ambiguous","It is necessarily a solution","It is automatically a constraint"],
     correctIndex:0,explanation:"A requirement should contribute meaningful value or stakeholder objective."},
    {id:"ch2-q48",question:"A stakeholder says I know exactly what I want, but I cannot explain it. What is the most appropriate response?",
     options:["Reject the stakeholder's input","Use appropriate elicitation and communication techniques to explore the need","Guess the requirement","Let the developer decide"],
     correctIndex:1,explanation:"RE techniques are designed to uncover and structure tacit needs."},
    {id:"ch2-q49",question:"A team has shared understanding of a requirement, but it is impossible within project constraints. Is it a good requirement?",
     options:["Yes, because shared understanding is sufficient","No, requirements also need to be assessed for feasibility and other quality aspects","Yes, if the customer likes it","It is automatically a solution"],
     correctIndex:1,explanation:"Shared understanding is necessary but not sufficient; feasibility and quality still matter."},
    {id:"ch2-q50",question:"Which statement best summarizes the relationship between the principles?",
     options:["Each principle operates independently","The principles reinforce each other throughout Requirements Engineering","Only the principle of documentation is important","The principles apply only to agile projects"],
     correctIndex:1,explanation:"The principles are interconnected and support each other in practice."},
 ]
},
{id:"ch3",number:3,title:"Requirements Documentation (Work Products)",
 subchapters:[
  {id:"ch3-1",title:"Natural Language Documentation",flashcards:[
    {id:"ch3-1-f1",front:"What are common problems with natural language requirements?",back:"• Ambiguity – multiple interpretations\n• Vagueness – unclear terms ('fast', 'user-friendly')\n• Incompleteness – missing conditions or edge cases\n• Inconsistency – contradictions between statements\n• Noise – irrelevant information\n• Inappropriate complexity – overly technical detail\n• Nominalisations – hiding verbs as nouns\n• Universal quantifiers without specifics ('always', 'never')"},
    {id:"ch3-1-f2",front:"What is a boilerplate/sentence-template for natural language requirements?",back:"A SYNTACTICAL BLUEPRINT for a requirement's structure.\n\nFormat: [Subject] shall [verb] [object] [condition]\n\nExample: 'The system shall send a confirmation email to the user after a successful order.'\n\n'Shall' = mandatory; 'should' = recommended; 'may' = optional.\n\nNote: A template defines SYNTAX, not semantics."},
    {id:"ch3-1-f3",front:"What is the most precise definition of a sentence-template for requirements?",back:"A sentence-template is a BLUEPRINT FOR THE SYNTACTICAL STRUCTURE of an individual requirement.\n\nIt defines HOW a requirement sentence is structured (word order, modal verbs, subject/object roles) — NOT what the requirement means or what values to use."},
    {id:"ch3-1-f4",front:"What guidelines should be followed when writing a requirements specification?",back:"✅ Good guidelines:\n• Only one requirement per sentence, no nesting\n• Use consistent terminology\n• Use sentence-templates for formulation\n• Use short sentences and paragraphs\n\n❌ Avoid:\n• Minimising headers (structure helps)\n• Italics for legally binding (use a formal marker)\n• 'Interesting' writing style (clarity over style)"},
    {id:"ch3-1-f5",front:"What is a glossary in RE, and why is it important?",back:"A glossary is a structured list of domain-specific terms with agreed definitions.\n\nBenefits:\n• Prevents misunderstandings from homonyms/synonyms\n• Establishes ONE correct term per concept\n• Required component of a proper requirements specification\n\nIf a term is found to represent two things, update the glossary AND review all affected requirements."},
  ]},
  {id:"ch3-2",title:"Model-Based Documentation",flashcards:[
    {id:"ch3-2-f1",front:"What elements does a use case diagram contain?",back:"Actors, use cases, and associations (relationships between them).\n\n• Actors: people or systems that interact with the system\n• Use cases: functional goals the system fulfils for actors\n• Associations: lines showing which actors participate in which use cases\n\n(NOT objects, messages, or activities — those are sequence/activity diagrams)"},
    {id:"ch3-2-f2",front:"What is the role of an 'actor' in a use case diagram?",back:"Actors represent PEOPLE AND SYSTEMS that interact with the system under development.\n\nAn actor is EXTERNAL to the system — it is in the system context. Actors can be primary (initiate use cases) or secondary (support use cases)."},
    {id:"ch3-2-f3",front:"What is the purpose of alternate flows in a use case?",back:"Alternate flows describe paths OTHER THAN the main success scenario.\n\nThey cover:\n• Alternative ways to achieve the goal\n• Exception/error conditions\n\nAlternate flows ensure that realistic deviations from the main path are documented."},
    {id:"ch3-2-f4",front:"What are the valid class relationships in UML class diagrams?",back:"• Association – general relationship\n• Aggregation – 'has-a' (parts can exist independently)\n• Composition – 'owns-a' (parts cannot exist without whole)\n• Generalisation – inheritance ('is-a')\n• Dependency\n\n'Merge' is NOT a valid UML class relationship."},
    {id:"ch3-2-f5",front:"What does a Composition relationship in a UML class diagram mean?",back:"A COMPOSITION is a strong form of aggregation where the part CANNOT exist without the whole.\n\nExample: An invoice and its invoice items. If the invoice is deleted, the items cease to exist too.\n\nModelled with a filled diamond at the whole end."},
    {id:"ch3-2-f6",front:"What are the elements of a state diagram?",back:"• States – conditions the system can be in\n• Transitions – movements between states\n• Events – triggers that cause transitions\n• Guards – conditions that must be true for a transition\n• Actions – activities executed on a transition\n• Initial state (filled circle)\n• Final state (circle with filled circle inside)\n\n(NOT: interaction, actor — those belong to other diagrams)"},
    {id:"ch3-2-f7",front:"How do you read a state diagram transition label: Payment received [invalid] / error message?",back:"Format: Event [Guard condition] / Action\n\n• Event: 'Payment received' — what triggered the transition\n• Guard: 'invalid' — condition that must be true\n• Action: 'error message' — what happens when transition fires\n\nThis is the standard UML notation for state machine transitions."},
    {id:"ch3-2-f8",front:"What are the main components of an Entity-Relationship Diagram (ERD)?",back:"Entities, attributes, identifiers (primary keys), and relationships.\n\nERDs model the structural perspective of requirements — the data the system handles and how data entities relate to each other.\n\n(NOT: data + transitions + storage — those are data flow)"},
    {id:"ch3-2-f9",front:"What is a user story?",back:"Agile format: 'As a [role], I want [goal] so that [benefit].'\n\nCaptures who needs something, what they need, and why. Acceptance criteria are added separately.\n\nUser stories are the PRIMARY requirements technique for user requirements in agile."},
    {id:"ch3-2-f10",front:"Which perspectives does the requirements model cover?",back:"1. Structural perspective – static structure (class diagrams, ERDs)\n2. Functional/Behavioural perspective – functions and processes (use cases, activity diagrams, DFDs)\n3. Dynamic/State perspective – system behaviour over time (state diagrams, sequence diagrams)\n\nA complete model typically covers all three perspectives."},
  ]},
  {id:"ch3-3",title:"Documentation Quality and Attributes",flashcards:[
    {id:"ch3-3-f1",front:"What are requirement attributes used for?",back:"Requirement attributes are properties attached to each requirement to support management. They can include:\n• ID (unique identifier – mandatory)\n• Priority / Importance\n• Criticality\n• Status (draft, approved, implemented)\n• Author / Responsibility\n• Release version for implementation\n• Legal binding status\n\nAll of these can be valid requirement attributes."},
    {id:"ch3-3-f2",front:"Why must every requirement have a unique identifier?",back:"A unique ID allows:\n• Traceability (linking to design, tests)\n• Unambiguous change management\n• Referencing in reviews and documents\n• Impact analysis when requirements change\n\nIDs should NOT change during the project."},
    {id:"ch3-3-f3",front:"Which diagram is LEAST suitable for documenting the details of a single use case?",back:"A context diagram is least suitable — it shows the system boundary and external actors, not the internal flow of an individual use case.\n\nBest for single use case detail:\n• Activity diagram (flow of steps)\n• State diagram (state changes during the use case)\n• Natural language (prose description)"},
    {id:"ch3-3-f4",front:"What are two structural diagram types used for the structural perspective of requirements?",back:"1. Entity-Relationship Diagram (ERD) — models data entities and relationships\n2. Class Diagram (UML) — models classes, attributes, and relationships\n\nBoth show structure (static). State diagrams and activity diagrams show dynamic behaviour."},
  ]},
 ],
 quiz:[
  {id:"ch3-q1",question:"Why are requirements documented?",options:["To create a permanent document that can never change","To support communication, development, validation and management","To replace stakeholder communication","To make requirements more complicated"],correctIndex:1,explanation:"Documentation provides a shared basis for communication and subsequent RE activities."},
  {id:"ch3-q2",question:"Which of the following is a common way to document requirements?",options:["Natural language","Models","Templates","All of the above"],correctIndex:3,explanation:"Natural language, models, and templates can all be appropriate depending on purpose and context."},
