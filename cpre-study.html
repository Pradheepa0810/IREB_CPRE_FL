const INTERVALS = [0,1,3,7,14,30];

function calcNext(tc){
  const d = new Date();
  d.setDate(d.getDate() + INTERVALS[Math.min(tc, INTERVALS.length-1)]);
  d.setHours(0,0,0,0);
  return d.toISOString();
}

function scheduleCorrect(cur){
  const tc = (cur.timesCorrect||0)+1;
  return {timesCorrect:tc, timesSeen:(cur.timesSeen||0)+1, lastSeen:new Date().toISOString(), nextReviewDate:calcNext(tc)};
}

function scheduleIncorrect(cur){
  return {timesCorrect:0, timesSeen:(cur.timesSeen||0)+1, lastSeen:new Date().toISOString(), nextReviewDate:calcNext(0)};
}

function isDue(card){ return !card||!card.nextReviewDate||new Date(card.nextReviewDate)<=new Date(); }

/* =====================================================================
   LOCALSTORAGE
===================================================================== */
const CARDS_KEY  = 'cpre_cards';
const QUIZZES_KEY = 'cpre_quizzes';
const REVISIT_KEY = 'cpre_revisit';
const PROGRESS_BACKUP_KEY = 'cpre_progress_backup';
const USER_QUESTIONS_KEY = 'cpre_user_added_questions_v1';
const USER_QUESTION_ATTEMPTS_KEY = 'cpre_user_question_attempts_v1';
const USER_FLASHCARDS_KEY = 'cpre_user_flashcards_v1';
const THEME_KEY = 'cpre_study_theme_v1';
const IMPORT_BACKUP_KEY = 'cpre_study_preimport_backup_v1';
const CASE_STUDY_ATTEMPTS_KEY = 'cpre_case_study_attempts_v1';

function readProgressValue(key,fallback){
  try{
    const primary=localStorage.getItem(key);
    if(primary!==null) return JSON.parse(primary);
    const backup=JSON.parse(localStorage.getItem(PROGRESS_BACKUP_KEY)||'null');
    return backup&&backup[key]!==undefined?backup[key]:fallback;
  }catch{return fallback;}
}
function persistProgress(){
  try{
    localStorage.setItem(PROGRESS_BACKUP_KEY,JSON.stringify({
      [CARDS_KEY]:readProgressValue(CARDS_KEY,{}),
      [QUIZZES_KEY]:readProgressValue(QUIZZES_KEY,[]),
      [REVISIT_KEY]:readProgressValue(REVISIT_KEY,[]),
      savedAt:new Date().toISOString()
    }));
  }catch{}
}
function readCards(){ return readProgressValue(CARDS_KEY,{}); }
function readQuizzes(){ return readProgressValue(QUIZZES_KEY,[]); }
function readRevisit(){ return readProgressValue(REVISIT_KEY,[]); }
function saveCards(c){ localStorage.setItem(CARDS_KEY,JSON.stringify(c)); persistProgress(); }
function saveQuizzes(q){ localStorage.setItem(QUIZZES_KEY,JSON.stringify(q)); persistProgress(); }
function saveRevisit(r){ localStorage.setItem(REVISIT_KEY,JSON.stringify(r)); persistProgress(); }

function readUserQuestions(){
  try{
    const questions=JSON.parse(localStorage.getItem(USER_QUESTIONS_KEY)||'[]');
    return Array.isArray(questions)?questions.filter(isValidUserQuestion):[];
  }catch{return [];}
}
function isValidUserQuestion(q){
  if(!q||typeof q!=='object'||typeof q.id!=='string'||!/^user-[A-Za-z0-9-]{8,80}$/.test(q.id)||typeof q.question!=='string'||!q.question.trim())return false;
  if(!Array.isArray(q.options)||q.options.length!==4||q.options.some(option=>typeof option!=='string'||!option.trim()))return false;
  const answers=Array.isArray(q.correctIndices)?q.correctIndices:[q.correctIndex];
  if(!answers.length||answers.some(index=>!Number.isInteger(index)||index<0||index>3)||new Set(answers).size!==answers.length)return false;
  if(q.imageDataUrl&&(!/^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(q.imageDataUrl)||q.imageDataUrl.length>420000))return false;
  return true;
}
function saveUserQuestions(questions){
  const serialized=JSON.stringify(questions);
  if(serialized.length>3500000)throw new Error('Your question bank is near the browser storage limit. Remove an image or use a smaller one.');
  localStorage.setItem(USER_QUESTIONS_KEY,serialized);
}
function readUserFlashcards(){
  try{
    const cards=JSON.parse(localStorage.getItem(USER_FLASHCARDS_KEY)||'[]');
    return Array.isArray(cards)?cards.filter(card=>card&&typeof card.id==='string'&&/^user-fc-[A-Za-z0-9-]{8,80}$/.test(card.id)&&typeof card.front==='string'&&card.front.trim()&&typeof card.back==='string'&&card.back.trim()):[];
  }catch{return [];}
}
function saveUserFlashcards(cards){
  const serialized=JSON.stringify(cards);
  if(serialized.length>1500000)throw new Error('Your flashcard collection is near the browser storage limit. Remove some cards and try again.');
  localStorage.setItem(USER_FLASHCARDS_KEY,serialized);
}
function applyTheme(theme,persist=false){
  const allowed=['bright','dark','high-contrast'];
  const value=allowed.includes(theme)?theme:'bright';
  document.documentElement.dataset.theme=value;
  const select=$('theme-select');
  if(select)select.value=value;
  if(persist){try{localStorage.setItem(THEME_KEY,value)}catch{}}
}
function initializeTheme(){
  let saved='bright';
  try{saved=localStorage.getItem(THEME_KEY)||'bright'}catch{}
  applyTheme(saved);
}
function setTheme(theme){applyTheme(theme,true);}

function findUserQuestion(questionId){return readUserQuestions().find(question=>question.id===questionId)||null;}

function getCard(id){ return readCards()[id]||{timesCorrect:0,timesSeen:0,lastSeen:null,nextReviewDate:null}; }
function updateCard(id,patch){ const c=readCards(); c[id]={...getCard(id),...patch}; saveCards(c); }

function getMastery(cardIds){
  if(!cardIds.length) return 0;
  const cards=readCards();
  // Due means review is scheduled; it does not erase accumulated mastery.
  const n=cardIds.filter(id=>{const c=cards[id]; return c&&c.timesCorrect>=2;}).length;
  return Math.round(n/cardIds.length*100);
}
function getDueCount(cardIds){ const cards=readCards(); return cardIds.filter(id=>isDue(cards[id])).length; }
function getBestScore(chId){ const a=readQuizzes().filter(q=>q.chapterId===chId); if(!a.length)return null; return Math.round(Math.max(...a.map(q=>q.score/q.totalQuestions))*100); }
function getAttempts(chId){ return readQuizzes().filter(q=>q.chapterId===chId).sort((a,b)=>new Date(b.date)-new Date(a.date)); }
function recordAttempt(att){ const q=readQuizzes(); q.push({...att,date:new Date().toISOString()}); saveQuizzes(q); }

function findQuestion(chapterId,questionId){
  if(chapterId==='user-added'){
    const question=findUserQuestion(questionId);
    return question?{chapter:{number:'Custom',title:'Add quiz'},question}:null;
  }
  const ch=DATA.chapters.find(c=>c.id===chapterId);
  if(!ch) return null;
  const q=ch.quiz.find(x=>x.id===questionId);
  if(!q) return null;
  return {chapter:ch,question:q};
}

function isMarkedForRevisit(questionId){
  return readRevisit().some(r=>r.questionId===questionId);
}

function toggleRevisitQuestion(chapterId,questionId){
  const list=readRevisit();
  const ix=list.findIndex(r=>r.questionId===questionId);
  if(ix>=0){
    list.splice(ix,1);
  }else{
    list.push({chapterId,questionId,markedAt:new Date().toISOString()});
  }
  saveRevisit(list);
}

function removeRevisitQuestion(questionId){
  const list=readRevisit().filter(r=>r.questionId!==questionId);
  saveRevisit(list);
  if(STATE.view==='dashboard'||STATE.view==='revisit') renderMain();
}

// flashcard session state

// final mock exam state

let CS = null;

let mockBankReady=false;

let splashTimeout=null;

function showLoadingSplash(durationMs,callback){
  const splash=$('loading-splash');
  if(!splash){callback?.();return;}
  if(splashTimeout)clearTimeout(splashTimeout);
  splash.style.setProperty('--loading-duration',`${durationMs}ms`);
  const ring=splash.querySelector('.loading-progress');
  if(ring){ring.style.animation='none';void ring.getBoundingClientRect();ring.style.animation='';}
  splash.classList.remove('is-hidden');
  splash.setAttribute('aria-busy','true');
  splashTimeout=setTimeout(()=>{
    splash.classList.add('is-hidden');
    splash.removeAttribute('aria-busy');
    splashTimeout=null;
    callback?.();
  },durationMs);
}
function showQuizLoading(callback){showLoadingSplash(2000,callback);}
function setMockAccommodation(enabled){
  MOCK_LONG_MODE=!!enabled;
  document.querySelectorAll('[data-mock-duration]').forEach(node=>{node.textContent=`⏱ ${MOCK_LONG_MODE?90:Number(node.dataset.mockDuration)} min`;});
}
function navigate(view, extra){
  if(view==='quiz'&&!extra?.skipLoading){showQuizLoading(()=>navigate(view,{...extra,skipLoading:true}));return;}
  // Remove keyboard handlers when leaving views
  window.removeEventListener('keydown', fcKeyHandler);
  if(view!=='mock'&&mockTimer){ clearInterval(mockTimer); mockTimer=null; }
  if(view!=='case-study-run'&&view!=='mock-case-study-run'&&caseStudyTimer){ clearInterval(caseStudyTimer); caseStudyTimer=null; }
  STATE = {view, ...extra};
  updateNav();
  renderMain();
  window.scrollTo(0,0);
}

function updateNav(){
  ['dashboard','case-study','mock','progress','revisit'].forEach(id=>{
    const btn=document.getElementById('nb-'+id);
    if(btn) btn.classList.toggle('active', STATE.view===id||(id==='case-study'&&STATE.view.startsWith('case-study-'))||(id==='mock'&&STATE.view.startsWith('mock-case-study-')));
  });
}

function fmtDate(iso){ if(!iso) return '—'; return new Date(iso).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }

function progressRing(pct,size=48,stroke=4.5){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c-(pct/100)*c;
  return `<svg width="${size}" height="${size}" class="ring" aria-hidden="true">
    <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/>
    <circle class="ring-fill" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
  </svg>`;
}

async function addUserQuestion(event){
  event.preventDefault();
  const form=$('user-question-form'),status=$('user-question-status');
  const answers=[...form.querySelectorAll('input[name="user-correct-answer"]:checked')].map(input=>Number(input.value));
  const options=[0,1,2,3].map(index=>$(`user-option-${index}`).value.trim());
  const imageFile=$('user-question-image').files[0];
  const imageAlt=$('user-question-image-alt').value.trim();
  if(!answers.length){status.hidden=false;status.textContent='Select at least one correct answer.';return;}
  if(imageFile&&(imageFile.size>300*1024||!['image/png','image/jpeg','image/webp'].includes(imageFile.type))){status.hidden=false;status.textContent='Choose a PNG, JPG, or WebP image smaller than 300 KB.';return;}
  if(imageFile&&!imageAlt){status.hidden=false;status.textContent='Please add a short image description (alt text).';return;}
  let imageDataUrl='';
  if(imageFile){
    try{imageDataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||''));reader.onerror=()=>reject(new Error('Could not read the image file.'));reader.readAsDataURL(imageFile)})}
    catch(error){status.hidden=false;status.textContent=error.message;return;}
  }
  const question={id:`user-${crypto.randomUUID()}`,question:$('user-question-text').value.trim(),options,explanation:$('user-question-explanation').value.trim(),...(answers.length===1?{correctIndex:answers[0]}:{correctIndices:answers}),...(imageDataUrl?{imageDataUrl,imageAlt}:{}),createdAt:new Date().toISOString()};
  if(!isValidUserQuestion(question)){status.hidden=false;status.textContent='Check that the question, all four options, and correct answers are valid.';return;}

/* =====================================================================
   QUIZ VIEW
===================================================================== */
const PASS = 0.70;

function isMultiQuestion(q){
  return q.type==='P'||Array.isArray(q.correctIndices);
}

function getCorrectIndices(q){
  if((q.type==='A'||q.type==='P')&&Array.isArray(q.correctAnswer))return q.correctAnswer.map(id=>q.options.findIndex(option=>option.id===id)).filter(index=>index>=0);
  return isMultiQuestion(q) ? q.correctIndices : [q.correctIndex];
}

function chapterQuestionType(q){return q.type|| (Array.isArray(q.correctIndices)?'P':'A');}
function chapterQuestionText(q){return q.prompt||q.question;}
function scoreChapterQuestion(q,answer){
  const type=chapterQuestionType(q),points=q.points||1;
  if(type==='K'){
    const values=answer&&typeof answer==='object'&&!Array.isArray(answer)?answer:{};
    const count=q.statements.filter(statement=>typeof values[statement.id]==='boolean'&&values[statement.id]===q.correctAnswer[statement.id]).length;
    return points*count/q.statements.length;
  }
  if(!Array.isArray(answer))return 0;
  const correct=getCorrectIndices(q),required=type==='A'?1:(q.requiredCount||correct.length);
  if(answer.length>required||new Set(answer).size!==answer.length)return 0;
  const matches=answer.filter(index=>correct.includes(index)).length;
  return type==='A'?(matches===1?points:0):points*matches/required;
}
function chapterAnswerText(q,answer,correct=false){
  const type=chapterQuestionType(q);
  if(type==='K')return q.statements.map(statement=>`${statement.id}: ${correct?(q.correctAnswer[statement.id]?'True':'False'):(typeof answer?.[statement.id]==='boolean'?(answer[statement.id]?'True':'False'):'Unanswered')}`).join(' · ');
  const indices=correct?getCorrectIndices(q):(Array.isArray(answer)?answer:[]);
  if(!indices.length)return 'Unanswered';
  return indices.map(index=>`${String.fromCharCode(65+index)}. ${q.options[index]||''}`).join(' · ');
}

function sameIndexSet(a,b){
  if(a.length!==b.length) return false;
  const as=[...a].sort((x,y)=>x-y);
  const bs=[...b].sort((x,y)=>x-y);
  for(let i=0;i<as.length;i++) if(as[i]!==bs[i]) return false;
  return true;
}

    <div class="pg-hdr"><h1 class="pg-title">${isUserQuiz?'Add quiz':`Chapter ${ch.number} quiz`}</h1><p class="pg-sub">${isUserQuiz?'User-added practice · your custom question progress is stored separately':'Combined chapter question bank'} mode</p></div>
    <div id="qz-body"></div>`;

function renderQzBody(){
  const body=$('qz-body');
  if(!body)return;
  if(QS.mode==='result'){renderQzResult();return;}
  if(QS.idx>=QS.questions.length){finishQuiz();return;}
  const q=QS.questions[QS.idx];
  const type=chapterQuestionType(q);
  const multi=isMultiQuestion(q);
  const kAnswer=QS.selectedIndices&&typeof QS.selectedIndices==='object'&&!Array.isArray(QS.selectedIndices)?QS.selectedIndices:{};
  const revisitMarked=isMarkedForRevisit(q.id);
  const pct=Math.round(QS.idx/QS.questions.length*100);
  let opts='';
  if(type!=='K')q.options.forEach((opt,i)=>{
    let cls='qz-opt';
    const selected=QS.selectedIndices.includes(i);
    const isCorrect=getCorrectIndices(q).includes(i);
    if(QS.answered){
      if(isCorrect) cls+=' ok';
      if(selected && !isCorrect) cls+=' ng';
    }else if(selected){
      cls+=' sel';
    }
    opts+=`<button class="${cls}" onclick="qzChoose(${i})" ${QS.answered?'disabled':''}><span style="opacity:.5;margin-right:.5rem;font-size:.82rem">${String.fromCharCode(65+i)}.</span>${escHtml(opt)}</button>`;
  });
  const choiceControls=type==='K'?q.statements.map(statement=>`<div class="case-statement"><div class="case-statement-text"><b>${escHtml(statement.id)}.</b> ${escHtml(statement.text)}</div><div class="case-tf"><button class="${kAnswer[statement.id]===true?'selected':''}" onclick="qzChooseK('${escHtml(q.id)}','${escHtml(statement.id)}',true)" ${QS.answered?'disabled':''} aria-pressed="${kAnswer[statement.id]===true}">True</button><button class="${kAnswer[statement.id]===false?'selected':''}" onclick="qzChooseK('${escHtml(q.id)}','${escHtml(statement.id)}',false)" ${QS.answered?'disabled':''} aria-pressed="${kAnswer[statement.id]===false}">False</button></div></div>`).join(''):`<div class="qz-opts">${opts}</div>`;
  const selectedCount=type==='K'?Object.keys(kAnswer).length:Array.isArray(QS.selectedIndices)?QS.selectedIndices.length:0;
  body.innerHTML=`<div class="qz-wrap">
    <div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="qz-meta" style="margin-top:.3rem">
        <span>Question ${QS.idx+1} of ${QS.questions.length} · <span class="qtype-tag">${type}</span></span>
        <span>${QS.results.filter(r=>r.correct).length} correct</span>
      </div>
    </div>
    <p class="qz-q">${escHtml(chapterQuestionText(q))}</p>
    ${q.imageDataUrl?`<img class="question-image" src="${q.imageDataUrl}" alt="${escHtml(q.imageAlt||'Question image')}">`:''}
    ${type==='K'?`<p class="pg-sub">Judge each statement True or False. Partial credit is awarded per statement.</p>`:multi?`<p style="font-size:.8rem;color:var(--text2);margin-top:-.35rem">Select exactly ${q.requiredCount||getCorrectIndices(q).length} answer(s). Partial credit is awarded; selecting more than required scores zero.</p>`:''}
    ${choiceControls}
    ${!QS.answered?`<div style="display:flex;justify-content:space-between;gap:.6rem;align-items:center;flex-wrap:wrap">
      <button class="btn btn-s" onclick="qzToggleRevisit()">${revisitMarked?`${svgIcon('check')} Marked for revisit`:`${svgIcon('revisit')} Revisit later`}</button>
      <button class="btn btn-p" onclick="qzSubmit()" ${selectedCount===0?'disabled':''}>Submit</button>
    </div>`:`<div style="text-align:left"><button class="btn btn-s" onclick="qzToggleRevisit()">${revisitMarked?`${svgIcon('check')} Marked for revisit`:`${svgIcon('revisit')} Revisit later`}</button></div>`}
    ${QS.answered?`<div class="explain"><strong>${QS.results[QS.results.length-1].correct?`${svgIcon('check')} Correct!`:`${svgIcon('close')} Incorrect.`}</strong>${q.explanation?` ${escHtml(q.explanation)}`:''}</div>
      <div style="text-align:right"><button class="btn btn-p" onclick="qzNext()">${QS.idx+1>=QS.questions.length?'See results':'Next'} ${svgIcon('arrow')}</button></div>`:''}
  </div>`;
}

function qzToggleRevisit(){
  if(!QS||QS.idx>=QS.questions.length) return;
  const q=QS.questions[QS.idx];
  toggleRevisitQuestion(QS.chapterId,q.id);
  renderQzBody();
}

function qzChoose(i){
  if(QS.answered)return;
  const q=QS.questions[QS.idx];
  if(isMultiQuestion(q)){
    const pos=QS.selectedIndices.indexOf(i);
    if(pos>=0) QS.selectedIndices.splice(pos,1);
    else QS.selectedIndices.push(i);
  }else{
    QS.selectedIndices=[i];
  }
  renderQzBody();
}

function qzChooseK(questionId,statementId,value){
  if(QS.answered)return;
  const q=QS.questions[QS.idx];
  if(q.id!==questionId||chapterQuestionType(q)!=='K')return;
  const current=QS.selectedIndices&&typeof QS.selectedIndices==='object'&&!Array.isArray(QS.selectedIndices)?QS.selectedIndices:{};
  QS.selectedIndices={...current,[statementId]:value};
  renderQzBody();
}

function qzSubmit(){
  const q=QS.questions[QS.idx],type=chapterQuestionType(q);
  const hasSelection=type==='K'?Object.keys(QS.selectedIndices||{}).length>0:Array.isArray(QS.selectedIndices)&&QS.selectedIndices.length>0;
  if(QS.answered||!hasSelection)return;
  const earned=scoreChapterQuestion(q,QS.selectedIndices),correct=Math.abs(earned-(q.points||1))<=1e-10;
  QS.answered=true;
  QS.results.push({question:q,selectedIndices:chapterQuestionType(q)==='K'?{...QS.selectedIndices}:[...QS.selectedIndices],correct,earned});
  renderQzBody();
}

function qzNext(){
  QS.idx++;
  QS.selectedIndices=[];
  QS.answered=false;
  if(QS.idx>=QS.questions.length) finishQuiz();
  else renderQzBody();
}

function finishQuiz(){
  const correct=QS.results.filter(r=>r.correct).length;
  const rawPoints=QS.results.reduce((sum,result)=>sum+(result.earned??scoreChapterQuestion(result.question,result.selectedIndices)),0);
  const totalPoints=QS.questions.reduce((sum,question)=>sum+(question.points||1),0);
  const attempt={chapterId:QS.chapterId,quizSet:QS.quizSet,score:rawPoints,totalQuestions:totalPoints,questionCount:QS.questions.length,correctQuestions:correct,missedQuestionIds:QS.results.filter(r=>!r.correct).map(r=>r.question.id),date:new Date().toISOString()};
  if(QS.chapterId==='user-added'){
    try{const attempts=JSON.parse(localStorage.getItem(USER_QUESTION_ATTEMPTS_KEY)||'[]');attempts.push(attempt);localStorage.setItem(USER_QUESTION_ATTEMPTS_KEY,JSON.stringify(attempts));}
    catch(error){console.warn('Could not save user-question attempt; built-in progress was not changed.',error);}
  }else recordAttempt(attempt);
  QS.mode='result';
  renderQzResult();
}

function renderQzResult(){
  const body=$('qz-body');
  if(!body)return;
  const correct=QS.results.filter(r=>r.correct).length;
  const total=QS.results.length;
  const rawPoints=QS.results.reduce((sum,result)=>sum+(result.earned??scoreChapterQuestion(result.question,result.selectedIndices)),0);
  const totalPoints=QS.questions.reduce((sum,question)=>sum+(question.points||1),0);
  const pct=totalPoints?Math.round(rawPoints/totalPoints*100):0;
  const pass=pct>=PASS*100;
  const missed=QS.results.filter(r=>!r.correct);

  let missedHtml='';
  missed.forEach(({question,selectedIndices})=>{
    const yourAnswer=chapterAnswerText(question,selectedIndices,false);
    const correctAnswer=chapterAnswerText(question,selectedIndices,true);
    const earned=scoreChapterQuestion(question,selectedIndices);
    missedHtml+=`<div class="missed-item">
      <p class="missed-q">${escHtml(chapterQuestionText(question))}</p>
      <p class="rv-meta">${escHtml(chapterQuestionType(question))} · ${earned.toFixed(2).replace(/\.00$/,'')} / ${question.points||1} points</p>
      <p class="missed-wrong">${svgIcon('close')} Your answer: ${escHtml(yourAnswer)}</p>
      <p class="missed-ok">${svgIcon('check')} Correct: ${escHtml(correctAnswer)}</p>
      ${question.explanation?`<p class="missed-exp">${escHtml(question.explanation)}</p>`:''}
    </div>`;
  });

  body.innerHTML=`<div style="max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:1.4rem">
    <div class="score-card">
      <div class="score-num ${pass?'pass':'fail'}">${pct}%</div>
      <div class="pass-badge ${pass?'pass':'fail'}">${pass?`${svgIcon('check')} PASS`:`${svgIcon('close')} FAIL`} — threshold 70%</div>
      <p style="font-size:.87rem;color:var(--text2)">${rawPoints.toFixed(2).replace(/\.00$/,'')} / ${totalPoints} points · ${correct} of ${total} fully correct</p>
    </div>
    ${missed.length>0?`<div><h2 style="font-weight:700;margin-bottom:.65rem;font-size:.95rem">Missed questions (${missed.length})</h2><div class="missed-list">${missedHtml}</div></div>`:''}
    <div style="display:flex;gap:.7rem;flex-wrap:wrap">
      ${missed.length>0?`<button class="btn btn-p" onclick="qzRetryMissed()">${svgIcon('arrow')} Retry missed</button>`:''}
      <button class="btn btn-s" onclick="qzRetryAll()">Restart quiz</button>
      <button class="btn btn-g" onclick="${QS.chapterId==='user-added'?"navigate('user-questions')":`navigate('chapter',{chapterId:'${QS.chapterId}'})`}">${QS.chapterId==='user-added'?'Back to Add quiz':'Back to chapter'}</button>
    </div>
  </div>`;
}

function qzRetryMissed(){
  const missed=QS.results.filter(r=>!r.correct).map(r=>r.question);
  if(!missed.length)return;
  QS={chapterId:QS.chapterId,quizSet:QS.quizSet,questions:missed,idx:0,selectedIndices:[],answered:false,results:[],mode:null};
  renderQzBody();
}
function qzRetryAll(){
  const ch=DATA.chapters.find(c=>c.id===QS.chapterId);
  const source=QS.chapterId==='user-added'?readUserQuestions():QS.quizSet==='supplemental'&&ch.supplementalQuiz?ch.supplementalQuiz:ch.quiz;
  QS={chapterId:QS.chapterId,quizSet:QS.quizSet,questions:[...source],idx:0,selectedIndices:[],answered:false,results:[],mode:null};
  renderQzBody();
}

function formatMockTime(seconds){
  const mins=Math.floor(Math.max(0,seconds)/60);
  const secs=Math.max(0,seconds)%60;
  return `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
}

function renderMock(){
  if(!MS) MS={phase:'intro'};
  if(MS.phase==='intro'){renderMockIntro();return;}
  if(MS.phase==='result'){renderMockResult();return;}
  renderMockQuestion();
}

function renderMockIntro(){
  if(!MOCK_BANK_READY){
    $('main').innerHTML=`<div class="qz-wrap"><div class="pg-hdr"><h1 class="pg-title">CPRE FL Mock Center</h1><p class="pg-sub">Loading and validating the fixed mock sets…</p></div><div class="loading-mark" role="status" aria-label="Loading mock tests"><img src="./assets/favicon.svg" alt="" width="52" height="52"><svg class="loading-ring" viewBox="0 0 88 88" aria-hidden="true"><circle class="loading-track" cx="44" cy="44" r="40"/><circle class="loading-progress" cx="44" cy="44" r="40"/></svg></div></div>`;
    return;
  }
  if(MOCK_BANK_ERROR){$('main').innerHTML='<div class="pg-hdr"><h1 class="pg-title">CPRE FL Mock Center</h1><p class="pg-sub">The fixed mock-test files could not be loaded and validated. No test was started.</p></div>';return;}

  const caseAttempts=readCaseStudyAttempts().filter(attempt=>attempt.series==='final-mock');
  $('main').innerHTML=`<div class="qz-wrap">
    <div class="pg-hdr"><h1 class="pg-title">CPRE FL Mock Center</h1>
      <p class="pg-sub">Fifteen timed 45-question practice tests</p></div>
    <div class="card" style="margin-bottom:1rem">
      <p style="font-size:.86rem;color:var(--text2);line-height:1.6">Each set contains 45 questions and is timed. The standard duration is 75 minutes, with a 90-minute non-native-language accommodation. Pass mark: 70% of available points. Type P uses partial credit with zero for over-selection; type K is scored per statement.</p>
      <label class="toggle" style="display:flex;align-items:center;gap:.45rem;margin-top:.7rem"><input id="mockLongMode" type="checkbox" ${MOCK_LONG_MODE?'checked':''} onchange="setMockAccommodation(this.checked)"> 90 minutes · non-native-language accommodation</label>
    </div>
    <div class="ch-grid">${tests.map(test=>{const testNumber=Number(test.id.split('-').pop()),history=test.canonicalMockId?caseAttempts.filter(item=>item.mockId===test.canonicalMockId):[];return `<article class="ch-card" style="cursor:default">
      <div class="ch-top"><span class="ch-num">Mock Test ${testNumber} · ${test.questions.length} Q</span></div>
      <p class="ch-title">${test.title.replaceAll('"','')}</p><div class="ch-meta"><span data-mock-duration="${Math.round(test.durationSeconds/60)}">⏱ ${MOCK_LONG_MODE?90:Math.round(test.durationSeconds/60)} min</span><span>${svgIcon('trophy')} ${test.passPercent}% pass</span></div>
      ${history.length?`<p class="small-note">Latest: ${Math.round(history.at(-1).percentage)}% · ${history.at(-1).passed?'Pass':'Not passed'}</p>`:''}
      <button class="btn btn-p" onclick="startMockExam('${test.id}')">Start test</button>
    </article>`}).join('')}</div>
  </div>`;

function startMockExam(testId='mock-full',options={}){
  if(!options.loadingComplete){showQuizLoading(()=>startMockExam(testId,{...options,loadingComplete:true}));return;}
  const sourceTest=testId==='mock-full'?getFullLengthMock():MOCK_SETS.find(item=>item.id===testId);
  if(sourceTest?.canonicalMockId){
    const minutes=MOCK_LONG_MODE?90:Math.round(sourceTest.durationSeconds/60);
    beginCaseStudy(sourceTest.canonicalMockId,{series:'final-mock',displayNumber:Number(testId.split('-').pop()),durationMinutes:minutes});
    return;
  }
  const requestedMinutes=MOCK_LONG_MODE?90:75;
  const test=sourceTest?{...sourceTest,durationSeconds:requestedMinutes*60}:null;
  if(!test)return;
  MS={phase:'exam',test,questions:[...test.questions],idx:0,selectedIndices:[],answered:false,results:[],answers:{},reviewed:{},remainingSeconds:test.durationSeconds};
  if(mockTimer) clearInterval(mockTimer);
  mockTimer=setInterval(()=>{
    if(!MS||MS.phase!=='exam'){clearInterval(mockTimer);mockTimer=null;return;}
    MS.remainingSeconds--;
    if(MS.remainingSeconds<=0){finishMock(true);return;}
    const timer=$('mock-timer');
    if(timer) timer.textContent=formatMockTime(MS.remainingSeconds);
  },1000);
  renderMockQuestion();
}

function renderMockQuestion(){
  const q=MS.questions[MS.idx];
  const multi=isMultiQuestion(q);
  const qType=q.type|| (multi?'P':'A');
  const currentResult=MS.results.find(result=>result.question.id===q.id);
  const pct=Math.round(MS.idx/MS.questions.length*100);
  let opts='';
  q.options.forEach((opt,i)=>{
    let cls='qz-opt';
    if(MS.answered){
      if(getCorrectIndices(q).includes(i)) cls+=' ok';
      if(MS.selectedIndices.includes(i)&&!getCorrectIndices(q).includes(i)) cls+=' ng';
    }else if(MS.selectedIndices.includes(i)) cls+=' sel';
    opts+=`<button class="${cls}" onclick="mockChoose(${i})" ${MS.answered?'disabled':''}><span style="opacity:.5;margin-right:.5rem;font-size:.82rem">${String.fromCharCode(65+i)}.</span>${escHtml(opt)}</button>`;
  });
  const answeredCount=Object.keys(MS.answers).length;
  const maxPoints=MS.questions.reduce((sum,item)=>sum+(item.points||1),0);
  const navigator=MS.questions.map((item,index)=>`<button class="sub-chip ${index===MS.idx?'on':''}" style="min-width:2.1rem;text-align:center;padding:.3rem .45rem;${MS.answers[item.id]?'border-color:var(--ok);':''}" onclick="mockGo(${index})">${index+1}${MS.reviewed[item.id]?svgIcon('revisit'):''}</button>`).join('');
  $('main').innerHTML=`<div class="qz-wrap">
    <div>
      <div class="qz-meta"><span>${MS.test.title}</span><span id="mock-timer" class="mock-timer">${formatMockTime(MS.remainingSeconds)}</span></div>
      <div class="prog-bar" style="margin-top:.35rem"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="qz-meta" style="margin-top:.3rem"><span>Question ${MS.idx+1} of ${MS.questions.length} · <span class="qtype-tag">${qType}</span> · ${q.points||1} point${(q.points||1)!==1?'s':''}</span><span>${answeredCount} answered · ${Object.keys(MS.reviewed).length} marked · ${maxPoints} total</span></div>
    </div>
    <div class="sub-chips" style="margin-bottom:0">${navigator}</div>
    <p class="qz-q">${escHtml(q.question)}</p>
    ${multi?`<p style="font-size:.8rem;color:var(--text2);margin-top:-.35rem">Select all that apply.</p>`:''}
    <div class="qz-opts">${opts}</div>
    ${!MS.answered?`<div style="display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap"><button class="btn btn-s" onclick="mockToggleReview()">${svgIcon('revisit')} ${MS.reviewed[q.id]?'Marked for review':'Mark for review'}</button><button class="btn btn-p" onclick="mockSubmit()" ${MS.selectedIndices.length===0?'disabled':''}>Save answer</button></div>`:''}
    ${MS.answered?`<div class="explain"><strong>${currentResult&&currentResult.correct?`${svgIcon('check')} Correct!`:`${svgIcon('close')} Incorrect.`}</strong> ${escHtml(q.explanation)}</div>
      <div style="display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap"><button class="btn btn-s" onclick="mockToggleReview()">${svgIcon('revisit')} ${MS.reviewed[q.id]?'Marked for review':'Mark for review'}</button><button class="btn btn-p" onclick="mockNext()">${MS.idx+1===MS.questions.length?'See results':'Next'} ${svgIcon('arrow')}</button></div>`:''}
    <div style="text-align:right"><button class="btn btn-d" onclick="mockFinishConfirm()">Finish test</button></div>
  </div>`;
}

function mockChoose(i){
  if(!MS||MS.phase!=='exam'||MS.answered)return;
  const pos=MS.selectedIndices.indexOf(i);
  if(isMultiQuestion(MS.questions[MS.idx])){
    if(pos>=0) MS.selectedIndices.splice(pos,1);
    else MS.selectedIndices.push(i);
  }else{
    MS.selectedIndices=[i];
  }
  renderMockQuestion();
}

function mockSubmit(){
  if(!MS||MS.phase!=='exam'||MS.answered||MS.selectedIndices.length===0)return;
  const q=MS.questions[MS.idx];
  MS.answered=true;
  MS.answers[q.id]=[...MS.selectedIndices];
  MS.results=MS.questions.filter(item=>MS.answers[item.id]).map(item=>({question:item,selectedIndices:MS.answers[item.id],correct:sameIndexSet(MS.answers[item.id],getCorrectIndices(item))}));
  renderMockQuestion();
}

function mockGo(index){
  if(!MS||MS.phase!=='exam')return;
  MS.idx=index;
  const q=MS.questions[index];
  MS.selectedIndices=MS.answers[q.id]?[...MS.answers[q.id]]:[];
  MS.answered=!!MS.answers[q.id];
  renderMockQuestion();
}

function mockToggleReview(){
  const id=MS.questions[MS.idx].id;
  if(MS.reviewed[id]) delete MS.reviewed[id]; else MS.reviewed[id]=true;
  renderMockQuestion();
}

function mockFinishConfirm(){
  const unanswered=MS.questions.length-Object.keys(MS.answers).length;
  if(unanswered>0&&!confirm(`You have ${unanswered} unanswered question${unanswered===1?'':'s'}. Finish anyway?`))return;
  finishMock(false);
}

function mockNext(){
  if(!MS.answered)return;
  if(MS.idx+1>=MS.questions.length){mockFinishConfirm();return;}
  mockGo(MS.idx+1);
}

function finishMock(timedOut){
  if(!MS||MS.phase!=='exam')return;
  if(mockTimer){clearInterval(mockTimer);mockTimer=null;}
  const results=MS.questions.map(q=>({question:q,selectedIndices:MS.answers[q.id]||[],correct:!!MS.answers[q.id]&&sameIndexSet(MS.answers[q.id],getCorrectIndices(q))}));
  const correct=results.filter(r=>r.correct).length;
  const total=MS.questions.length;
  const earnedPoints=results.filter(r=>r.correct).reduce((sum,r)=>sum+(r.question.points||1),0);
  const maxPoints=MS.questions.reduce((sum,q)=>sum+(q.points||1),0);
  MS.results=results;
  MS.earnedPoints=earnedPoints;
  MS.maxPoints=maxPoints;
  recordAttempt({chapterId:MS.test.id,score:earnedPoints,totalQuestions:maxPoints,correctQuestions:correct,questionCount:total,missedQuestionIds:results.filter(r=>!r.correct).map(r=>r.question.id),timedOut:!!timedOut});
  MS.phase='result';
  MS.correct=correct;
  MS.timedOut=!!timedOut;
  renderMockResult();
}

function renderMockResult(){
  const correct=MS.correct||0;
  const total=MS.questions.length;
  const earnedPoints=MS.earnedPoints||0;
  const maxPoints=MS.maxPoints||MS.questions.reduce((sum,q)=>sum+(q.points||1),0);
  const pct=Math.round(earnedPoints/maxPoints*100);
  const pass=pct>=MS.test.passPercent;
  $('main').innerHTML=`<div class="qz-wrap">
    <div class="score-card"><div class="score-num ${pass?'pass':'fail'}">${pct}%</div>
      <div class="pass-badge ${pass?'pass':'fail'}">${pass?`${svgIcon('check')} PASS`:`${svgIcon('close')} FAIL`} — threshold ${MS.test.passPercent}%</div>
      <p style="font-size:.87rem;color:var(--text2)">${earnedPoints}/${maxPoints} points · ${correct} of ${total} correct${MS.timedOut?' · Time expired':''}</p></div>
    <div style="display:flex;gap:.7rem;flex-wrap:wrap"><button class="btn btn-p" onclick="startMockExam('${MS.test.id}')">Retake test</button><button class="btn btn-s" onclick="MS=null;renderMock()">Back to mock center</button><button class="btn btn-g" onclick="navigate('dashboard')">Chapters</button></div>
  </div>`;
}

/* =====================================================================
   CASE STUDY MOCKS — separate state and persistence from Final Mock
===================================================================== */
function getCaseStudySets(){
  const mocks=window.CPRE_QUESTION_BANK?.mocks;
  if(!Array.isArray(mocks)||mocks.length!==5)throw new Error('The five case-study mock sets could not be loaded.');
  for(const set of mocks){
    if(!set||!/^M[1-5]$/.test(set.id)||!Array.isArray(set.questions)||set.questions.length!==45)throw new Error('A case-study set failed its basic structure check.');
    for(const q of set.questions){
      if(!q||!['A','P','K'].includes(q.type)||!q.id||!q.prompt||!Number.isFinite(q.points))throw new Error(`Invalid question in ${set.id}.`);
      if(q.type==='K'&&(!Array.isArray(q.statements)||!q.correctAnswer||typeof q.correctAnswer!=='object'))throw new Error(`Invalid assertion question in ${set.id}.`);
      if(q.type!=='K'&&(!Array.isArray(q.options)||!Array.isArray(q.correctAnswer)))throw new Error(`Invalid choice question in ${set.id}.`);
    }
  }
  return mocks;
}
function readCaseStudyAttempts(){return safeReadArray(CASE_STUDY_ATTEMPTS_KEY);}
function renderCaseStudy(){
  let sets;try{sets=getCaseStudySets()}catch(error){$('main').innerHTML=`<div class="pg-hdr"><h1 class="pg-title">Case study</h1><p class="pg-sub">${escHtml(error.message)}</p></div>`;return;}
  const resume=CS&&CS.phase==='exam'&&CS.series!=='final-mock';
  $('main').innerHTML=`<div class="pg-hdr"><h1 class="pg-title">Case study</h1><p class="pg-sub">Now put your knowledge into practice with realistic case studies.</p></div>
    <div class="card" style="margin-bottom:1rem"><p style="font-size:.86rem;color:var(--text2);line-height:1.6">Practice with question navigation, mark-for-review, answer submission, and a detailed score review. P and K questions award partial credit.</p>${resume?`<div class="notice">An unfinished case study is paused. ${escHtml(CS.test.title)} · ${Object.keys(CS.answers).length}/${CS.questions.length} answers saved in this session.</div><button class="btn btn-p" onclick="resumeCaseStudy()">Resume case study</button>`:''}</div>
    <div class="ch-grid">${sets.map(set=>`<article class="ch-card" style="cursor:default"><div class="ch-top"><span class="ch-num">${escHtml(set.id)} · 45 Q</span></div><p class="ch-title">${escHtml(set.title.replaceAll('"',''))}</p><button class="btn btn-p" onclick="startCaseStudy('${set.id}')">Start ${escHtml(set.id)}</button></article>`).join('')}</div>`;
}
function startCaseStudy(mockId,options={}){
  if(!options.loadingComplete){showQuizLoading(()=>startCaseStudy(mockId,{...options,loadingComplete:true}));return;}
  const test=getCaseStudySets().find(set=>set.id===mockId);if(!test)return;
  beginCaseStudy(mockId,options);
}
function beginCaseStudy(mockId,options={}){
  if(CS?.phase==='exam'&&!confirm('Starting another exam will discard the unfinished answers in the current exam session. Continue?'))return;
  const test=getCaseStudySets().find(set=>set.id===mockId);if(!test)return;
  const series=options.series||'case-study';
  const minutes=series==='final-mock'?(options.durationMinutes||test.durationMinutes):null;
  CS={phase:'exam',series,displayNumber:options.displayNumber||null,test,questions:[...test.questions],idx:0,selected:[],answers:{},reviewed:{},remainingSeconds:minutes?minutes*60:null,startedAt:Date.now(),durationMinutes:minutes};
  STATE={view:series==='final-mock'?'mock-case-study-run':'case-study-run'};updateNav();if(series==='final-mock')startCaseStudyTimer();renderCaseStudyQuestion();window.scrollTo(0,0);
}
function resumeCaseStudy(){if(!CS||CS.phase!=='exam')return;STATE={view:'case-study-run'};updateNav();renderCaseStudyQuestion();window.scrollTo(0,0);}
function startCaseStudyTimer(){
  if(caseStudyTimer)clearInterval(caseStudyTimer);
  caseStudyTimer=setInterval(()=>{
    if(!CS||CS.phase!=='exam'){clearInterval(caseStudyTimer);caseStudyTimer=null;return;}
    CS.remainingSeconds=Math.max(0,CS.remainingSeconds-1);
    const timer=$('case-study-timer');if(timer)timer.textContent=formatMockTime(CS.remainingSeconds);
    if(CS.remainingSeconds<=0)finishCaseStudy(true);
  },1000);
}
function caseStudyAnswerForCurrent(){
  if(!CS)return;
  const q=CS.questions[CS.idx],saved=CS.answers[q.id];
  CS.selected=saved?(q.type==='K'?{...saved}:saved.slice()):(q.type==='K'?{}:[]);
}
function renderCaseStudyQuestion(){
  if(!CS||CS.phase!=='exam')return;
  const q=CS.questions[CS.idx],saved=Object.hasOwn(CS.answers,q.id),pct=Math.round(CS.idx/CS.questions.length*100);
  const counts=CS.questions.reduce((acc,item)=>(acc[item.type]=(acc[item.type]||0)+1,acc),{});
  const points=CS.questions.reduce((sum,item)=>sum+item.points,0);
  const navigator=CS.questions.map((item,index)=>`<button class="sub-chip ${index===CS.idx?'on':''}" style="min-width:2.1rem;text-align:center;padding:.3rem .45rem;${Object.hasOwn(CS.answers,item.id)?'border-color:var(--ok);':''}" onclick="caseStudyGo(${index})" aria-label="Question ${index+1}${Object.hasOwn(CS.answers,item.id)?', answered':''}${CS.reviewed[item.id]?', marked for review':''}">${index+1}${CS.reviewed[item.id]?svgIcon('revisit'):''}</button>`).join('');
  let answerMarkup='';
  if(q.type==='K'){
    const selected=CS.selected&&typeof CS.selected==='object'?CS.selected:{};
    answerMarkup=q.statements.map(statement=>`<div class="case-statement"><div class="case-statement-text"><b>${escHtml(statement.id)}.</b> ${escHtml(statement.text)}</div><div class="case-tf"><button class="${selected[statement.id]===true?'selected':''}" onclick="caseStudyChooseK('${escHtml(statement.id)}',true)" ${saved?'disabled':''} aria-pressed="${selected[statement.id]===true}">True</button><button class="${selected[statement.id]===false?'selected':''}" onclick="caseStudyChooseK('${escHtml(statement.id)}',false)" ${saved?'disabled':''} aria-pressed="${selected[statement.id]===false}">False</button></div></div>`).join('');
  }else{
    const selected=Array.isArray(CS.selected)?CS.selected:[];
    answerMarkup=`<div class="qz-opts">${q.options.map(option=>{const isSelected=selected.includes(option.id);return `<button class="qz-opt ${isSelected?'sel':''}" onclick="caseStudyChoose('${escHtml(option.id)}')" ${saved?'disabled':''}><span style="opacity:.6;margin-right:.5rem">${escHtml(option.id)}.</span>${escHtml(option.text)}</button>`}).join('')}</div>`;
  }
  const picked=q.type==='K'?Object.keys(CS.selected||{}).length:Array.isArray(CS.selected)?CS.selected.length:0;
  const examLabel=CS.series==='final-mock'?`Mock Test ${CS.displayNumber}`:CS.test.id;
  const examHeading=CS.series==='final-mock'?examLabel:`${examLabel} · ${CS.test.title.replaceAll('"','')}`;
  $('main').innerHTML=`<div class="qz-wrap">
    <div><div class="qz-meta"><span>${escHtml(examHeading)}</span>${CS.series==='final-mock'?`<span id="case-study-timer" class="mock-timer">${formatMockTime(CS.remainingSeconds)}</span>`:''}</div><div class="prog-bar" style="margin-top:.35rem"><div class="prog-fill" style="width:${pct}%"></div></div><div class="qz-meta" style="margin-top:.3rem"><span>Question ${CS.idx+1} of ${CS.questions.length} · <span class="qtype-tag">${q.type}</span> · ${q.points} point${q.points===1?'':'s'}</span><span>${Object.keys(CS.answers).length} answered · ${Object.keys(CS.reviewed).length} marked · ${points} total</span></div></div>
    <div class="sub-chips" style="margin-bottom:0">${navigator}</div><p class="qz-q">${escHtml(q.prompt)}</p>${q.type==='P'?`<p class="pg-sub">Select exactly ${q.requiredCount} answer${q.requiredCount===1?'':'s'} for full credit. Partial credit is awarded for correct selections; selecting more than required earns zero.</p>`:''}${q.type==='K'?`<p class="pg-sub">Judge each statement True or False. Partial credit is awarded per statement.</p>`:''}
    ${answerMarkup}
    <div style="display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap"><button class="btn btn-s" onclick="toggleCaseStudyReview()">${svgIcon('revisit')} ${CS.reviewed[q.id]?'Marked for review':'Mark for review'}</button>${saved?'<span class="small-note">Answer saved for this session.</span>':`<button class="btn btn-p" onclick="saveCaseStudyAnswer()" ${picked===0?'disabled':''}>Save answer</button>`}</div>
    ${saved?`<div style="display:flex;justify-content:flex-end"><button class="btn btn-p" onclick="caseStudyNext()">${CS.idx+1===CS.questions.length?'Finish exam':'Next question'} ${svgIcon('arrow')}</button></div>`:''}
    <div style="text-align:right"><button class="btn btn-d" onclick="confirmFinishCaseStudy()">Finish test</button></div>
  </div>`;
}
function caseStudyChoose(optionId){if(!CS||CS.phase!=='exam')return;const q=CS.questions[CS.idx];if(Object.hasOwn(CS.answers,q.id)||q.type==='K')return;const selected=Array.isArray(CS.selected)?CS.selected:[];if(q.type==='A')CS.selected=[optionId];else CS.selected=selected.includes(optionId)?selected.filter(id=>id!==optionId):[...selected,optionId];renderCaseStudyQuestion();}
function caseStudyChooseK(statementId,value){if(!CS||CS.phase!=='exam')return;const q=CS.questions[CS.idx];if(q.type!=='K'||Object.hasOwn(CS.answers,q.id))return;CS.selected={...(CS.selected||{}),[statementId]:value};renderCaseStudyQuestion();}
function saveCaseStudyAnswer(){
  if(!CS||CS.phase!=='exam')return;
  const q=CS.questions[CS.idx],selected=CS.selected;
  if(q.type==='K'?(!selected||!Object.keys(selected).length):(!Array.isArray(selected)||!selected.length))return;
  CS.answers[q.id]=q.type==='K'?{...selected}:[...selected];
  renderCaseStudyQuestion();
}
function caseStudyGo(index){if(!CS||CS.phase!=='exam'||!Number.isInteger(index)||index<0||index>=CS.questions.length)return;CS.idx=index;caseStudyAnswerForCurrent();renderCaseStudyQuestion();}
function toggleCaseStudyReview(){if(!CS||CS.phase!=='exam')return;const id=CS.questions[CS.idx].id;if(CS.reviewed[id])delete CS.reviewed[id];else CS.reviewed[id]=true;renderCaseStudyQuestion();}
function caseStudyNext(){if(!CS||CS.phase!=='exam')return;if(CS.idx+1>=CS.questions.length){confirmFinishCaseStudy();return;}caseStudyGo(CS.idx+1);}
function scoreCaseStudyQuestion(q,answer){
  if(q.type==='K'){
    const values=answer&&typeof answer==='object'?answer:{};
    const correct=q.statements.filter(statement=>typeof values[statement.id]==='boolean'&&values[statement.id]===q.correctAnswer[statement.id]).length;
    return q.points*correct/q.statements.length;
  }
  if(!Array.isArray(answer))return 0;
  const required=q.type==='A'?1:q.requiredCount;
  if(answer.length>required||new Set(answer).size!==answer.length||answer.some(id=>!q.options.some(option=>option.id===id)))return 0;
  const matches=answer.filter(id=>q.correctAnswer.includes(id)).length;
  return q.type==='A'?(matches===1?q.points:0):q.points*matches/required;
}
function caseStudyCorrectAnswer(q){
  if(q.type==='K')return q.statements.map(statement=>`${statement.id}: ${q.correctAnswer[statement.id]?'True':'False'}`).join(' · ');
  return q.correctAnswer.map(id=>`${id}) ${q.options.find(option=>option.id===id)?.text||''}`).join(' · ');
}
function caseStudyCandidateAnswer(q,answer){
  if(q.type==='K')return q.statements.map(statement=>`${statement.id}: ${typeof answer?.[statement.id]==='boolean'?(answer[statement.id]?'True':'False'):'Unanswered'}`).join(' · ');
  if(!Array.isArray(answer)||!answer.length)return 'Unanswered';
  return answer.map(id=>`${id}) ${q.options.find(option=>option.id===id)?.text||''}`).join(' · ');
}
function confirmFinishCaseStudy(){
  if(!CS||CS.phase!=='exam')return;
  const unanswered=CS.questions.length-Object.keys(CS.answers).length;
  if(unanswered&&!confirm(`You have ${unanswered} unanswered question${unanswered===1?'':'s'}. Finish anyway?`))return;
  finishCaseStudy(false);
}
function finishCaseStudy(timedOut){
  if(!CS||CS.phase!=='exam')return;
  if(caseStudyTimer){clearInterval(caseStudyTimer);caseStudyTimer=null;}
  let earned=0,correct=0;
  for(const q of CS.questions){const points=scoreCaseStudyQuestion(q,CS.answers[q.id]);earned+=points;if(Math.abs(points-q.points)<=1e-10)correct++;}
  const totalPoints=CS.questions.reduce((sum,q)=>sum+q.points,0),percentage=totalPoints?earned/totalPoints*100:0;
  const isFinalMock=CS.series==='final-mock';
  const attempt={version:1,mode:'case-study-mock',series:CS.series,mockId:CS.test.id,displayNumber:CS.displayNumber,date:new Date().toISOString(),earnedPoints:earned,totalPoints,percentage,passed:isFinalMock?percentage>=CS.test.passMark:null,correct,total:CS.questions.length,timedOut:isFinalMock&&!!timedOut,answers:CS.answers};
  try{localStorage.setItem(CASE_STUDY_ATTEMPTS_KEY,JSON.stringify([...readCaseStudyAttempts(),attempt]));}catch(error){console.warn('Case-study score could not be saved; existing study progress was not changed.',error);}
  CS={...CS,phase:'result',attempt};STATE={view:CS.series==='final-mock'?'mock-case-study-result':'case-study-result'};updateNav();renderCaseStudyResult();
}
function renderCaseStudyResult(){
  if(!CS||CS.phase!=='result')return;
  const {attempt,questions,test}=CS,isFinalMock=CS.series==='final-mock',pass=attempt.passed;
  const backButton=CS.series==='final-mock'?`<button class="btn btn-s" onclick="navigate('mock')">Back to Final Mock</button>`:`<button class="btn btn-s" onclick="navigate('case-study')">All case studies</button>`;
  const retakeButton=CS.series==='final-mock'?`<button class="btn btn-p" onclick="startMockExam('mock-set-${CS.displayNumber}')">Retake test</button>`:`<button class="btn btn-p" onclick="startCaseStudy('${test.id}')">Retake test</button>`;
  const saveLabel=CS.series==='final-mock'?'Final Mock attempt 11–15':'Case study attempt';
  $('main').innerHTML=`<div class="qz-wrap"><div class="score-card"><div class="score-num ${isFinalMock?(pass?'pass':'fail'):''}">${Math.round(attempt.percentage)}%</div>${isFinalMock?`<div class="pass-badge ${pass?'pass':'fail'}">${pass?`${svgIcon('check')} PASS`:`${svgIcon('close')} FAIL`} — threshold ${test.passMark}%</div>`:''}<p style="font-size:.87rem;color:var(--text2)">${attempt.earnedPoints.toFixed(2).replace(/\.00$/,'')} / ${attempt.totalPoints} points · ${attempt.correct} fully correct${attempt.timedOut?' · Time expired':''}</p><p class="pg-sub">Saved to ${saveLabel} history only; chapter, flashcard, and Revisit Later progress was not changed.</p></div><div style="display:flex;gap:.7rem;flex-wrap:wrap">${retakeButton}${backButton}</div><h2 style="font-size:1.1rem">Answer review</h2>${questions.map((q,index)=>{const answer=attempt.answers[q.id],earned=scoreCaseStudyQuestion(q,answer),full=Math.abs(earned-q.points)<=1e-10;return `<article class="missed-item" style="border-color:${full?'var(--ok-bg)':'var(--err-bg)'}"><div class="qz-meta"><span>${index+1}. ${escHtml(q.id)} · <span class="qtype-tag">${q.type}</span></span><b>${earned.toFixed(2).replace(/\.00$/,'')} / ${q.points} points</b></div><p class="missed-q" style="margin-top:.5rem">${escHtml(q.prompt)}</p>${q.type==='K'?q.statements.map(statement=>`<p>${escHtml(statement.id)}. ${escHtml(statement.text)} — Your answer: <b>${typeof answer?.[statement.id]==='boolean'?(answer[statement.id]?'True':'False'):'Unanswered'}</b> · Correct: <b>${q.correctAnswer[statement.id]?'True':'False'}</b></p>`).join(''):`<p><b>Your answer:</b> ${escHtml(caseStudyCandidateAnswer(q,answer))}</p><p><b>Correct answer:</b> ${escHtml(caseStudyCorrectAnswer(q))}</p>`}${q.explanation?`<p class="missed-exp">${escHtml(q.explanation)}</p>`:''}<p class="rv-meta">${escHtml(q.reference||'')}</p></article>`}).join('')}</div>`;
}

function renderRevisit(){
  const m=$('main');
  const revisitItems=readRevisit()
    .map(r=>({meta:r,resolved:findQuestion(r.chapterId,r.questionId)}))
    .filter(x=>x.resolved)
    .sort((a,b)=>new Date(b.meta.markedAt)-new Date(a.meta.markedAt));

  let html=`<div class="pg-hdr"><h1 class="pg-title">Revisit Later</h1>
    <p class="pg-sub">Questions you marked during quizzes</p></div>`;

  if(!revisitItems.length){
    html+=`<div class="empty"><div class="empty-ic">${svgIcon('revisit')}</div><p class="empty-t">No marked questions</p>
      <p class="empty-b">Use the Revisit Later button in quiz mode to add questions here.</p></div>`;
    m.innerHTML=html;
    return;
  }

  html+=`<div class="card" style="margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;gap:.7rem;flex-wrap:wrap">
    <p style="font-size:.86rem;color:var(--text2)">${revisitItems.length} question${revisitItems.length!==1?'s':''} marked</p>
    <button class="btn btn-s" style="padding:.35rem .8rem" onclick="saveRevisit([]);renderRevisit()">Clear all</button>
  </div>
  <div class="rv-list">`;

  revisitItems.forEach(({meta,resolved})=>{
    const question=resolved.question;
    const type=chapterQuestionType(question);
    const correctIndices=type==='K'?[]:getCorrectIndices(question);
    const correctAnswers=type==='K'?question.statements.map(statement=>`${statement.id}: ${question.correctAnswer[statement.id]?'True':'False'}`).join(' · '):correctIndices.map(index=>`${String.fromCharCode(65+index)}. ${question.options?.[index]||''}`).filter(Boolean).join(' · ');
    html+=`<div class="rv-item">
      <div style="flex:1;min-width:0">
        <p class="rv-meta">Chapter ${resolved.chapter.number} · marked ${fmtDate(meta.markedAt)}</p>
        <p class="rv-q">${escHtml(question.question)}</p>
        ${question.imageDataUrl?`<img class="question-image" src="${question.imageDataUrl}" alt="${escHtml(question.imageAlt||'Question image')}">`:''}
        <p class="missed-ok" style="margin-top:.55rem"><strong>Correct answer${type==='K'||correctIndices.length!==1?'s':''}:</strong> ${escHtml(correctAnswers)}</p>
        ${question.explanation?`<p class="missed-exp">${escHtml(question.explanation)}</p>`:''}
      </div>
      <div style="display:flex;gap:.45rem;flex-wrap:wrap;justify-content:flex-end">
        <button class="btn btn-p" style="padding:.35rem .75rem" onclick="navigate('quiz',{chapterId:'${meta.chapterId}',questionId:'${meta.questionId}'})">Open</button>
        <button class="btn btn-g" style="padding:.35rem .75rem" onclick="removeRevisitQuestion('${meta.questionId}')">Remove</button>
      </div>
    </div>`;
  });

  html+=`</div>`;
  m.innerHTML=html;
}

/* =====================================================================
   PROGRESS OVERVIEW
===================================================================== */
function renderProgress(){
  let overallParts=[];
  let html=`<div class="pg-hdr"><h1 class="pg-title">Progress Overview</h1>
    <p class="pg-sub">Your readiness across all ${DATA.chapters.length} CPRE chapters</p></div>`;

  const stats=DATA.chapters.map(ch=>{
    const ids=ch.subchapters.flatMap(s=>s.flashcards.map(f=>f.id));
    const mastery=getMastery(ids);
    const best=getBestScore(ch.id);
    const attempts=getAttempts(ch.id);
    const lastDate=attempts[0]?.date||null;
    let readiness=null;
    if(best!==null) readiness=Math.round(mastery*.4+best*.6);
    else if(mastery>0) readiness=mastery;
    if(readiness!==null) overallParts.push(readiness);
    return {ch,mastery,best,lastDate,readiness};
  });

  const overall=overallParts.length?Math.round(overallParts.reduce((a,b)=>a+b,0)/overallParts.length):null;
  const passedCards=stats.filter(s=>s.mastery>=70).length;
  const passedQuiz=stats.filter(s=>s.best!==null&&s.best>=70).length;

  html+=`<div class="rd-summary">
    <div class="rd-stat"><div class="rd-val">${overall!==null?overall+'%':'—'}</div><div class="rd-lbl">Overall readiness</div></div>
    <div class="rd-stat"><div class="rd-val">${passedCards}/${DATA.chapters.length}</div><div class="rd-lbl">Chapters ≥70% mastered</div></div>
    <div class="rd-stat"><div class="rd-val">${passedQuiz}/${DATA.chapters.length}</div><div class="rd-lbl">Chapters quiz-passed</div></div>
  </div>
  <div class="card tbl-wrap" style="padding:0;overflow:hidden">
    <table><thead><tr>
      <th>#</th><th>Chapter</th><th>Flashcard mastery</th><th>Best quiz</th><th>Last quiz</th><th>Readiness</th>
    </tr></thead><tbody>`;

  stats.forEach(({ch,mastery,best,lastDate,readiness})=>{
    const rdCls=readiness===null?'rd-red':readiness>=70?'rd-green':readiness>=40?'rd-yellow':'rd-red';
    const rdLbl=readiness===null?'Not started':readiness>=70?'Ready':readiness>=40?'In progress':'Needs work';
    html+=`<tr>
      <td style="font-weight:700;color:var(--text2)">${ch.number}</td>
      <td style="font-weight:500">${ch.title}</td>
      <td><div style="display:flex;align-items:center;gap:.45rem">
        <div style="width:56px;height:5px;background:var(--border);border-radius:999px;overflow:hidden">
          <div style="width:${mastery}%;height:100%;background:var(--accent);border-radius:999px"></div></div>
        <span style="font-size:.83rem">${mastery}%</span></div></td>
      <td>${best!==null?`<span style="font-weight:600;color:${best>=70?'var(--ok)':'var(--err)'}">${best}%</span>`:'—'}</td>
      <td style="font-size:.82rem;color:var(--text2)">${fmtDate(lastDate)}</td>
      <td><span class="rd-badge ${rdCls}">${rdLbl}</span></td>
    </tr>`;
  });
  html+=`</tbody></table></div>
    <p style="font-size:.75rem;color:var(--text2);margin-top:.65rem">Readiness = 40% flashcard mastery + 60% best quiz score. Pass mark: 70%.</p>`;
  $('main').innerHTML=html;
}

/* =====================================================================
   SETTINGS MODAL
===================================================================== */
let confirmReset=false;
let pendingProgressImport=null;
function showSettings(){
  confirmReset=false;
  renderSettingsModal();
}
function renderSettingsModal(){
  const r=$('modal-root');
  r.innerHTML=`<div class="modal-ov" onclick="closeModal(event)">
    <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="settings-title" onclick="event.stopPropagation()">
      <h2 id="settings-title">Study settings</h2>
      <div class="theme-options"><label for="theme-select">Display mode</label><select id="theme-select" onchange="setTheme(this.value)"><option value="bright">Bright</option><option value="dark">Dark</option><option value="high-contrast">High contrast</option></select></div>
      <div class="card" style="margin-bottom:1rem"><h3 style="font-size:.92rem;margin-bottom:.3rem">Save or import progress</h3><p class="pg-sub" style="margin-bottom:.75rem">Downloads a backup of this browser’s saved flashcard schedule, quiz history, revisit list, and user-added questions and flashcards. Import only merges new records; existing records are never replaced.</p><div style="display:flex;gap:.65rem;flex-wrap:wrap"><button class="btn btn-p" onclick="exportProgress()">${svgIcon('download')} Save progress backup</button><label class="btn btn-s" for="progress-import-file" style="cursor:pointer">${svgIcon('upload')} Choose backup to import</label><input id="progress-import-file" type="file" accept="application/json,.json" hidden onchange="handleProgressFile(event)"></div></div>
      <p class="notice">Your existing saved answers, card schedule, and Revisit Later entries are not changed by opening settings or saving a backup. Import is optional and merge-only.</p>
      ${confirmReset?`<p><strong>Reset all progress?</strong> This existing action permanently removes this page’s built-in progress. It does not run unless you confirm below.</p><div class="modal-btns"><button class="btn btn-s" onclick="cancelReset()">Cancel</button><button class="btn btn-d" onclick="doReset()">Confirm reset</button></div>`:`<details style="margin-top:1rem"><summary style="cursor:pointer;color:var(--err);font-weight:700">Danger zone — reset progress</summary><p style="margin:.7rem 0">This is destructive. Save a backup first if you intend to use it.</p><div class="modal-btns"><button class="btn btn-d" onclick="askConfirmReset()">Continue to reset…</button><button class="btn btn-s" onclick="closeModalDirect()">Close</button></div></details>`}
    </div>
  </div>`;
  applyTheme(document.documentElement.dataset.theme||'bright');
}
function closeModal(e){ if(e.target.classList.contains('modal-ov')) closeModalDirect(); }
function closeModalDirect(){ $('modal-root').innerHTML=''; confirmReset=false; }
function askConfirmReset(){ confirmReset=true; renderSettingsModal(); }
function cancelReset(){confirmReset=false;renderSettingsModal();}
function doReset(){
  localStorage.removeItem(CARDS_KEY);
  localStorage.removeItem(QUIZZES_KEY);
  localStorage.removeItem(REVISIT_KEY);
  localStorage.removeItem(PROGRESS_BACKUP_KEY);
  closeModalDirect();
  QS=null; FS=null; MS=null;
  renderMain();
}

function safeReadArray(key){try{const value=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(value)?value:[]}catch{return [];}}
function exportProgress(){
  const snapshot={format:'cpre-study-progress',schemaVersion:1,exportedAt:new Date().toISOString(),data:{cards:readCards(),quizzes:readQuizzes(),revisit:readRevisit(),userQuestions:readUserQuestions(),userQuestionAttempts:safeReadArray(USER_QUESTION_ATTEMPTS_KEY),userFlashcards:readUserFlashcards()}};
  const blob=new Blob([JSON.stringify(snapshot,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download=`cpre-study-progress-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function validateProgressImport(snapshot){
  if(!snapshot||snapshot.format!=='cpre-study-progress'||snapshot.schemaVersion!==1||!snapshot.data)throw new Error('This is not a supported CPRE Study progress backup.');
  const data=snapshot.data;
  if(!data.cards||typeof data.cards!=='object'||Array.isArray(data.cards)||!Array.isArray(data.quizzes)||!Array.isArray(data.revisit)||!Array.isArray(data.userQuestions)||!Array.isArray(data.userQuestionAttempts)||(data.userFlashcards!==undefined&&!Array.isArray(data.userFlashcards)))throw new Error('The backup has missing or invalid data sections. Nothing was imported.');
  data.userFlashcards=data.userFlashcards||[];
  if(data.quizzes.some(item=>!item||typeof item!=='object')||data.revisit.some(item=>!item||typeof item.chapterId!=='string'||typeof item.questionId!=='string')||data.userQuestions.some(question=>!isValidUserQuestion(question))||data.userQuestionAttempts.some(item=>!item||typeof item!=='object')||data.userFlashcards.some(card=>!card||typeof card.id!=='string'||!/^user-fc-[A-Za-z0-9-]{8,80}$/.test(card.id)||typeof card.front!=='string'||!card.front.trim()||typeof card.back!=='string'||!card.back.trim()))throw new Error('The backup contains invalid records. Nothing was imported.');
  return data;
}
function stableRecordKey(record){
  if(!record||typeof record!=='object')return JSON.stringify(record);
  return JSON.stringify(Object.keys(record).sort().reduce((out,key)=>(out[key]=record[key],out),Object.create(null)));
}
function mergeUnique(current,incoming,keyFor){
  const out=[...current],seen=new Set(current.map(keyFor));
  for(const item of incoming){const key=keyFor(item);if(!seen.has(key)){out.push(item);seen.add(key);}}
  return out;
}
function handleProgressFile(event){
  const file=event.target.files?.[0];event.target.value='';if(!file)return;
  if(file.size>8*1024*1024){alert('Backup file is too large (maximum 8 MB).');return;}
  file.text().then(text=>{
    let snapshot;try{snapshot=JSON.parse(text)}catch{throw new Error('The selected file is not valid JSON.');}
    const data=validateProgressImport(snapshot);pendingProgressImport=data;
    renderImportPreview(data,snapshot.exportedAt);
  }).catch(error=>alert(error.message||'Could not read the backup.'));
}
function renderImportPreview(data,exportedAt){
  const root=$('modal-root');
  root.innerHTML=`<div class="modal-ov"><div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="import-preview-title"><h2 id="import-preview-title">Import progress backup</h2><p>Backup date: ${escHtml(exportedAt||'Unknown')}</p><p>This import is <strong>merge-only</strong>: current card records remain unchanged; only new card IDs, quiz attempts, revisit marks, user questions, custom attempts, and custom flashcards are added. Duplicate records are ignored.</p><div class="notice">Cards: ${Object.keys(data.cards).length} · quiz attempts: ${data.quizzes.length} · revisit marks: ${data.revisit.length} · user questions: ${data.userQuestions.length} · custom attempts: ${data.userQuestionAttempts.length} · custom flashcards: ${data.userFlashcards.length}</div><div class="modal-btns"><button class="btn btn-s" onclick="cancelProgressImport()">Cancel</button><button class="btn btn-p" onclick="commitProgressImport()">Merge into this browser</button></div></div></div>`;
}
function cancelProgressImport(){pendingProgressImport=null;closeModalDirect();}
function commitProgressImport(){
  if(!pendingProgressImport)return;
  const data=pendingProgressImport,keys=[CARDS_KEY,QUIZZES_KEY,REVISIT_KEY,USER_QUESTIONS_KEY,USER_QUESTION_ATTEMPTS_KEY,USER_FLASHCARDS_KEY],oldRaw={};
  try{
    keys.forEach(key=>oldRaw[key]=localStorage.getItem(key));
    const parseExisting=(key,fallback)=>{const raw=oldRaw[key];if(raw===null)return fallback;const value=JSON.parse(raw);return value;};
    const currentCards=parseExisting(CARDS_KEY,{}),currentQuizzes=parseExisting(QUIZZES_KEY,[]),currentRevisit=parseExisting(REVISIT_KEY,[]),currentQuestions=parseExisting(USER_QUESTIONS_KEY,[]),currentCustomAttempts=parseExisting(USER_QUESTION_ATTEMPTS_KEY,[]),currentUserFlashcards=parseExisting(USER_FLASHCARDS_KEY,[]);
    if(!currentCards||typeof currentCards!=='object'||Array.isArray(currentCards)||![currentQuizzes,currentRevisit,currentQuestions,currentCustomAttempts,currentUserFlashcards].every(Array.isArray))throw new Error('Current progress has an unexpected format; import stopped to avoid changing it.');
    const mergedCards={...currentCards};Object.entries(data.cards).forEach(([id,value])=>{if(!Object.hasOwn(mergedCards,id))mergedCards[id]=value;});
    const mergedQuizzes=mergeUnique(currentQuizzes,data.quizzes,stableRecordKey);
    const mergedRevisit=mergeUnique(currentRevisit,data.revisit,item=>`${item.chapterId}\u0000${item.questionId}`);
    const mergedQuestions=mergeUnique(currentQuestions,data.userQuestions,item=>item.id);
    const mergedCustomAttempts=mergeUnique(currentCustomAttempts,data.userQuestionAttempts,stableRecordKey);
    const mergedUserFlashcards=mergeUnique(currentUserFlashcards,data.userFlashcards,item=>item.id);
    const nextValues={[CARDS_KEY]:mergedCards,[QUIZZES_KEY]:mergedQuizzes,[REVISIT_KEY]:mergedRevisit,[USER_QUESTIONS_KEY]:mergedQuestions,[USER_QUESTION_ATTEMPTS_KEY]:mergedCustomAttempts,[USER_FLASHCARDS_KEY]:mergedUserFlashcards};
    const preImport={savedAt:new Date().toISOString(),raw:oldRaw};
    localStorage.setItem(IMPORT_BACKUP_KEY,JSON.stringify(preImport));
    try{for(const key of keys)localStorage.setItem(key,JSON.stringify(nextValues[key]));}
    catch(error){for(const key of keys){if(oldRaw[key]===null)localStorage.removeItem(key);else localStorage.setItem(key,oldRaw[key]);}throw error;}
    pendingProgressImport=null;closeModalDirect();renderMain();alert('Backup merged. Existing records were kept; only new items were added.');
  }catch(error){alert(error.message||'Import failed. Existing progress was not intentionally replaced.');}
}

/* =====================================================================
   MAIN RENDER ROUTER
===================================================================== */
function renderMain(){
  switch(STATE.view){
    case 'dashboard':  renderDashboard(); break;
    case 'chapter':    renderChapterDetail(); break;
    case 'flashcards': renderFlashcards(); break;
    case 'quiz':       renderQuiz(); break;
    case 'mock':       renderMock(); break;
    case 'case-study': renderCaseStudy(); break;
    case 'case-study-run': renderCaseStudyQuestion(); break;
    case 'case-study-result': renderCaseStudyResult(); break;
    case 'mock-case-study-run': renderCaseStudyQuestion(); break;
    case 'mock-case-study-result': renderCaseStudyResult(); break;
    case 'revisit':    renderRevisit(); break;
    case 'progress':   renderProgress(); break;
    case 'user-questions': renderUserQuestions(); break;
    case 'user-flashcards': renderUserFlashcards(); break;
    default:           renderDashboard();
  }
}

/* =====================================================================
   UTILITY
===================================================================== */
function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

window.CPRE_DATA = DATA;
window.CPRE_DATA.MOCK_SETS = MOCK_SETS;
initializeTheme();
updateNav();

startupSplash?.style.setProperty('--loading-duration','3000ms');
const startupMinimum=new Promise(resolve=>setTimeout(resolve,3000));
const startupFallback=new Promise(resolve=>setTimeout(resolve,8000));
Promise.race([Promise.all([loadMockBank(),startupMinimum]),startupFallback]).finally(hideStartupSplash);
