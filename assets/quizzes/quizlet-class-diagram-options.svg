<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590" role="img" aria-labelledby="title desc">
<title id="title">Four student–lecturer class diagram options</title>
<desc id="desc">Four UML multiplicity choices. Option B is correct: each student has exactly one lecturer, while a lecturer may supervise zero or many students.</desc>
<defs><style>.panel{fill:#fff;stroke:#d9d2dc;stroke-width:2;rx:12}.correct{fill:#f1e4f1;stroke:#76227b;stroke-width:3}.cls{fill:#fff;stroke:#51475a;stroke-width:2;rx:6}.heading{font:700 21px system-ui,sans-serif;fill:#241b2a}.label{font:600 16px system-ui,sans-serif;fill:#504658}.multi{font:700 18px system-ui,sans-serif;fill:#76227b}.line{stroke:#51475a;stroke-width:2.5}</style></defs>
<rect width="1080" height="590" fill="#fbf9fc"/><text x="540" y="38" text-anchor="middle" class="heading">Which multiplicities fit the student–lecturer relationship?</text>
<g transform="translate(30 65)"><rect class="panel" width="500" height="220"/><text x="22" y="36" class="heading">A</text><rect class="cls" x="65" y="75" width="145" height="58"/><text x="137" y="111" text-anchor="middle" class="label">Student</text><rect class="cls" x="290" y="75" width="145" height="58"/><text x="362" y="111" text-anchor="middle" class="label">Lecturer</text><line class="line" x1="210" y1="104" x2="290" y2="104"/><text x="220" y="158" class="multi">0..*</text><text x="265" y="158" class="multi">0..*</text><text x="250" y="196" text-anchor="middle" class="label">Many-to-many</text></g>
<g transform="translate(550 65)"><rect class="panel correct" width="500" height="220"/><text x="22" y="36" class="heading">B · Correct</text><rect class="cls" x="65" y="75" width="145" height="58"/><text x="137" y="111" text-anchor="middle" class="label">Student</text><rect class="cls" x="290" y="75" width="145" height="58"/><text x="362" y="111" text-anchor="middle" class="label">Lecturer</text><line class="line" x1="210" y1="104" x2="290" y2="104"/><text x="220" y="158" class="multi">0..*</text><text x="265" y="158" class="multi">1</text><text x="250" y="196" text-anchor="middle" class="label">Each student has one; lecturer has zero or many</text></g>
<g transform="translate(30 315)"><rect class="panel" width="500" height="220"/><text x="22" y="36" class="heading">C</text><rect class="cls" x="65" y="75" width="145" height="58"/><text x="137" y="111" text-anchor="middle" class="label">Student</text><rect class="cls" x="290" y="75" width="145" height="58"/><text x="362" y="111" text-anchor="middle" class="label">Lecturer</text><line class="line" x1="210" y1="104" x2="290" y2="104"/><text x="220" y="158" class="multi">1</text><text x="265" y="158" class="multi">1</text><text x="250" y="196" text-anchor="middle" class="label">One-to-one only</text></g>
<g transform="translate(550 315)"><rect class="panel" width="500" height="220"/><text x="22" y="36" class="heading">D</text><rect class="cls" x="65" y="75" width="145" height="58"/><text x="137" y="111" text-anchor="middle" class="label">Student</text><rect class="cls" x="290" y="75" width="145" height="58"/><text x="362" y="111" text-anchor="middle" class="label">Lecturer</text><line class="line" x1="210" y1="104" x2="290" y2="104"/><text x="220" y="158" class="multi">1..*</text><text x="265" y="158" class="multi">1</text><text x="250" y="196" text-anchor="middle" class="label">Every lecturer must supervise students</text></g>
</svg>
