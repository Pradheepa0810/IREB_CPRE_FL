<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">CPRE Study Progress Overview preview</title>
  <desc id="desc">A preview of current progress metrics: overall readiness, chapters mastered, quiz-passed chapters, and a per-chapter readiness table. Sample values represent a fresh study profile.</desc>
