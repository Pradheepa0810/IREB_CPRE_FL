    <g transform="translate(808 184)"><rect width="330" height="104" rx="13" fill="#fff" stroke="#ded9df" stroke-width="2"/><text x="24" y="49" fill="#76227b" font-size="30" font-weight="700">0/7</text><text x="24" y="78" fill="#615963" font-size="15">Chapters quiz-passed</text></g>
