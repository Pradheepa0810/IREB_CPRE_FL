  <rect width="1200" height="68" fill="#76227b"/>
  <text x="54" y="43" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">▤ CPRE <tspan fill="#ead6eb">Study</tspan></text>
