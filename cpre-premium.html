 statements are CORRECT regarding the introduction of an RE tool?",options:["The tool defines the future RE approach; license costs are the greatest cost block","Risks can be identified through a pilot operation; RE processes must be clearly defined before introduction","RE processes must be defined after introduction based on what the tool supports","License costs are the greatest block; pilot operation is unnecessary"],correctIndex:1,explanation:"Best practice: define RE processes FIRST, then select/introduce a tool. Pilot operations help identify risks. The tool should support your process, not define it. License costs are rarely the biggest factor."},{id:"ch7-q4",question:"Which tool is a dedicated Requirements Management Tool (RMT)?",options:["Microsoft Word","IBM DOORS","Eclipse IDE","Git"],correctIndex:1,explanation:"IBM DOORS (Dynamic Object-Oriented Requirements System) is a dedicated RMT providing structured storage, versioning, traceability, and change management. Word is a word processor; Eclipse is an IDE; Git is version control."},{id:"ch7-q5",question:"Which statement about RE tool support is CORRECT?",options:["A good RE tool can substitute for experienced Requirements Engineers","Tools are only useful for projects with hundreds of requirements","Tools support traceability and versioning but cannot replace human RE skills","RE tools eliminate the need for requirements reviews and validation"],correctIndex:2,explanation:"Tools are enablers — they handle traceability, versioning, and storage efficiently. But elicitation, conflict resolution, and validation are human activities that tools cannot replace."},{id:"ch7-q6",question:"What is a significant RISK when using requirements management tools?",options:["Requirements will be too well organised","The tool creates automatic traceability without human input","Teams focus on maintaining the tool rather than improving requirements quality","Tools make requirements too easily accessible"],correctIndex:2,explanation:"A common pitfall: teams invest effort in filling in tool fields while the actual quality of requirements stagnates. Tools support RE but cannot guarantee requirement quality."}]
}
]};

let STATE = {view: 'dashboard', chapterId: null};
let STUDY = null;
let QS = null;
let DARKMODE = localStorage.getItem('cpre_darkmode') === 'true';
let confirmReset = false;

if (DARKMODE) document.documentElement.classList.add('dark-mode');

const CARDS_KEY = 'cpre_cards';
const QUIZZES_KEY = 'cpre_quizzes';
const PASS = 0.70;

function readCards() { try{return JSON.parse(localStorage.getItem(CARDS_KEY)||'{}')}catch{return{}} }
function readQuizzes() { try{return JSON.parse(localStorage.getItem(QUIZZES_KEY)||'[]')}catch{return[]} }
function saveCards(c) { localStorage.setItem(CARDS_KEY,JSON.stringify(c)); }
function saveQuizzes(q) { localStorage.setItem(QUIZZES_KEY,JSON.stringify(q)); }

function getCard(id) { return readCards()[id]||{timesCorrect:0,timesSeen:0,lastSeen:null,nextReviewDate:null}; }
function updateCard(id, patch) { const c = readCards(); c[id] = {...getCard(id), ...patch}; saveCards(c); }

function getMastery(cardIds) {
  if (!cardIds.length) return 0;
  const now = new Date(), cards = readCards();
  const n = cardIds.filter(id => {
    const c = cards[id];
    return c && c.timesCorrect >= 2 && c.nextReviewDate && new Date(c.nextReviewDate) > now;
  }).length;
  return Math.round(n / cardIds.length * 100);
}
function getDueCount(cardIds) { 
  const cards = readCards(); 
  return cardIds.filter(id => !getCard(id).nextReviewDate || new Date(getCard(id).nextReviewDate) <= new Date()).length; 
}
function getBestScore(chId) { 
  const a = readQuizzes().filter(q => q.chapterId === chId);
  if (!a.length) return null;
  return Math.round(Math.max(...a.map(q => q.score / q.totalQuestions)) * 100);
}
function getAttempts(chId) { 
  return readQuizzes().filter(q => q.chapterId === chId).sort((a, b) => new Date(b.date) - new Date(a.date));
}
function recordAttempt(att) { 
  const q = readQuizzes();
  q.push({...att, date: new Date().toISOString()});
  saveQuizzes(q);
}

function fmtDate(iso) { 
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString(undefined, {day: 'numeric', month: 'short', year: 'numeric'});
}

/* =====================================================================
   NAVIGATION & RENDERING
===================================================================== */
function navigate(view, extra) {
  STATE = {view, ...extra};
  ['dashboard','progress','stats'].forEach(id => {
    const btn = document.getElementById('nav-'+id);
    if(btn) btn.classList.toggle('active', view === id);
  });
  render();
  window.scrollTo(0, 0);
}

function render() {
  const m = document.getElementById('main');
  switch(STATE.view) {
    case 'dashboard': m.innerHTML = renderDashboard(); break;
    case 'study': m.innerHTML = renderStudy(); break;
    case 'quiz': m.innerHTML = renderQuiz(); break;
    case 'progress': m.innerHTML = renderProgress(); break;
    case 'stats': m.innerHTML = renderStats(); break;
  }
}

function qzChoose(i) {
  if (QS.answered) return;
  QS.selected = i;
  QS.answered = true;
  const q = QS.questions[QS.idx];
  QS.results.push({question: q, selectedIndex: i, correct: i === q.correctIndex});
  render();
}

function qzNext() {
  QS.idx++;
  QS.selected = null;
  QS.answered = false;
  if (QS.idx >= QS.questions.length) finishQuiz();
  else render();
}

function finishQuiz() {
  const correct = QS.results.filter(r => r.correct).length;
  const total = QS.questions.length;
  recordAttempt({chapterId: QS.chapterId, score: correct, totalQuestions: total, missedQuestionIds: QS.results.filter(r => !r.correct).map(r => r.question.id)});
  QS.mode = 'result';
  render();
}

function flipCard() {
  if (!STUDY || STUDY.idx >= STUDY.cards.length) return;
  STUDY.flipped = !STUDY.flipped;
  render();
}

function reviewCard(confidence) {
  if (!STUDY || !STUDY.flipped) return;
  
  const card = STUDY.cards[STUDY.idx];
  STUDY.reviews[card.id] = confidence;
  
  const cur = getCard(card.id);
  let tc = cur.timesCorrect || 0;
  if (confidence === 'easy') tc++;
  else if (confidence === 'good') tc++;
  
  const d = new Date();
  const intervals = {again: 0, hard: 1, good: 3, easy: 7};
  d.setDate(d.getDate() + intervals[confidence]);
  
  updateCard(card.id, {timesCorrect: tc, timesSeen: (cur.timesSeen||0)+1, nextReviewDate: d.toISOString()});
  
  if (STUDY.idx + 1 >= STUDY.cards.length) showResults();
  else {
    STUDY.idx++;
    STUDY.flipped = false;
    render();
  }
}

function updateCard(id, patch) {
  const c = readCards();
  c[id] = {...getCard(id), ...patch};
  saveCards(c);
}

function showResults() {
  const scores = Object.entries(STUDY.reviews);
  const good = scores.filter(([,v]) => v === 'good' || v === 'easy').length;
  const pct = Math.round(good / STUDY.cards.length * 100);
  
  const html = `

}

function renderStats() {
  const attempts = readQuizzes();
  const totalAttempts = attempts.length;
  const totalCorrect = attempts.reduce((sum, a) => sum + a.score, 0);
  const totalQuestions = attempts.reduce((sum, a) => sum + a.totalQuestions, 0);
  const avgScore = totalAttempts > 0 ? Math.round(totalCorrect / totalQuestions * 100) : 0;
  
  const chapterStats = DATA.chapters.map(ch => {
    const chAttempts = attempts.filter(a => a.chapterId === ch.id);
    const chScores = chAttempts.map(a => Math.round(a.score / a.totalQuestions * 100));
    const bestScore = chScores.length > 0 ? Math.max(...chScores) : null;
    return {ch, attempts: chAttempts.length, bestScore};
  });

  return `
    <div style="max-width:900px;margin:0 auto">
      <h1 style="font-size:1.75rem;font-weight:700;margin-bottom:2rem">Statistics & Performance</h1>
      
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin-bottom:2rem">
        <div style="background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:1.25rem;text-align:center">
          <div style="font-size:2rem;font-weight:800;color:var(--primary);margin-bottom:0.25rem">${totalAttempts}</div>
          <div style="font-size:0.8rem;color:var(--text-secondary)">Quiz attempts</div>
        </div>
        <div style="background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:1.25rem;text-align:center">
          <div style="font-size:2rem;font-weight:800;color:var(--primary);margin-bottom:0.25rem">${avgScore}%</div>
          <div style="font-size:0.8rem;color:var(--text-secondary)">Average score</div>
        </div>
        <div style="background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:1.25rem;text-align:center">
          <div style="font-size:2rem;font-weight:800;color:var(--primary);margin-bottom:0.25rem">${totalCorrect}</div>
          <div style="font-size:0.8rem;color:var(--text-secondary)">Questions correct</div>
        </div>
      </div>

      <div style="background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:1.5rem">
        <h2 style="font-size:1.1rem;font-weight:700;margin-bottom:1rem">Performance by chapter</h2>
        ${chapterStats.map(({ch, attempts, bestScore}) => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:0.75rem;border-bottom:1px solid var(--border-light)">
            <div>
              <div style="font-weight:600">${ch.title}</div>
              <div style="font-size:0.85rem;color:var(--text-secondary)">${attempts} quiz ${attempts === 1 ? 'attempt' : 'attempts'}</div>
            </div>
            <div style="text-align:right">
              ${bestScore !== null ? `<div style="font-size:1.25rem;font-weight:700;color:${bestScore >= 70 ? 'var(--success)' : 'var(--error)'}">${bestScore}%</div>` : '<div style="color:var(--text-secondary)">—</div>'}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

/* =====================================================================
   UTILITIES
===================================================================== */
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleDarkMode() {
  DARKMODE = !DARKMODE;
  localStorage.setItem('cpre_darkmode', DARKMODE);
  document.documentElement.classList.toggle('dark-mode', DARKMODE);
}

function showSettings() {
  confirmReset = false;
  renderSettingsModal();
}

function renderSettingsModal() {
  const r = document.getElementById('modal-root');
  r.innerHTML = `<div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:200" onclick="if(event.target===event.currentTarget)closeModalDirect()">
    <div style="background:var(--bg-card);border-radius:var(--radius-xl);padding:2rem;max-width:500px;width:90%;box-shadow:0 20px 25px -5px rgba(0,0,0,0.1)">
      <h2 style="font-size:1.3rem;font-weight:700;margin-bottom:1rem">⚙️ Settings</h2>
      ${!confirmReset ? `
        <p style="color:var(--text-secondary);margin-bottom:1.5rem">Reset all your study progress — flashcard history, spaced-repetition schedules, and quiz attempt records will be permanently deleted from this browser.</p>
        <div style="display:flex;gap:0.75rem;justify-content:flex-end">
          <button class="btn btn-secondary" onclick="closeModalDirect()">Cancel</button>
          <button style="padding:0.55rem 1.15rem;background:var(--error);color:white;border:none;border-radius:var(--radius-sm);font-weight:600;cursor:pointer" onclick="askConfirmReset()">Reset progress…</button>
        </div>
      ` : `
        <p style="color:var(--text-secondary);margin-bottom:1.5rem"><strong>Are you sure?</strong> This cannot be undone. All flashcard mastery data and quiz scores will be permanently erased.</p>
        <div style="display:flex;gap:0.75rem;justify-content:flex-end">
          <button class="btn btn-secondary" onclick="closeModalDirect()">Cancel</button>
          <button style="padding:0.55rem 1.15rem;background:var(--error);color:white;border:none;border-radius:var(--radius-sm);font-weight:600;cursor:pointer" onclick="doReset()">Yes, reset everything</button>
        </div>
      `}
    </div>
  </div>`;
}

function closeModalDirect() {
  document.getElementById('modal-root').innerHTML = '';
  confirmReset = false;
}

function askConfirmReset() {
  confirmReset = true;
  renderSettingsModal();
}

function doReset() {
  localStorage.removeItem(CARDS_KEY);
  localStorage.removeItem(QUIZZES_KEY);
  closeModalDirect();
  QS = null;
  STUDY = null;
  render();
}

/* =====================================================================
   INIT
===================================================================== */
navigate('dashboard');
</script>
</body>
</html>
